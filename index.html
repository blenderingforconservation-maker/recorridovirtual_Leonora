<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>WebAR Pasillo Xilitla · Descubrimiento de Escultura</title>
  
  <!-- Tailwind CSS para la interfaz de usuario (UI/UX) -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Cinzel (Arte) e Inter (Lectura UI) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Importmap para Three.js r160 y GLTFLoader -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #07140e;
      font-family: 'Inter', sans-serif;
      touch-action: none;
    }

    .font-serif-art {
      font-family: 'Cinzel', serif;
    }

    /* Fondo del Pasillo Selvático de Xilitla (CSS Backdrop + soporte de imagen) */
    #illustration-backdrop {
      position: fixed;
      inset: 0;
      z-index: 0;
      background-color: #0b1c14;
      background-size: cover;
      background-position: center 40%;
      background-repeat: no-repeat;
      filter: brightness(0.88) contrast(1.06);
      pointer-events: none;
      transition: opacity 0.6s ease, transform 0.2s ease-out;
    }

    /* Rayos de sol volumétricos filtrándose desde la apertura superior del pasillo */
    #god-rays {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: conic-gradient(
        from 155deg at 52% -10%,
        transparent 0deg,
        rgba(236, 253, 245, 0.14) 16deg,
        transparent 32deg,
        rgba(254, 240, 138, 0.12) 45deg,
        transparent 62deg
      );
      mix-blend-mode: screen;
    }

    /* Video de cámara trasera para modo WebAR */
    #ar-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
      opacity: 0;
      transition: opacity 0.5s ease;
      pointer-events: none;
    }

    #ar-video.active {
      opacity: 1;
    }

    /* Lienzo WebGL de Three.js */
    #webgl-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      touch-action: none;
      cursor: grab;
    }

    #webgl-container:active {
      cursor: grabbing;
    }

    /* Viñeta orgánica suave que enmarca los muros de piedra */
    .jungle-vignette {
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      background: radial-gradient(circle at 50% 48%, transparent 52%, rgba(4, 12, 8, 0.72) 100%);
    }

    /* Capa HUD minimalista optimizada para móvil horizontal y vertical */
    #ui-layer {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: env(safe-area-inset-top, 12px) env(safe-area-inset-right, 16px) env(safe-area-inset-bottom, 12px) env(safe-area-inset-left, 16px);
    }

    .interactive-ui {
      pointer-events: auto;
    }

    /* Animación de la mano guía inicial */
    @keyframes swipeHint {
      0%, 100% { transform: translateX(-22px) rotate(-8deg); opacity: 0.5; }
      50% { transform: translateX(22px) rotate(8deg); opacity: 1; }
    }

    .animate-swipe-hand {
      animation: swipeHint 2.2s ease-in-out infinite;
    }

    /* Rastro visual del dedo al apartar hojas */
    #touch-ripple {
      position: fixed;
      width: 44px;
      height: 44px;
      border-radius: 9999px;
      pointer-events: none;
      z-index: 9;
      background: radial-gradient(circle, rgba(253, 224, 71, 0.45) 0%, rgba(52, 211, 153, 0.2) 55%, transparent 75%);
      box-shadow: 0 0 20px rgba(110, 231, 183, 0.55);
      transform: translate(-50%, -50%) scale(0.4);
      opacity: 0;
      transition: opacity 0.2s ease, transform 0.15s ease;
    }

    #touch-ripple.active {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }
  </style>
</head>
<body>

  <!-- 1. FONDO DEL PASILLO DE XILITLA Y LUZ CENITAL -->
  <div id="illustration-backdrop"></div>
  <div id="god-rays"></div>

  <!-- 2. VIDEO DE CÁMARA TRASERA PARA WEBAR -->
  <video id="ar-video" autoplay playsinline muted></video>

  <!-- 3. CONTENEDOR WEBGL (THREE.JS) -->
  <div id="webgl-container"></div>

  <!-- 4. VIÑETA NATURAL Y FEEDBACK TÁCTIL -->
  <div class="jungle-vignette"></div>
  <div id="touch-ripple"></div>

  <!-- 5. PANTALLA DE CARGA -->
  <div id="loading-screen" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-stone-950/95 backdrop-blur-md transition-opacity duration-700 px-6 text-center">
    <div class="w-14 h-14 mb-4 rounded-2xl bg-emerald-500/15 border border-emerald-400/30 flex items-center justify-center shadow-lg shadow-emerald-950/60">
      <svg class="w-8 h-8 text-emerald-300 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" />
      </svg>
    </div>
    <h1 class="font-serif-art text-xl sm:text-2xl text-emerald-50 tracking-widest mb-1.5">PASILLO XILITLA · WEBAR</h1>
    <p id="loading-status" class="text-xs sm:text-sm text-emerald-300/80 mb-5 max-w-xs">Integrando pasillo de piedra, orquídeas silvestres y capas táctiles...</p>
    <div class="w-60 sm:w-72 h-1.5 bg-stone-800 rounded-full overflow-hidden border border-stone-700">
      <div id="loading-bar" class="h-full bg-gradient-to-r from-emerald-500 via-teal-400 to-amber-300 w-0 transition-all duration-300"></div>
    </div>
    <span id="loading-percent" class="text-[11px] font-mono text-stone-400 mt-2">0%</span>
  </div>

  <!-- 6. INTERFAZ UI/UX MINIMALISTA E INMERSIVA -->
  <div id="ui-layer" class="p-3 sm:p-4">
    
    <!-- Barra Superior Compacta: Progreso de Descubrimiento + Acciones Rápidas -->
    <header class="w-full flex items-center justify-between gap-2">
      
      <!-- Píldora de Progreso de Descubrimiento -->
      <div id="discovery-pill" class="flex items-center gap-3 bg-stone-950/65 backdrop-blur-md border border-emerald-400/25 rounded-full pl-3.5 pr-4 py-1.5 shadow-xl transition-all duration-500">
        <span id="status-dot" class="w-2 h-2 rounded-full bg-amber-300 animate-ping shrink-0"></span>
        <div class="flex flex-col">
          <div class="flex items-center gap-2">
            <span id="discovery-label" class="text-[11px] sm:text-xs font-medium text-emerald-50 tracking-wide">Despeja la selva</span>
            <span id="discovery-count" class="text-[11px] font-mono font-semibold text-amber-300">0%</span>
          </div>
          <div class="w-28 sm:w-36 h-1 bg-stone-800/90 rounded-full overflow-hidden mt-0.5">
            <div id="discovery-bar" class="h-full bg-gradient-to-r from-emerald-400 to-amber-300 w-0 transition-all duration-300"></div>
          </div>
        </div>
      </div>

      <!-- Controles Flotantes Traslúcidos -->
      <div class="flex items-center gap-1.5 interactive-ui">
        
        <!-- Botón Pantalla Completa -->
        <button id="btn-fullscreen" title="Alternar Pantalla Completa" class="p-2 rounded-full bg-stone-950/65 hover:bg-stone-900/85 active:scale-95 text-emerald-100 border border-white/15 backdrop-blur-md shadow-lg transition-all">
          <svg id="icon-expand" class="w-4 h-4 text-emerald-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
          </svg>
          <svg id="icon-compress" class="w-4 h-4 text-emerald-200 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3" />
          </svg>
        </button>

        <!-- NUEVO: Cargar imagen del Pasillo Xilitla personalizada -->
        <label for="bg-upload" title="Cambiar foto del Pasillo Xilitla" class="cursor-pointer flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium bg-stone-950/65 hover:bg-stone-900/85 active:scale-95 text-emerald-100 border border-emerald-400/30 backdrop-blur-md shadow-lg transition-all">
          <svg class="w-3.5 h-3.5 text-emerald-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
          </svg>
          <span class="hidden sm:inline">Fondo Pasillo</span>
        </label>
        <input id="bg-upload" type="file" accept="image/*" class="hidden" />

        <!-- Cargar modelo .GLB propio -->
        <label for="glb-upload" title="Cargar escultura .GLB" class="cursor-pointer flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium bg-stone-950/65 hover:bg-stone-900/85 active:scale-95 text-emerald-100 border border-white/15 backdrop-blur-md shadow-lg transition-all">
          <svg class="w-3.5 h-3.5 text-amber-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
          </svg>
          <span class="hidden sm:inline">Cargar .GLB</span>
        </label>
        <input id="glb-upload" type="file" accept=".glb,.gltf" class="hidden" />

        <!-- Reiniciar experiencia -->
        <button id="btn-reset" title="Cubrir escultura nuevamente" class="flex items-center gap-1 px-2.5 py-1.5 rounded-full text-xs font-medium bg-stone-950/65 hover:bg-stone-900/85 active:scale-95 text-emerald-200 border border-white/15 backdrop-blur-md shadow-lg transition-all">
          <svg class="w-3.5 h-3.5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
          <span class="hidden md:inline">Reiniciar</span>
        </button>

        <!-- Sonido Ambiental -->
        <button id="btn-sound" title="Sonido de selva" class="p-2 rounded-full bg-stone-950/65 hover:bg-stone-900/85 active:scale-95 text-emerald-300 border border-white/15 backdrop-blur-md shadow-lg transition-all">
          <svg id="icon-sound-on" class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
          </svg>
        </button>
      </div>
    </header>

    <!-- Guía Gestual Central -->
    <div id="onboarding-hint" class="self-center flex flex-col items-center text-center pointer-events-none transition-opacity duration-700">
      <div class="w-11 h-11 rounded-full bg-stone-950/60 border border-amber-300/40 backdrop-blur-md flex items-center justify-center mb-2 shadow-lg">
        <svg class="w-6 h-6 text-amber-300 animate-swipe-hand" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M7 11.5V14m0-2.5v-6a1.5 1.5 0 113 0m-3 6a1.5 1.5 0 00-3 0v2a7.5 7.5 0 0015 0v-5a1.5 1.5 0 00-3 0m-6-3V11m0-5.5v-1a1.5 1.5 0 013 0v1m0 0V11m0-5.5a1.5 1.5 0 013 0v3m0 0V11" />
        </svg>
      </div>
      <p id="hint-text" class="px-3.5 py-1 rounded-full bg-stone-950/70 backdrop-blur-md border border-white/10 text-emerald-50 text-xs font-medium shadow-xl">
        Desliza tu dedo para apartar las plantas del pasillo y descubrir la escultura
      </p>
    </div>

    <!-- Pie de Página Minimalista -->
    <footer class="w-full flex items-end justify-between gap-2">
      <div id="toast-message" class="bg-stone-950/80 backdrop-blur-md border border-emerald-400/30 text-emerald-100 px-3.5 py-1.5 rounded-full text-xs shadow-xl transition-all duration-300 opacity-0 pointer-events-none transform translate-y-2">
        Pasillo de Xilitla listo
      </div>

      <button id="btn-toggle-camera" class="interactive-ui flex items-center gap-2 px-4 py-2 rounded-full text-xs font-semibold bg-emerald-600/80 hover:bg-emerald-500 active:scale-95 text-white border border-emerald-300/40 backdrop-blur-md shadow-xl transition-all">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
        <span id="camera-btn-text">Cámara AR</span>
      </button>
    </footer>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const REPO_RAW_BASE = 'https://raw.githubusercontent.com/blenderingforconservation-maker/recorridovirtual_Leonora/main/';

    const CONFIG = {
      cameraDistance: 5.2,
      discoveryThreshold: 0.82,
      // CORRECCIÓN DE INCLINACIÓN: Ajusta estos valores (en radianes) si el .glb viene inclinado
      modelRotation: { x: 0, y: 0, z: 0 },
      // RUTAS DEL FONDO DEL PASILLO DE XILITLA (Guarda la imagen generada con cualquiera de estos nombres)
      corridorBgPaths: [
        'assets/pasillo_xilitla.jpg',
        'assets/pasillo_xilitla.png',
        'pasillo_xilitla.jpg',
        'pasillo_xilitla.png',
        'assets/fondo_pasillo.jpg',
        `${REPO_RAW_BASE}assets/pasillo_xilitla.jpg`,
        `${REPO_RAW_BASE}assets/fondo_pasillo.jpg`
      ],
      modelPaths: [
        'models/escultura1.glb',
        'assets/escultura1.glb',
        'escultura1.glb',
        `${REPO_RAW_BASE}models/escultura1.glb`,
        `${REPO_RAW_BASE}assets/escultura1.glb`
      ],
      vegetationAssets: [
        {
          key: 'plantas_rocas',
          name: 'tree-tropical.png',
          localPath: 'assets/tree-tropical.png',
          rawUrl: `${REPO_RAW_BASE}assets/tree-tropical.png`,
          aspectWidth: 2.55,
          aspectHeight: 2.35
        },
        {
          key: 'arbusto',
          name: 'arbustotropical.png',
          localPath: 'assets/arbustotropical.png',
          rawUrl: `${REPO_RAW_BASE}assets/arbustotropical.png`,
          aspectWidth: 2.05,
          aspectHeight: 1.75
        },
        {
          key: 'plantas',
          name: 'plantas.png',
          localPath: 'assets/plantas.png',
          rawUrl: `${REPO_RAW_BASE}assets/plantas.png`,
          aspectWidth: 1.85,
          aspectHeight: 2.05
        }
      ],
      particleCount: 220,
      damping: 0.89,
      restLerpSpeed: 0.08,
      brushRadius: 0.92
    };

    const state = {
      foliagePlanes: [],
      coveringLeavesCount: 0,
      clearedLeavesCount: 0,
      discoveryCompleted: false,
      modelBoundingBox: new THREE.Box3(),
      modelSize: new THREE.Vector3(1.4, 2.0, 1.4),
      activeDraggedLeaf: null,
      pointerDown: false,
      rotatingModel: false,
      hasInteracted: false,
      pointerNDC: new THREE.Vector2(0, 0),
      smoothedParallax: new THREE.Vector2(0, 0),
      lastPointerWorld: new THREE.Vector3(),
      lastInspectClient: { x: 0, y: 0 },
      modelTargetRotY: 0,
      modelTargetRotX: 0,
      cameraActive: false,
      soundEnabled: true,
      audioCtx: null,
      lastRustleTime: 0,
      particleData: []
    };

    const container = document.getElementById('webgl-container');
    const videoElement = document.getElementById('ar-video');
    const backdropElement = document.getElementById('illustration-backdrop');
    const loadingScreen = document.getElementById('loading-screen');
    const loadingBar = document.getElementById('loading-bar');
    const loadingPercent = document.getElementById('loading-percent');
    const loadingStatus = document.getElementById('loading-status');
    const discoveryLabel = document.getElementById('discovery-label');
    const discoveryCount = document.getElementById('discovery-count');
    const discoveryBar = document.getElementById('discovery-bar');
    const statusDot = document.getElementById('status-dot');
    const onboardingHint = document.getElementById('onboarding-hint');
    const hintText = document.getElementById('hint-text');
    const toastMessage = document.getElementById('toast-message');
    const touchRipple = document.getElementById('touch-ripple');
    const btnFullscreen = document.getElementById('btn-fullscreen');
    const iconExpand = document.getElementById('icon-expand');
    const iconCompress = document.getElementById('icon-compress');

    let scene, camera, renderer, raycaster;
    let jungleEnvironmentGroup, muralMesh, sculptureGroup, foliageRootGroup, bioParticles;
    let hemiLight, sunClearLight, rimTealLight, rimGoldLight, centerSpotLight;
    let cachedTexturesByKey = null;
    const clock = new THREE.Clock();

    /* =========================================================================
       LÓGICA DE PANTALLA COMPLETA
       ========================================================================= */
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          showToast(`Error al intentar pantalla completa: ${err.message}`);
        });
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    document.addEventListener('fullscreenchange', () => {
      if (document.fullscreenElement) {
        iconExpand.classList.add('hidden');
        iconCompress.classList.remove('hidden');
      } else {
        iconExpand.classList.remove('hidden');
        iconCompress.classList.add('hidden');
      }
    });

    btnFullscreen.addEventListener('click', toggleFullscreen);

    /* =========================================================================
       1. MOTOR DE AUDIO
       ========================================================================= */
    function initAudio() {
      if (!state.audioCtx && state.soundEnabled) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) state.audioCtx = new AudioContext();
      }
      if (state.audioCtx && state.audioCtx.state === 'suspended') {
        state.audioCtx.resume();
      }
    }

    function playFoliageRustle(intensity = 0.45) {
      const now = performance.now();
      if (!state.soundEnabled || !state.audioCtx || now - state.lastRustleTime < 75) return;
      state.lastRustleTime = now;

      try {
        const ctx = state.audioCtx;
        const duration = 0.13;
        const bufferSize = Math.floor(ctx.sampleRate * duration);
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.sin((i / bufferSize) * Math.PI);
        }
        const noise = ctx.createBufferSource();
        noise.buffer = buffer;

        const filter = ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(750 + Math.random() * 650, ctx.currentTime);
        filter.Q.setValueAtTime(1.8, ctx.currentTime);

        const gain = ctx.createGain();
        const vol = Math.min(0.15, Math.max(0.025, intensity * 0.11));
        gain.gain.setValueAtTime(vol, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);
        noise.start();
      } catch (e) {}
    }

    function playRevealChime() {
      if (!state.soundEnabled || !state.audioCtx) return;
      try {
        const ctx = state.audioCtx;
        const notes = [523.25, 659.25, 783.99, 1046.5];
        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.11);
          gain.gain.setValueAtTime(0.001, ctx.currentTime + idx * 0.11);
          gain.gain.linearRampToValueAtTime(0.09, ctx.currentTime + idx * 0.11 + 0.05);
          gain.gain.exponentialRampToValueAtTime(0.0008, ctx.currentTime + idx * 0.11 + 1.4);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + idx * 0.11);
          osc.stop(ctx.currentTime + idx * 0.11 + 1.45);
        });
      } catch (e) {}
    }

    function showToast(text) {
      toastMessage.textContent = text;
      toastMessage.classList.remove('opacity-0', 'translate-y-2');
      toastMessage.classList.add('opacity-100', 'translate-y-0');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => {
        toastMessage.classList.remove('opacity-100', 'translate-y-0');
        toastMessage.classList.add('opacity-0', 'translate-y-2');
      }, 3200);
    }

    /* =========================================================================
       2. INICIALIZACIÓN DE ESCENA Y FONDO DEL PASILLO DE XILITLA
       ========================================================================= */
    async function init() {
      updateLoading(15, 'Cargando arquitectura y vegetación del pasillo de Xilitla...');

      scene = new THREE.Scene();
      // Niebla más sutil para respetar la nitidez de los muros de piedra y la puerta del fondo
      scene.fog = new THREE.FogExp2(0x0c2218, 0.032);

      camera = new THREE.PerspectiveCamera(46, window.innerWidth / window.innerHeight, 0.1, 60);
      updateCameraFramingForAspect();

      renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: true,
        powerPreference: 'high-performance'
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.18;
      container.appendChild(renderer.domElement);

      raycaster = new THREE.Raycaster();

      setupLighting();
      await createXilitlaCorridorBackground();

      updateLoading(45, 'Colocando escultura 3D sobre el pasillo de piedra...');
      await loadAndFrameCentralModel();

      updateLoading(72, 'Generando cortina botánica interactiva...');
      cachedTexturesByKey = await loadBaseVegetationTextures();
      buildLayeredJungle(cachedTexturesByKey);

      updateLoading(92, 'Activando polen y esporas bioluminiscentes...');
      createLuminescentParticles();

      setupInteractionEvents();
      window.addEventListener('resize', onWindowResize);

      updateLoading(100, '¡Pasillo de Xilitla listo!');
      
      setTimeout(() => {
        loadingScreen.classList.add('opacity-0', 'pointer-events-none');
        setTimeout(() => {
          onboardingHint.classList.add('opacity-0');
        }, 3000);
      }, 350);

      renderer.setAnimationLoop(animate);
    }

    function updateLoading(percent, message) {
      loadingBar.style.width = `${percent}%`;
      loadingPercent.textContent = `${percent}%`;
      if (message) loadingStatus.textContent = message;
    }

    function updateCameraFramingForAspect() {
      const aspect = window.innerWidth / window.innerHeight;
      CONFIG.cameraDistance = aspect >= 1.0 ? 4.95 : 5.65;
      if (camera) {
        camera.aspect = aspect;
        camera.position.z = CONFIG.cameraDistance;
        camera.updateProjectionMatrix();
      }
      updateMuralScaleForAspect();
    }

    // Ajusta la escala del plano de fondo 3D para cubrir tanto móvil vertical como horizontal
    function updateMuralScaleForAspect() {
      if (!muralMesh || !muralMesh.material.map) return;
      const tex = muralMesh.material.map;
      const imgW = tex.image?.width || 1080;
      const imgH = tex.image?.height || 1350;
      const imgAspect = imgW / imgH;
      const screenAspect = window.innerWidth / window.innerHeight;

      const baseHeight = 10.5;
      let targetW = baseHeight * imgAspect;
      let targetH = baseHeight;

      const minCoverWidth = baseHeight * screenAspect * 1.18;
      if (targetW < minCoverWidth) {
        const factor = minCoverWidth / targetW;
        targetW *= factor;
        targetH *= factor;
      }
      muralMesh.scale.set(targetW / 10, targetH / 10, 1);
    }

    function setupLighting() {
      // Luz cenital natural como el cielo abierto del pasillo
      hemiLight = new THREE.HemisphereLight(0xe2f8ec, 0x1c241e, 1.35);
      scene.add(hemiLight);

      sunClearLight = new THREE.DirectionalLight(0xfffbeb, 2.45);
      sunClearLight.position.set(1.2, 6.2, 2.6);
      sunClearLight.castShadow = true;
      sunClearLight.shadow.mapSize.width = 1024;
      sunClearLight.shadow.mapSize.height = 1024;
      sunClearLight.shadow.bias = -0.001;
      scene.add(sunClearLight);

      // Rebote verdoso de los helechos y musgo en los muros
      rimTealLight = new THREE.PointLight(0x34d399, 2.8, 11);
      rimTealLight.position.set(-2.4, 1.4, -0.5);
      scene.add(rimTealLight);

      // Toque cálido de la piedra caliza y las orquídeas sutiles
      rimGoldLight = new THREE.PointLight(0xfde047, 2.1, 10);
      rimGoldLight.position.set(2.2, 1.2, 1.4);
      scene.add(rimGoldLight);

      centerSpotLight = new THREE.SpotLight(0xffffff, 2.8);
      centerSpotLight.position.set(0, 4.0, 3.2);
      centerSpotLight.angle = Math.PI / 5.0;
      centerSpotLight.penumbra = 0.88;
      scene.add(centerSpotLight);
    }

    async function createXilitlaCorridorBackground() {
      if (jungleEnvironmentGroup) scene.remove(jungleEnvironmentGroup);
      jungleEnvironmentGroup = new THREE.Group();
      jungleEnvironmentGroup.name = 'XilitlaCorridorEnvironment';
      scene.add(jungleEnvironmentGroup);

      const { texture, cssUrl } = await loadCorridorTextureWithFallback();
      applyCorridorBackgroundTexture(texture, cssUrl);

      // Plano curvo envolvente 3D para que el pasillo tenga profundidad y paralaje real
      const muralGeo = new THREE.PlaneGeometry(10, 10, 28, 1);
      const pos = muralGeo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const vx = pos.getX(i);
        pos.setZ(i, Math.pow(vx * 0.16, 2) * 0.48);
      }
      muralGeo.computeVertexNormals();

      const muralMat = new THREE.MeshBasicMaterial({
        map: texture,
        side: THREE.DoubleSide,
        fog: false
      });
      muralMesh = new THREE.Mesh(muralGeo, muralMat);
      muralMesh.position.set(0, 0.35, -4.4);
      jungleEnvironmentGroup.add(muralMesh);
      updateMuralScaleForAspect();

      // Piso receptor de sombras transparente: permite ver las lajas de piedra de la foto
      // mientras proyecta la sombra real del modelo 3D y el pedestal sobre el suelo
      const shadowFloorGeo = new THREE.PlaneGeometry(12, 12);
      const shadowFloorMat = new THREE.ShadowMaterial({
        opacity: 0.42
      });
      const shadowFloor = new THREE.Mesh(shadowFloorGeo, shadowFloorMat);
      shadowFloor.rotation.x = -Math.PI / 2;
      shadowFloor.position.y = -1.24;
      shadowFloor.receiveShadow = true;
      jungleEnvironmentGroup.add(shadowFloor);

      // Sutil halo de humedad bioluminiscente al pie de la escultura
      const rippleGeo = new THREE.RingGeometry(0.68, 1.35, 48);
      const rippleMat = new THREE.MeshBasicMaterial({
        color: 0x34d399,
        transparent: true,
        opacity: 0.14,
        side: THREE.DoubleSide
      });
      const rippleMesh = new THREE.Mesh(rippleGeo, rippleMat);
      rippleMesh.rotation.x = -Math.PI / 2;
      rippleMesh.position.y = -1.23;
      jungleEnvironmentGroup.add(rippleMesh);
    }

    async function loadCorridorTextureWithFallback() {
      const texLoader = new THREE.TextureLoader();
      texLoader.setCrossOrigin('anonymous');

      for (const path of CONFIG.corridorBgPaths) {
        try {
          const loadedTex = await new Promise((resolve, reject) => {
            texLoader.load(path, resolve, undefined, reject);
          });
          loadedTex.colorSpace = THREE.SRGBColorSpace;
          loadedTex.anisotropy = 4;
          return { texture: loadedTex, cssUrl: path };
        } catch (err) {
          // Continúa buscando en la siguiente ruta
        }
      }

      // Si aún no se ha guardado el archivo local, dibuja una recreación procedural del pasillo de Xilitla
      console.info('Usando recreación procedural del pasillo de Xilitla. Puedes subir la imagen con el botón "Fondo Pasillo".');
      return createProceduralXilitlaCorridorTexture();
    }

    function applyCorridorBackgroundTexture(texture, cssUrl) {
      if (cssUrl) {
        backdropElement.style.backgroundImage = `url('${cssUrl}')`;
      }
      if (muralMesh && muralMesh.material) {
        muralMesh.material.map = texture;
        muralMesh.material.needsUpdate = true;
        updateMuralScaleForAspect();
      }
    }

    // Recreación procedural en Canvas 2D del pasillo de piedra con musgo, helechos, puerta de herrería y pocas orquídeas sutiles
    function createProceduralXilitlaCorridorTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 1200;
      canvas.height = 1500;
      const ctx = canvas.getContext('2d');
      const w = canvas.width;
      const h = canvas.height;

      // 1. Cielo luminoso y follaje de copa en la apertura superior
      const skyGrad = ctx.createLinearGradient(0, 0, 0, h * 0.28);
      skyGrad.addColorStop(0, '#e0f2fe');
      skyGrad.addColorStop(0.6, '#bae6fd');
      skyGrad.addColorStop(1, '#64748b');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, w, h * 0.28);

      // Ramas de árboles asomándose arriba
      ctx.fillStyle = '#1e3a29';
      for (let i = 0; i < 18; i++) {
        ctx.beginPath();
        ctx.arc(w * 0.5 + (i - 9) * 45, 50 + (i % 3) * 30, 55, 0, Math.PI * 2);
        ctx.fill();
      }

      // 2. Muro del fondo con arco y puerta de herrería
      ctx.fillStyle = '#78716c';
      ctx.fillRect(w * 0.34, h * 0.14, w * 0.48, h * 0.54);

      // Textura de sillares de piedra en el muro del fondo
      for (let py = h * 0.15; py < h * 0.66; py += 26) {
        for (let px = w * 0.35; px < w * 0.80; px += 48) {
          ctx.fillStyle = (px + py) % 3 === 0 ? '#57534e' : '#8a817c';
          ctx.fillRect(px + (py % 2) * 14, py, 42, 20);
        }
      }

      // Arco de entrada y puerta de reja metálica con jardín al fondo
      const gateX = w * 0.63;
      const gateY = h * 0.31;
      const gateW = w * 0.15;
      const gateH = h * 0.33;

      ctx.fillStyle = '#143323';
      ctx.fillRect(gateX, gateY, gateW, gateH);

      // Reja de herrería vertical y horizontal
      ctx.strokeStyle = '#292524';
      ctx.lineWidth = 3;
      for (let gx = gateX + 12; gx < gateX + gateW; gx += 16) {
        ctx.beginPath();
        ctx.moveTo(gx, gateY);
        ctx.lineTo(gx, gateY + gateH);
        ctx.stroke();
      }
      for (let gy = gateY + 24; gy < gateY + gateH; gy += 36) {
        ctx.beginPath();
        ctx.moveTo(gateX, gy);
        ctx.lineTo(gateX + gateW, gy);
        ctx.stroke();
      }

      // 3. Muro izquierdo en perspectiva (piedra rústica + ventanas rectangulares)
      ctx.fillStyle = '#79716b';
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(w * 0.56, h * 0.16);
      ctx.lineTo(w * 0.56, h * 0.64);
      ctx.lineTo(0, h * 0.84);
      ctx.closePath();
      ctx.fill();

      // Ventanas con barrotes del muro izquierdo
      const windows = [
        { x: w * 0.04, y: h * 0.34, ww: w * 0.14, wh: h * 0.11 },
        { x: w * 0.32, y: h * 0.41, ww: w * 0.08, wh: h * 0.08 }
      ];
      windows.forEach(win => {
        ctx.fillStyle = '#a8a29e';
        ctx.fillRect(win.x - 10, win.y - 10, win.ww + 20, win.wh + 20);
        ctx.fillStyle = '#1c1917';
        ctx.fillRect(win.x, win.y, win.ww, win.wh);
      });

      // 4. Muro derecho en perspectiva
      ctx.fillStyle = '#68625d';
      ctx.beginPath();
      ctx.moveTo(w, 0);
      ctx.lineTo(w * 0.82, h * 0.14);
      ctx.lineTo(w * 0.82, h * 0.65);
      ctx.lineTo(w, h * 0.86);
      ctx.closePath();
      ctx.fill();

      // 5. Piso de lajas de piedra húmedas con musgo entre las juntas
      const floorGrad = ctx.createLinearGradient(0, h * 0.64, 0, h);
      floorGrad.addColorStop(0, '#57534e');
      floorGrad.addColorStop(0.5, '#44403c');
      floorGrad.addColorStop(1, '#292524');
      ctx.fillStyle = floorGrad;
      ctx.beginPath();
      ctx.moveTo(0, h * 0.82);
      ctx.lineTo(w * 0.45, h * 0.64);
      ctx.lineTo(w * 0.84, h * 0.64);
      ctx.lineTo(w, h * 0.84);
      ctx.lineTo(w, h);
      ctx.lineTo(0, h);
      ctx.closePath();
      ctx.fill();

      // Musgo orgánico en las juntas del pavimento
      ctx.strokeStyle = '#2d6a4f';
      ctx.lineWidth = 4;
      for (let row = 0; row < 7; row++) {
        const y = h * 0.66 + row * 48;
        ctx.beginPath();
        ctx.moveTo(w * 0.25 - row * 35, y);
        ctx.lineTo(w * 0.88 + row * 20, y);
        ctx.stroke();
      }

      // 6. Helechos silvestres, alocasias (orejas de elefante) y musgo en los muros (sin macetas)
      const drawLushPatch = (cx, cy, radius, count) => {
        for (let i = 0; i < count; i++) {
          const ang = (i / count) * Math.PI * 2;
          const r = radius * (0.4 + Math.random() * 0.6);
          ctx.fillStyle = i % 2 === 0 ? '#1b4332' : '#2d6a4f';
          ctx.beginPath();
          ctx.ellipse(cx + Math.cos(ang) * r * 0.5, cy + Math.sin(ang) * r * 0.5, r * 0.55, r * 0.28, ang, 0, Math.PI * 2);
          ctx.fill();
        }
      };

      drawLushPatch(w * 0.16, h * 0.18, 150, 20);
      drawLushPatch(w * 0.18, h * 0.78, 190, 26);
      drawLushPatch(w * 0.88, h * 0.72, 175, 24);
      drawLushPatch(w * 0.62, h * 0.18, 110, 16);

      // 7. Orquídeas sutiles y aisladas en el muro izquierdo (tal como en la imagen recreada)
      const subtleOrchids = [
        { x: w * 0.18, y: h * 0.39, color: '#d946ef' },
        { x: w * 0.34, y: h * 0.25, color: '#c084fc' },
        { x: w * 0.48, y: h * 0.28, color: '#e879f9' },
        { x: w * 0.29, y: h * 0.49, color: '#f8fafc' },
        { x: w * 0.30, y: h * 0.67, color: '#d946ef' }
      ];
      subtleOrchids.forEach(o => {
        ctx.fillStyle = o.color;
        for (let p = 0; p < 5; p++) {
          const a = (p / 5) * Math.PI * 2;
          ctx.beginPath();
          ctx.ellipse(o.x + Math.cos(a) * 10, o.y + Math.sin(a) * 10, 10, 6, a, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.fillStyle = '#fde047';
        ctx.beginPath();
        ctx.arc(o.x, o.y, 4, 0, Math.PI * 2);
        ctx.fill();
      });

      const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      return { texture, cssUrl: dataUrl };
    }

    /* =========================================================================
       3. CARGA DEL MODELO 3D CENTRAL Y CORRECCIÓN DE ROTACIÓN
       ========================================================================= */
    async function loadAndFrameCentralModel() {
      sculptureGroup = new THREE.Group();
      sculptureGroup.position.set(0, 0, 0);
      scene.add(sculptureGroup);

      // Pedestal de piedra integrado con musgo para posar sobre el suelo del pasillo
      const pedestalGroup = new THREE.Group();
      const stoneMat = new THREE.MeshStandardMaterial({
        color: 0x3a403a,
        roughness: 0.88,
        metalness: 0.05
      });
      const basePedestal = new THREE.Mesh(new THREE.CylinderGeometry(0.52, 0.64, 0.46, 32), stoneMat);
      basePedestal.position.y = -1.01;
      basePedestal.castShadow = true;
      basePedestal.receiveShadow = true;
      pedestalGroup.add(basePedestal);

      const mossTrim = new THREE.Mesh(
        new THREE.TorusGeometry(0.53, 0.028, 16, 48),
        new THREE.MeshStandardMaterial({ color: 0x2d6a4f, roughness: 0.6, metalness: 0.1 })
      );
      mossTrim.rotation.x = Math.PI / 2;
      mossTrim.position.y = -0.78;
      pedestalGroup.add(mossTrim);

      sculptureGroup.add(pedestalGroup);

      const loader = new GLTFLoader();
      loader.setCrossOrigin('anonymous');

      let loadedGLTF = null;
      for (const path of CONFIG.modelPaths) {
        try {
          loadedGLTF = await new Promise((resolve, reject) => {
            loader.load(path, resolve, undefined, reject);
          });
          break;
        } catch (err) {
          console.warn(`No se pudo cargar ${path}, intentando siguiente...`);
        }
      }

      if (loadedGLTF) {
        mountAndComputeBoundingBox(loadedGLTF.scene);
      } else {
        console.warn("Usando modelo de respaldo procedural.");
        const fallbackModel = createSurrealSculptureFallback();
        mountAndComputeBoundingBox(fallbackModel);
      }
    }

    function mountAndComputeBoundingBox(modelNode) {
      while (sculptureGroup.children.length > 1) {
        sculptureGroup.remove(sculptureGroup.children[1]);
      }

      modelNode.rotation.set(
        CONFIG.modelRotation.x, 
        CONFIG.modelRotation.y, 
        CONFIG.modelRotation.z
      );

      modelNode.updateMatrixWorld(true);

      const rawBox = new THREE.Box3().setFromObject(modelNode);
      const rawSize = rawBox.getSize(new THREE.Vector3());
      const rawCenter = rawBox.getCenter(new THREE.Vector3());

      const maxDim = Math.max(rawSize.x, rawSize.y, rawSize.z) || 1;
      const targetFullBodyHeight = 1.78;
      const scale = targetFullBodyHeight / maxDim;

      modelNode.scale.setScalar(scale);
      modelNode.position.x = -rawCenter.x * scale;
      modelNode.position.z = -rawCenter.z * scale;
      modelNode.position.y = -0.76 - (rawBox.min.y * scale);

      modelNode.traverse((child) => {
        if (child.isMesh) {
          child.castShadow = true;
          child.receiveShadow = true;
        }
      });

      sculptureGroup.add(modelNode);
      sculptureGroup.updateMatrixWorld(true);

      state.modelBoundingBox.setFromObject(sculptureGroup);
      state.modelSize = state.modelBoundingBox.getSize(new THREE.Vector3());
    }

    function createSurrealSculptureFallback() {
      const group = new THREE.Group();
      const bronzeMat = new THREE.MeshStandardMaterial({
        color: 0x5c7c74,
        roughness: 0.35,
        metalness: 0.65
      });

      // Silueta estilizada inspirada en el guardián felino de bronce del pasillo
      const body = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.26, 0.95, 24), bronzeMat);
      body.position.y = 0.05;
      group.add(body);

      const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.17, 0.62, 24), bronzeMat);
      neck.position.set(0, 0.68, 0.03);
      group.add(neck);

      const head = new THREE.Mesh(new THREE.SphereGeometry(0.15, 24, 24), bronzeMat);
      head.scale.set(0.85, 0.9, 1.25);
      head.position.set(0, 1.02, 0.08);
      group.add(head);

      const earL = new THREE.Mesh(new THREE.ConeGeometry(0.045, 0.11, 12), bronzeMat);
      earL.position.set(-0.08, 1.13, 0.02);
      earL.rotation.z = 0.25;
      group.add(earL);

      const earR = earL.clone();
      earR.position.x = 0.08;
      earR.rotation.z = -0.25;
      group.add(earR);

      return group;
    }

            { key: 'plantas', x: -0.68, y: -0.38, scale: 1.08, rotZ:  0.22, flipX: false },
            { key: 'plantas', x:  0.68, y: -0.38, scale: 1.08, rotZ: -0.22, flipX: true  }
          ]
        },
        {
          layerIndex: 8, zDepth: 2.28, isStatic: false, windAmp: 0.082, interactive: true, coversSculpture: true,
          colorTint: '#245940', emissiveTint: '#020c07',
          slots: [
            { key: 'plantas_rocas', x: -0.18, y: -0.18, scale: 1.12, rotZ: -0.06, flipX: true  },
            { key: 'plantas',       x:  0.22, y:  0.25, scale: 1.14, rotZ:  0.10, flipX: false },
            { key: 'arbusto',       x: -0.58, y:  0.34, scale: 1.05, rotZ: -0.24, flipX: false },
            { key: 'arbusto',       x:  0.58, y:  0.34, scale: 1.05, rotZ:  0.24, flipX: true  }
          ]
        }
      ];

      layerBlueprints.forEach((layerSpec) => {
        const layerGroup = new THREE.Group();
        layerGroup.name = `Layer_${layerSpec.layerIndex}`;
        foliageRootGroup.add(layerGroup);

        layerSpec.slots.forEach((slot, idx) => {
          const assetMeta = CONFIG.vegetationAssets.find((a) => a.key === slot.key);
          const texture = baseTextures[slot.key];

          const planeW = assetMeta.aspectWidth * slot.scale;
          const planeH = assetMeta.aspectHeight * slot.scale;
          const planeGeo = new THREE.PlaneGeometry(planeW, planeH, 10, 10);

          if (slot.flipX) {
            const uv = planeGeo.attributes.uv;
            for (let u = 0; u < uv.count; u++) {
              uv.setX(u, 1.0 - uv.getX(u));
            }
            uv.needsUpdate = true;
          }

          const posAttr = planeGeo.attributes.position;
          const basePositions = new Float32Array(posAttr.array.length);
          basePositions.set(posAttr.array);

          const material = new THREE.MeshStandardMaterial({
            map: texture,
            color: new THREE.Color(layerSpec.colorTint),
            emissive: new THREE.Color(layerSpec.emissiveTint),
            emissiveIntensity: layerSpec.layerIndex === 3 ? 0.42 : 0.18,
            transparent: true,
            alphaTest: 0.05,
            side: THREE.DoubleSide,
            roughness: 0.62,
            metalness: 0.05,
            depthWrite: true
          });

          const mesh = new THREE.Mesh(planeGeo, material);
          const microZ = layerSpec.zDepth + idx * 0.03;
          mesh.position.set(slot.x, slot.y, microZ);
          mesh.rotation.set(0, 0, slot.rotZ);

          const sideSign = slot.x === 0 ? (idx % 2 === 0 ? -1 : 1) : Math.sign(slot.x);
          const partedX = sideSign * (1.95 + (layerSpec.layerIndex - 5) * 0.22 + (idx % 2) * 0.18);
          const partedY = slot.y + (slot.y >= 0 ? 0.25 : -0.22);
          const partedRotZ = slot.rotZ + sideSign * -0.38;

          mesh.userData = {
            layerIndex: layerSpec.layerIndex,
            interactive: layerSpec.interactive,
            coversSculpture: layerSpec.coversSculpture,
            isCleared: false,
            windAmplitude: layerSpec.windAmp,
            basePositions,
            planeHeight: planeH,
            homePos: new THREE.Vector3(slot.x, slot.y, microZ),
            homeRotZ: slot.rotZ,
            restPos: new THREE.Vector3(slot.x, slot.y, microZ),
            restRotZ: slot.rotZ,
            partedPos: new THREE.Vector3(partedX, partedY, microZ),
            partedRotZ,
            velocity: new THREE.Vector2(0, 0),
            rotVelocity: 0,
            swaySpeed: 1.05 + layerSpec.layerIndex * 0.12 + (idx % 3) * 0.16,
            swayPhase: idx * 1.3 + layerSpec.layerIndex * 0.85
          };

          if (layerSpec.coversSculpture) {
            state.coveringLeavesCount++;
          }

          layerGroup.add(mesh);
          state.foliagePlanes.push(mesh);
        });
      });

      updateDiscoveryUI();
    }

    /* =========================================================================
       5. CARGA DE TEXTURAS PNG DE VEGETACIÓN
       ========================================================================= */
    async function loadBaseVegetationTextures() {
      const texLoader = new THREE.TextureLoader();
      texLoader.setCrossOrigin('anonymous');
      const texturesByKey = {};

      for (const asset of CONFIG.vegetationAssets) {
        let loadedTex = null;
        try {
          loadedTex = await new Promise((resolve, reject) => {
            texLoader.load(asset.localPath, resolve, undefined, reject);
          });
        } catch (err1) {
          try {
            loadedTex = await new Promise((resolve, reject) => {
              texLoader.load(asset.rawUrl, resolve, undefined, reject);
            });
          } catch (err2) {
            loadedTex = createIllustrativeBotanicalTexture(asset.key);
          }
        }
        loadedTex.colorSpace = THREE.SRGBColorSpace;
        loadedTex.anisotropy = 4;
        texturesByKey[asset.key] = loadedTex;
      }
      return texturesByKey;
    }

    function createIllustrativeBotanicalTexture(assetKey) {
      const canvas = document.createElement('canvas');
      canvas.width = 640;
      canvas.height = 640;
      const ctx = canvas.getContext('2d');
      const cx = canvas.width / 2;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.save();
      ctx.shadowColor = 'rgba(2, 16, 10, 0.65)';
      ctx.shadowBlur = 16;

      if (assetKey === 'plantas_rocas') {
        const fronds = 13;
        for (let i = 0; i < fronds; i++) {
          const angle = ((i / (fronds - 1)) - 0.5) * 1.85;
          ctx.save();
          ctx.translate(cx, 520);
          ctx.rotate(angle);
          const grad = ctx.createLinearGradient(0, 0, 0, -440);
          grad.addColorStop(0, '#042f2e');
          grad.addColorStop(0.55, '#0f766e');
          grad.addColorStop(1, '#6ee7b7');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.quadraticCurveTo(-48, -220, 0, -440);
          ctx.quadraticCurveTo(48, -220, 0, 0);
          ctx.fill();
          ctx.restore();
        }

        const rocks = [
          { rx: cx - 125, ry: 535, rw: 115, rh: 82, col1: '#44403c', col2: '#1c1917' },
          { rx: cx + 115, ry: 540, rw: 110, rh: 78, col1: '#57534e', col2: '#292524' },
          { rx: cx,       ry: 548, rw: 155, rh: 96, col1: '#78716c', col2: '#292524' }
        ];
        rocks.forEach((r) => {
          const rGrad = ctx.createRadialGradient(r.rx - 20, r.ry - 25, 10, r.rx, r.ry, r.rw);
          rGrad.addColorStop(0, r.col1);
          rGrad.addColorStop(0.7, '#334139');
          rGrad.addColorStop(1, r.col2);
          ctx.fillStyle = rGrad;
          ctx.beginPath();
          ctx.ellipse(r.rx, r.ry, r.rw, r.rh, 0, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = 'rgba(52, 211, 153, 0.35)';
          ctx.beginPath();
          ctx.ellipse(r.rx, r.ry - r.rh * 0.35, r.rw * 0.78, r.rh * 0.42, 0, Math.PI, Math.PI * 2);
          ctx.fill();
        });
      } else if (assetKey === 'arbusto') {
        const count = 15;
        for (let i = 0; i < count; i++) {
          const angle = ((i / (count - 1)) - 0.5) * 2.15;
          const len = 210 + (i % 3) * 52;
          ctx.save();
          ctx.translate(cx, 565);
          ctx.rotate(angle);
          const grad = ctx.createLinearGradient(0, 0, 0, -len);
          grad.addColorStop(0, '#042f2e');
          grad.addColorStop(0.55, '#0d9488');
          grad.addColorStop(1, '#6ee7b7');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.bezierCurveTo(-72, -len * 0.42, -54, -len * 0.85, 0, -len);
          ctx.bezierCurveTo(54, -len * 0.85, 72, -len * 0.42, 0, 0);
          ctx.fill();
          ctx.restore();
        }
      } else {
        for (let f = -2; f <= 2; f++) {
          ctx.save();
          ctx.translate(cx + f * 48, 575);
          ctx.rotate(f * 0.25);
          const grad = ctx.createLinearGradient(0, 0, 0, -460);
          grad.addColorStop(0, '#064e3b');
          grad.addColorStop(0.6, '#10b981');
          grad.addColorStop(1, '#a7f3d0');
          ctx.fillStyle = grad;
          for (let j = 0; j < 14; j++) {
            const t = j / 13;
            const y = -55 - t * 380;
            const w = Math.sin(t * Math.PI) * 102 + 20;
            ctx.beginPath();
            ctx.ellipse(-w * 0.55, y, w * 0.6, 15, -0.28, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(w * 0.55, y, w * 0.6, 15, 0.28, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }
      }

      ctx.restore();
      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.needsUpdate = true;
      return tex;
    }

    /* =========================================================================
       6. PARTÍCULAS BIOLUMINISCENTES
       ========================================================================= */
    function createLuminescentParticles() {
      if (bioParticles) scene.remove(bioParticles);

      const count = CONFIG.particleCount;
      const geo = new THREE.BufferGeometry();
      const positions = new Float32Array(count * 3);
      const colors = new Float32Array(count * 3);
      const sizes = new Float32Array(count);
      const phases = new Float32Array(count);

      const palette = [
        new THREE.Color('#fde047'),
        new THREE.Color('#6ee7b7'),
        new THREE.Color('#f5d0fe'), // Sutil destello lila en armonía con las orquídeas
        new THREE.Color('#bef264')
      ];

      state.particleData = [];

      for (let i = 0; i < count; i++) {
        const x = (Math.random() - 0.5) * 6.8;
        const y = (Math.random() - 0.35) * 4.2;
        const z = -2.6 + Math.random() * 5.2;

        positions[i * 3] = x;
        positions[i * 3 + 1] = y;
        positions[i * 3 + 2] = z;

        const c = palette[i % palette.length];
        colors[i * 3] = c.r;
        colors[i * 3 + 1] = c.g;
        colors[i * 3 + 2] = c.b;

        sizes[i] = 0.85 + Math.random() * 1.55;
        phases[i] = Math.random() * Math.PI * 2;

        state.particleData.push({
          baseX: x,
          baseY: y,
          baseZ: z,
          speedY: 0.0022 + Math.random() * 0.004,
          driftFreq: 0.5 + Math.random() * 0.85,
          driftAmp: 0.16 + Math.random() * 0.22,
          phase: phases[i]
        });
      }

      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      geo.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));
      geo.setAttribute('aPhase', new THREE.BufferAttribute(phases, 1));

      const mat = new THREE.ShaderMaterial({
        uniforms: {
          uTime: { value: 0 },
          uPixelRatio: { value: Math.min(window.devicePixelRatio, 2) }
        },
        vertexShader: `
          attribute float aSize;
          attribute float aPhase;
          varying vec3 vColor;
          varying float vPulse;
          uniform float uTime;
          uniform float uPixelRatio;

          void main() {
            vColor = color;
            float pulse = 0.55 + 0.45 * sin(uTime * 2.5 + aPhase);
            vPulse = pulse;
            vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
            gl_PointSize = aSize * (42.0 * pulse) * uPixelRatio * (1.0 / max(1.2, -mvPosition.z));
            gl_Position = projectionMatrix * mvPosition;
          }
        `,
        fragmentShader: `
          varying vec3 vColor;
          varying float vPulse;
          void main() {
            float dist = length(gl_PointCoord - vec2(0.5));
            if (dist > 0.5) discard;
            float core = smoothstep(0.5, 0.0, dist);
            float halo = pow(core, 1.45);
            vec3 finalColor = mix(vColor * 1.5, vec3(1.0, 1.0, 0.96), pow(core, 2.6));
            gl_FragColor = vec4(finalColor, halo * (0.65 + 0.35 * vPulse));
          }
        `,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        vertexColors: true
      });

      bioParticles = new THREE.Points(geo, mat);
      scene.add(bioParticles);
    }

    /* =========================================================================
       7. MECÁNICA TÁCTIL Y CARGA DE IMAGEN PERSONALIZADA DEL PASILLO
       ========================================================================= */
    function setupInteractionEvents() {
      const dom = renderer.domElement;

      dom.addEventListener('pointerdown', onPointerDown, { passive: false });
      window.addEventListener('pointermove', onPointerMove, { passive: false });
      window.addEventListener('pointerup', onPointerUp, { passive: false });
      window.addEventListener('pointercancel', onPointerUp, { passive: false });

      document.getElementById('btn-toggle-camera').addEventListener('click', toggleARCamera);

      document.getElementById('btn-reset').addEventListener('click', () => {
        state.clearedLeavesCount = 0;
        state.discoveryCompleted = false;
        state.foliagePlanes.forEach((leaf) => {
          const d = leaf.userData;
          d.isCleared = false;
          d.restPos.copy(d.homePos);
          d.restRotZ = d.homeRotZ;
          d.velocity.set(0, 0);
          d.rotVelocity = 0;
        });
        state.modelTargetRotX = 0;
        state.modelTargetRotY = 0;
        updateDiscoveryUI();
        onboardingHint.classList.remove('opacity-0');
        hintText.textContent = 'Desliza tu dedo para apartar las plantas del pasillo y descubrir la escultura';
        playFoliageRustle(0.8);
        showToast('Vegetación restaurada en el pasillo de Xilitla');
      });

      document.getElementById('btn-sound').addEventListener('click', () => {
        state.soundEnabled = !state.soundEnabled;
        document.getElementById('icon-sound-on').classList.toggle('text-emerald-400', state.soundEnabled);
        document.getElementById('icon-sound-on').classList.toggle('text-stone-500', !state.soundEnabled);
        showToast(state.soundEnabled ? 'Sonido de la selva activado' : 'Sonido silenciado');
      });

      // Selector de archivo para cargar al instante la imagen recreada del pasillo
      document.getElementById('bg-upload').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const url = URL.createObjectURL(file);
        const texLoader = new THREE.TextureLoader();
        texLoader.load(url, (loadedTex) => {
          loadedTex.colorSpace = THREE.SRGBColorSpace;
          loadedTex.anisotropy = 4;
          applyCorridorBackgroundTexture(loadedTex, url);
          showToast('¡Fondo del pasillo de Xilitla aplicado!');
        });
      });

      document.getElementById('glb-upload').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const url = URL.createObjectURL(file);
        const loader = new GLTFLoader();
        showToast(`Cargando escultura ${file.name}...`);

        loader.load(url, (gltf) => {
          mountAndComputeBoundingBox(gltf.scene);
          showToast(`¡${file.name} integrada en el pasillo de Xilitla!`);
          URL.revokeObjectURL(url);
        });
      });
    }

    function updatePointerCoords(clientX, clientY) {
      state.pointerNDC.x = (clientX / window.innerWidth) * 2 - 1;
      state.pointerNDC.y = -(clientY / window.innerHeight) * 2 + 1;

      touchRipple.style.left = `${clientX}px`;
      touchRipple.style.top = `${clientY}px`;
    }

    function getPointerWorldAtZ(targetZ) {
      raycaster.setFromCamera(state.pointerNDC, camera);
      const planeZ = new THREE.Plane(new THREE.Vector3(0, 0, 1), -targetZ);
      const hit = new THREE.Vector3();
      raycaster.ray.intersectPlane(planeZ, hit);
      return hit;
    }

    function onPointerDown(e) {
      e.preventDefault();
      initAudio();
      state.pointerDown = true;
      updatePointerCoords(e.clientX, e.clientY);
      touchRipple.classList.add('active');

      if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(() => {});
      }

      if (!state.hasInteracted) {
        state.hasInteracted = true;
        onboardingHint.classList.add('opacity-0');
      }

      const interactiveLeaves = state.foliagePlanes.filter((p) => p.userData.interactive);
      raycaster.setFromCamera(state.pointerNDC, camera);
      const hits = raycaster.intersectObjects(interactiveLeaves, false);

      if (hits.length > 0 && !state.discoveryCompleted) {
        state.activeDraggedLeaf = hits[0].object;
        const worldPt = getPointerWorldAtZ(state.activeDraggedLeaf.position.z);
        if (worldPt) state.lastPointerWorld.copy(worldPt);
        playFoliageRustle(0.65);
      } else {
        state.rotatingModel = true;
        state.lastInspectClient.x = e.clientX;
        state.lastInspectClient.y = e.clientY;
      }
    }

    function onPointerMove(e) {
      updatePointerCoords(e.clientX, e.clientY);
      if (!state.pointerDown) return;

      if (!state.discoveryCompleted && !state.rotatingModel) {
        if (state.activeDraggedLeaf) {
          const leaf = state.activeDraggedLeaf;
          const d = leaf.userData;
          const currentWorld = getPointerWorldAtZ(leaf.position.z);
          if (currentWorld) {
            const dx = currentWorld.x - state.lastPointerWorld.x;
            const dy = currentWorld.y - state.lastPointerWorld.y;

            d.restPos.x += dx * 1.35;
            d.restPos.y += dy * 1.25;
            d.velocity.set(dx * 1.5, dy * 1.5);
            d.rotVelocity = -dx * 0.35;
            d.restRotZ += -dx * 0.22;

            state.lastPointerWorld.copy(currentWorld);
            checkIfLeafCleared(leaf);
          }
        }

        state.foliagePlanes.forEach((leaf) => {
          const d = leaf.userData;
          if (!d.interactive || d === state.activeDraggedLeaf?.userData) return;

          const fingerAtLeafZ = getPointerWorldAtZ(leaf.position.z);
          if (!fingerAtLeafZ) return;

          const dx = leaf.position.x - fingerAtLeafZ.x;
          const dy = leaf.position.y - fingerAtLeafZ.y;
          const dist = Math.hypot(dx, dy);

          if (dist < CONFIG.brushRadius) {
            const pushDirX = dx === 0 ? (d.partedPos.x >= 0 ? 1 : -1) : dx / dist;
            const pushDirY = dy / (dist || 1);
            const force = (1.0 - dist / CONFIG.brushRadius) * 0.24;

            d.restPos.x += pushDirX * force;
            d.restPos.y += pushDirY * force * 0.65;
            d.velocity.x += pushDirX * force * 0.5;
            d.restRotZ += -pushDirX * force * 0.18;

            playFoliageRustle(0.45);
            checkIfLeafCleared(leaf);
          }
        });
        return;
      }

      if (state.rotatingModel) {
        const dx = e.clientX - state.lastInspectClient.x;
        const dy = e.clientY - state.lastInspectClient.y;
        state.modelTargetRotY += dx * 0.012;
        state.modelTargetRotX = THREE.MathUtils.clamp(
          state.modelTargetRotX + dy * 0.005,
          -0.28,
          0.32
        );
        state.lastInspectClient.x = e.clientX;
        state.lastInspectClient.y = e.clientY;
      }
    }

    function onPointerUp() {
      state.pointerDown = false;
      state.activeDraggedLeaf = null;
      state.rotatingModel = false;
      touchRipple.classList.remove('active');
    }

    function checkIfLeafCleared(leaf) {
      const d = leaf.userData;
      if (!d.coversSculpture || d.isCleared) return;

      const distFromCenter = Math.hypot(d.restPos.x * 1.15, d.restPos.y * 0.85);
      if (distFromCenter > 0.92) {
        d.isCleared = true;
        const side = d.restPos.x >= 0 ? 1 : -1;
        d.restPos.x = side * Math.max(Math.abs(d.partedPos.x), Math.abs(d.restPos.x) + 0.45);
        d.restPos.y = THREE.MathUtils.clamp(d.restPos.y, -1.35, 1.35);
        d.restRotZ = d.partedRotZ;

        state.clearedLeavesCount++;
        updateDiscoveryUI();
      }
    }

    function updateDiscoveryUI() {
      const total = Math.max(1, state.coveringLeavesCount);
      const ratio = Math.min(1, state.clearedLeavesCount / total);
      const percent = Math.round(ratio * 100);

      discoveryCount.textContent = `${percent}%`;
      discoveryBar.style.width = `${percent}%`;

      if (ratio >= CONFIG.discoveryThreshold && !state.discoveryCompleted) {
        triggerFullSculptureReveal();
      } else if (!state.discoveryCompleted) {
        discoveryLabel.textContent = 'Despeja la selva';
        statusDot.className = 'w-2 h-2 rounded-full bg-amber-300 animate-ping shrink-0';
      }
    }

    function triggerFullSculptureReveal() {
      state.discoveryCompleted = true;
      discoveryCount.textContent = '100%';
      discoveryBar.style.width = '100%';
      discoveryLabel.textContent = '¡Escultura descubierta!';
      statusDot.className = 'w-2 h-2 rounded-full bg-emerald-400 shrink-0';

      state.foliagePlanes.forEach((leaf) => {
        const d = leaf.userData;
        if (d.coversSculpture) {
          d.isCleared = true;
          d.restPos.copy(d.partedPos);
          d.restRotZ = d.partedRotZ;
        }
      });

      playRevealChime();
      showToast('¡Escultura descubierta en el pasillo! Arrastra para girarla 360°');
    }

    async function toggleARCamera() {
      const btnText = document.getElementById('camera-btn-text');
      if (state.cameraActive) {
        const stream = videoElement.srcObject;
        if (stream) stream.getTracks().forEach((t) => t.stop());
        videoElement.srcObject = null;
        videoElement.classList.remove('active');
        backdropElement.style.opacity = '1';
        if (jungleEnvironmentGroup) jungleEnvironmentGroup.visible = true;
        scene.fog = new THREE.FogExp2(0x0c2218, 0.032);
        state.cameraActive = false;
        btnText.textContent = 'Cámara AR';
        showToast('Fondo del pasillo de Xilitla activo');
        return;
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' } },
          audio: false
        });
        videoElement.srcObject = stream;
        await videoElement.play();
        videoElement.classList.add('active');
        backdropElement.style.opacity = '0';
        if (jungleEnvironmentGroup) jungleEnvironmentGroup.visible = false;
        scene.fog = null;
        state.cameraActive = true;
        btnText.textContent = 'Fondo Pasillo';
        showToast('Cámara AR activa con capas de vegetación');
      } catch (err) {
        showToast('Cámara no disponible en este navegador/dispositivo');
      }
    }

    /* =========================================================================
       8. BUCLE DE ANIMACIÓN
       ========================================================================= */
    function animate() {
      const elapsedTime = clock.getElapsedTime();

      state.smoothedParallax.x = THREE.MathUtils.lerp(state.smoothedParallax.x, state.pointerNDC.x * 0.22, 0.05);
      state.smoothedParallax.y = THREE.MathUtils.lerp(state.smoothedParallax.y, state.pointerNDC.y * 0.12, 0.05);
      camera.position.x = state.smoothedParallax.x;
      camera.position.y = 0.18 + state.smoothedParallax.y;
      camera.lookAt(0, 0.08, 0);

      // Ligero contramovimiento del mural del pasillo para enfatizar la profundidad 3D
      if (muralMesh) {
        muralMesh.position.x = -state.smoothedParallax.x * 0.35;
        muralMesh.position.y = 0.35 - state.smoothedParallax.y * 0.25;
      }

      state.foliagePlanes.forEach((leaf) => {
        const d = leaf.userData;

        if (d.interactive) {
          leaf.position.x += d.velocity.x;
          leaf.position.y += d.velocity.y;
          leaf.rotation.z += d.rotVelocity;

          d.velocity.multiplyScalar(CONFIG.damping);
          d.rotVelocity *= CONFIG.damping;

          leaf.position.x = THREE.MathUtils.lerp(leaf.position.x, d.restPos.x, CONFIG.restLerpSpeed);
          leaf.position.y = THREE.MathUtils.lerp(leaf.position.y, d.restPos.y, CONFIG.restLerpSpeed);
          leaf.rotation.z = THREE.MathUtils.lerp(leaf.rotation.z, d.restRotZ, CONFIG.restLerpSpeed);
        }

        const posAttr = leaf.geometry.attributes.position;
        const basePos = d.basePositions;
        const halfH = d.planeHeight * 0.5;
        const windAmp = d.windAmplitude;

        for (let v = 0; v < posAttr.count; v++) {
          const idx = v * 3;
          const bx = basePos[idx];
          const by = basePos[idx + 1];

          const tipWeight = THREE.MathUtils.clamp((by + halfH) / d.planeHeight, 0.0, 1.0);
          const wave1 = Math.sin(elapsedTime * d.swaySpeed + bx * 1.5 + by * 1.1 + d.swayPhase);
          const wave2 = Math.cos(elapsedTime * (d.swaySpeed * 0.78) - by * 1.6 + d.swayPhase);

          const offsetX = wave1 * windAmp * tipWeight - (d.velocity.x * 1.4 * tipWeight);
          const offsetY = wave2 * (windAmp * 0.4) * tipWeight - (d.velocity.y * 1.1 * tipWeight);
          const offsetZ = wave1 * (windAmp * 0.75) * tipWeight;

          posAttr.setXYZ(v, bx + offsetX, by + offsetY, offsetZ);
        }
        posAttr.needsUpdate = true;
      });

      if (sculptureGroup) {
        if (!state.rotatingModel) {
          state.modelTargetRotY += 0.004;
        }
        sculptureGroup.rotation.y = THREE.MathUtils.lerp(sculptureGroup.rotation.y, state.modelTargetRotY, 0.08);
        sculptureGroup.rotation.x = THREE.MathUtils.lerp(sculptureGroup.rotation.x, state.modelTargetRotX, 0.08);
      }

      if (bioParticles && state.particleData.length > 0) {
        bioParticles.material.uniforms.uTime.value = elapsedTime;
        const posAttr = bioParticles.geometry.attributes.position;
        for (let i = 0; i < CONFIG.particleCount; i++) {
          const p = state.particleData[i];
          p.baseY += p.speedY;
          if (p.baseY > 2.5) p.baseY = -1.4;
          const x = p.baseX + Math.sin(elapsedTime * p.driftFreq + p.phase) * p.driftAmp;
          const y = p.baseY + Math.cos(elapsedTime * p.driftFreq * 0.7 + p.phase) * (p.driftAmp * 0.5);
          posAttr.setXYZ(i, x, y, p.baseZ);
        }
        posAttr.needsUpdate = true;
      }

      renderer.render(scene, camera);
    }

    function onWindowResize() {
      updateCameraFramingForAspect();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>

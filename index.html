<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Sala WebAR · Museo Leonora Carrington</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Tipografías Curatoriales -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- Importmap Oficial Three.js r160 -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #050a08;
      font-family: 'Inter', sans-serif;
      touch-action: none;
    }

    .font-museum {
      font-family: 'Cormorant Garamond', Georgia, serif;
    }

    #webgl-viewport {
      position: fixed;
      inset: 0;
      z-index: 2;
    }

    #ar-overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      display: none;
      flex-direction: column;
      justify-content: space-between;
      padding: env(safe-area-inset-top, 14px) env(safe-area-inset-right, 16px) env(safe-area-inset-bottom, 18px) env(safe-area-inset-left, 16px);
    }

    #ar-overlay.active {
      display: flex;
    }

    .interactive {
      pointer-events: auto;
    }

    /* Botones mágicos futuristas */
    .magic-btn {
      background: radial-gradient(circle at 50% 0%, rgba(163, 230, 53, 0.28), rgba(6, 28, 20, 0.88) 75%);
      border: 1px solid rgba(190, 242, 100, 0.45);
      box-shadow: 0 0 20px rgba(132, 204, 22, 0.25), inset 0 1px 1px rgba(254, 240, 138, 0.35);
      transition: transform 0.12s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .magic-btn:active, .magic-btn.pressing {
      transform: scale(0.93);
      border-color: rgba(253, 224, 71, 0.9);
      box-shadow: 0 0 28px rgba(250, 204, 21, 0.55), inset 0 0 12px rgba(163, 230, 53, 0.45);
    }

    .magic-cta {
      background: linear-gradient(135deg, #22c55e 0%, #a3e635 50%, #facc15 100%);
      box-shadow: 0 0 30px rgba(163, 230, 53, 0.55), 0 0 60px rgba(250, 204, 21, 0.25);
      transition: transform 0.15s ease, box-shadow 0.2s ease;
    }

    .magic-cta:active {
      transform: scale(0.95);
    }

    #toast-banner {
      position: fixed;
      top: 76px;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 20px;
      background: rgba(5, 14, 10, 0.88);
      border: 1px solid rgba(163, 230, 53, 0.4);
      border-radius: 999px;
      color: #ecfccb;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.03em;
      opacity: 0;
      transition: opacity 0.25s ease;
      pointer-events: none;
      text-align: center;
      white-space: nowrap;
      z-index: 30;
    }
  </style>
</head>
<body>

  <!-- Lienzo WebGL Three.js -->
  <div id="webgl-viewport"></div>

  <!-- Notificación flotante -->
  <div id="toast-banner">Iniciando realidad aumentada...</div>

  <!-- PANTALLA DE CARGA -->
  <div id="loading-modal" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-stone-950 px-6 text-center transition-opacity duration-500">
    <div class="w-14 h-14 mb-4 rounded-full bg-emerald-500/10 border border-lime-300/40 flex items-center justify-center shadow-[0_0_30px_rgba(132,204,22,0.25)]">
      <div class="w-3.5 h-3.5 rounded-full bg-yellow-300 animate-ping"></div>
    </div>

    <span class="text-[10px] uppercase tracking-[0.3em] text-lime-300/90 font-semibold mb-1">
      Exhibición Inmersiva WebAR
    </span>
    <h1 class="font-museum text-3xl sm:text-4xl text-stone-100 tracking-wide mb-2">
      Pasillo Leonora Carrington
    </h1>
    <p id="loading-message" class="text-xs text-stone-400 max-w-xs mb-6 leading-relaxed">
      Decodificando arquitectura, roca y escultura monumental...
    </p>

    <div id="progress-container" class="w-60 flex flex-col items-center mb-5">
      <div class="w-full h-1.5 bg-stone-800 rounded-full overflow-hidden">
        <div id="progress-bar" class="h-full bg-gradient-to-r from-emerald-500 via-lime-400 to-yellow-300 w-0 transition-all duration-200"></div>
      </div>
      <span id="progress-text" class="text-[10px] font-mono text-lime-300/80 mt-2">0%</span>
    </div>

    <button id="btn-enter-ar" class="hidden magic-cta w-full max-w-xs py-4 px-7 rounded-full text-stone-950 font-bold text-xs uppercase tracking-widest items-center justify-center gap-2.5">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>
      </svg>
      <span>Entrar a la Sala AR</span>
    </button>
  </div>

  <!-- INTERFAZ AR -->
  <div id="ar-overlay">
    <!-- Barra Superior -->
    <header class="w-full flex items-center justify-between gap-2">
      <div id="status-pill" class="flex items-center gap-2.5 bg-stone-950/85 border border-lime-400/35 rounded-full px-4 py-2 shadow-lg">
        <span id="status-dot" class="w-2.5 h-2.5 rounded-full bg-yellow-300 animate-pulse"></span>
        <span id="status-text" class="text-[11px] font-medium text-stone-100">Apunta hacia el piso para detectar superficie</span>
      </div>

      <button id="btn-reanchor" class="interactive hidden px-3.5 py-2 rounded-full bg-stone-950/85 border border-lime-300/35 text-lime-200 text-[11px] font-medium active:scale-95 transition-transform">
        Reubicar Piso
      </button>
    </header>

    <!-- Controles Inferiores -->
    <footer class="w-full flex flex-col items-center gap-3.5">
      <!-- FASE 1: Botón de Iniciar Materialización al detectar el piso -->
      <div id="materialize-cta-wrap" class="hidden flex-col items-center gap-2">
        <button id="btn-start-materialization" class="interactive magic-cta px-8 py-4 rounded-full text-stone-950 font-extrabold text-xs uppercase tracking-widest flex items-center gap-2.5">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"/>
          </svg>

      </div>

      <!-- FASE 2: Consola Futurista Mágica de Exploración Libre (Sin límite de metros) -->
      <div id="exploration-hud" class="hidden interactive flex flex-col items-center gap-3 w-full max-w-sm">
        <div class="flex items-center justify-center gap-3 w-full">
          <!-- Botón Retroceder -->
          <button id="btn-step-back" class="magic-btn flex-1 py-3.5 px-4 rounded-2xl flex items-center justify-center gap-2 text-lime-100 text-xs font-semibold tracking-wider uppercase">
            <svg class="w-4 h-4 text-lime-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M19 14l-7 7m0 0l-7-7m7 7V3"/>
            </svg>
            <span>Atrás</span>
          </button>

          <!-- Orbe indicador de distancia recorrida (Tocar para volver al inicio) -->
          <button id="btn-reset-walk" title="Volver a la entrada" class="px-4 py-2.5 rounded-2xl bg-stone-950/90 border border-yellow-300/40 flex flex-col items-center justify-center min-w-[92px] shadow-inner active:scale-95 transition-transform">
            <span class="text-[9px] uppercase tracking-widest text-lime-300/80">Recorrido</span>
            <span id="distance-readout" class="text-sm font-mono font-bold text-yellow-300">0.0 m</span>
          </button>

          <!-- Botón Avanzar Paso Mágico -->
          <button id="btn-step-forward" class="magic-btn flex-1 py-3.5 px-4 rounded-2xl flex items-center justify-center gap-2 text-yellow-200 text-xs font-semibold tracking-wider uppercase">
            <span>Avanzar</span>
            <svg class="w-4 h-4 text-yellow-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M5 10l7-7m0 0l7 7m-7-7v18"/>
            </svg>
          </button>
        </div>

        <!-- Botones Funcionales de Foto y Video -->
        <div class="flex items-center justify-center gap-4">
          <button id="btn-capture-photo" class="flex items-center gap-2 px-5 py-2.5 rounded-full bg-stone-950/85 border border-white/25 text-white text-xs font-medium shadow-lg active:scale-95 transition-transform">
            <span class="w-5 h-5 rounded-full bg-white flex items-center justify-center">
              <svg class="w-3 h-3 text-stone-950" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
              </svg>
            </span>
            <span>Foto</span>
          </button>

          <button id="btn-capture-video" class="flex items-center gap-2 px-5 py-2.5 rounded-full bg-stone-950/85 border border-white/25 text-white text-xs font-medium shadow-lg active:scale-95 transition-transform">
            <span id="video-dot" class="w-3 h-3 rounded-full bg-red-500"></span>
            <span id="video-label">Video</span>
          </button>
        </div>
      </div>
    </footer>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
    import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

    const REPO_RAW_BASE = 'https://raw.githubusercontent.com/blenderingforconservation-maker/recorridovirtual_Leonora/main/';
    const MODELS = {
      corridor: `${REPO_RAW_BASE}models/pasillo_optimizado.glb`,
      rock: `${REPO_RAW_BASE}models/rock.glb`,
      sculpture: `${REPO_RAW_BASE}models/3DModel.glb`
    };

    let scene, camera, renderer, gltfLoader;
    let hitTestSource = null;
    let hitTestSourceRequested = false;

    // Jerarquía Espacial:
    // hallAnchorGroup (anclado fijo en el suelo físico) -> walkStageGroup (desplazamiento libre de caminata) -> interiorGroup (modelos 3D)
    let reticle, hallAnchorGroup, walkStageGroup, interiorGroup;
    let clippingPlane, leafParticles, leafMaterial, magicWaveRing, magicWaveLight;

    // Estados de la experiencia
    let floorDetected = false;
    let hallPlaced = false;
    let isMaterializing = false;
    let materializationT = 0;
    let maxRevealHeight = 10.8;
    let totalCorridorLength = 14.0;
    let lastFrameTime = performance.now();

    // Locomoción y Sensores
    let fallbackMode = false;
    let fallbackVideo = null;
    let hasGyro = false;
    let lastValidFloorY = -1.45;
    const targetWalkOffset = new THREE.Vector3(0, 0, 0);
    const currentWalkOffset = new THREE.Vector3(0, 0, 0);
    let moveButtonDir = 0; // +1 avanzar, -1 retroceder

    // Cuaterniones de orientación 3DoF
    const deviceEuler = new THREE.Euler();
    const deviceQuat = new THREE.Quaternion();
    const screenTransform = new THREE.Quaternion();
    const worldTransform = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5));
    const _zAxis = new THREE.Vector3(0, 0, 1);

    // Vectores reutilizables en renderLoop
    const _rayOrigin = new THREE.Vector3();
    const _rayDir = new THREE.Vector3();
    const _horizDir = new THREE.Vector3();
    const _camWorldPos = new THREE.Vector3();
    const _lookTarget = new THREE.Vector3();
    const _localForward = new THREE.Vector3();
    const _invAnchorQuat = new THREE.Quaternion();

    // Grabación Multimedia
    let isRecording = false;
    let mediaRecorder = null;
    let recordedChunks = [];
    let compositeCanvas = null;
    let compositeCtx = null;

    // Referencias DOM
    const domOverlay = document.getElementById('ar-overlay');
    const loadingModal = document.getElementById('loading-modal');
    const btnEnterAR = document.getElementById('btn-enter-ar');
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    const btnReanchor = document.getElementById('btn-reanchor');
    const materializeCtaWrap = document.getElementById('materialize-cta-wrap');
    const btnStartMaterialization = document.getElementById('btn-start-materialization');
    const explorationHud = document.getElementById('exploration-hud');
    const btnStepForward = document.getElementById('btn-step-forward');
    const btnStepBack = document.getElementById('btn-step-back');
    const btnResetWalk = document.getElementById('btn-reset-walk');
    const distanceReadout = document.getElementById('distance-readout');
    const toastBanner = document.getElementById('toast-banner');

    function showToast(msg) {
      toastBanner.textContent = msg;
      toastBanner.style.opacity = '1';
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => { toastBanner.style.opacity = '0'; }, 2800);
    }

    init();

    async function init() {
      const container = document.getElementById('webgl-viewport');
      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.05, 120);
      camera.position.set(0, 0, 0);
      scene.add(camera);

      renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: true,
        stencil: false,
        powerPreference: 'high-performance',
        preserveDrawingBuffer: false
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      renderer.localClippingEnabled = false;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.18;
      container.appendChild(renderer.domElement);

      renderer.domElement.addEventListener('webglcontextlost', (e) => {
        e.preventDefault();
        showToast('Recuperando contexto gráfico...');
      }, false);

      setupLighting();
      setupFloorReticle();

      // Jerarquía de la Sala
      hallAnchorGroup = new THREE.Group();
      hallAnchorGroup.visible = false;
      hallAnchorGroup.frustumCulled = false;
      scene.add(hallAnchorGroup);

      walkStageGroup = new THREE.Group();
      walkStageGroup.frustumCulled = false;
      hallAnchorGroup.add(walkStageGroup);

      interiorGroup = new THREE.Group();
      interiorGroup.frustumCulled = false;
      walkStageGroup.add(interiorGroup);

      setupMagicalLeafMaterialization();
      await loadModelsParallel();

      setupUIEvents();
      setupMediaCapture();

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }

    function setupLighting() {
      const hemiLight = new THREE.HemisphereLight(0xfef9c3, 0x14532d, 1.55);
      hemiLight.position.set(0, 10, 0);
      scene.add(hemiLight);

      const dirLight = new THREE.DirectionalLight(0xfffbeb, 1.85);
      dirLight.position.set(4, 12, 5);
      scene.add(dirLight);
    }

    // -- RETÍCULA MÁGICA EN EL PISO --
    function setupFloorReticle() {
      reticle = new THREE.Group();

      const outerRing = new THREE.Mesh(
        new THREE.RingGeometry(0.30, 0.35, 40).rotateX(-Math.PI / 2),
        new THREE.MeshBasicMaterial({ color: 0xa3e635, side: THREE.DoubleSide })
      );
      const midRing = new THREE.Mesh(
        new THREE.RingGeometry(0.16, 0.19, 32).rotateX(-Math.PI / 2),
        new THREE.MeshBasicMaterial({ color: 0xfde047, side: THREE.DoubleSide })
      );
      const innerGlow = new THREE.Mesh(
        new THREE.CircleGeometry(0.30, 32).rotateX(-Math.PI / 2),
        new THREE.MeshBasicMaterial({ color: 0x22c55e, transparent: true, opacity: 0.24, side: THREE.DoubleSide })
      );

      // Flecha indicadora de dirección de entrada al pasillo
      const dirArrow = new THREE.Mesh(
        new THREE.ConeGeometry(0.08, 0.22, 3).rotateX(-Math.PI / 2),
        new THREE.MeshBasicMaterial({ color: 0xfacc15 })
      );
      dirArrow.position.set(0, 0.01, -0.45);

      reticle.add(innerGlow, outerRing, midRing, dirArrow);
      reticle.visible = false;
      scene.add(reticle);
    }

    // -- TEXTURA DE HOJA CON HALO LUMINISCENTE --
    function createRadiantLeafTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');

      ctx.save();
      ctx.translate(64, 64);

      // Resplandor mágico suave alrededor de la hoja
      const aura = ctx.createRadialGradient(0, 0, 4, 0, 0, 60);
      aura.addColorStop(0, 'rgba(255, 255, 220, 0.55)');
      aura.addColorStop(0.5, 'rgba(190, 242, 100, 0.22)');
      aura.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = aura;
      ctx.beginPath();
      ctx.arc(0, 0, 60, 0, Math.PI * 2);
      ctx.fill();

      // Silueta de hoja botánica
      ctx.beginPath();
      ctx.moveTo(0, -48);
      ctx.bezierCurveTo(35, -30, 42, 14, 0, 46);
      ctx.bezierCurveTo(-42, 14, -35, -30, 0, -48);
      ctx.closePath();

      const leafGrad = ctx.createLinearGradient(0, -48, 0, 46);
      leafGrad.addColorStop(0, '#ffffff');
      leafGrad.addColorStop(0.5, '#f7fee7');
      leafGrad.addColorStop(1, '#d9f99d');
      ctx.fillStyle = leafGrad;
      ctx.fill();

      // Nervadura central brillante
      ctx.strokeStyle = '#fef08a';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(0, -42);
      ctx.lineTo(0, 50);
      ctx.stroke();

      ctx.restore();
      const tex = new THREE.CanvasTexture(canvas);
      tex.needsUpdate = true;
      return tex;
    }

    // -- MATERIALIZACIÓN MÁGICA Y RESPLANDECIENTE (1,400 HOJAS Y DESTELLOS GPU + ANILLO DE LUZ) --
    function setupMagicalLeafMaterialization() {
      clippingPlane = new THREE.Plane(new THREE.Vector3(0, -1, 0), 100);

      const leafTexture = createRadiantLeafTexture();

      // Gama de verdes esmeralda/lima a amarillos solares resplandecientes
      const palette = [
        new THREE.Color('#16a34a'),
        new THREE.Color('#22c55e'),
        new THREE.Color('#4ade80'),
        new THREE.Color('#84cc16'),
        new THREE.Color('#a3e635'),
        new THREE.Color('#bef264'),
        new THREE.Color('#eab308'),
        new THREE.Color('#facc15'),
        new THREE.Color('#fde047'),
        new THREE.Color('#fef08a')
      ];

      const leafCount = 1400;
      const geo = new THREE.BufferGeometry();
      const positions = new Float32Array(leafCount * 3);
      const colors = new Float32Array(leafCount * 3);
      const seeds = new Float32Array(leafCount * 4); // [phase, scale, rotSpeed, isSparkle]

      for (let i = 0; i < leafCount; i++) {
        const angle = Math.random() * Math.PI * 2;
        const radius = 0.4 + Math.random() * 2.1;
        const x = Math.cos(angle) * radius;
        const y = Math.random() * 10.5;
        const z = -Math.random() * 14.2;

        positions[i * 3] = x;
        positions[i * 3 + 1] = y;
        positions[i * 3 + 2] = z;

        const c = palette[Math.floor(Math.random() * palette.length)];
        colors[i * 3] = c.r;
        colors[i * 3 + 1] = c.g;
        colors[i * 3 + 2] = c.b;

        seeds[i * 4] = Math.random() * Math.PI * 2;
        seeds[i * 4 + 1] = 0.55 + Math.random() * 1.05;
        seeds[i * 4 + 2] = (Math.random() - 0.5) * 4.8;
        seeds[i * 4 + 3] = Math.random() < 0.28 ? 1.0 : 0.0; // 28% destellos puros de polen/luz dorada
      }

      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('aColor', new THREE.BufferAttribute(colors, 3));
      geo.setAttribute('aSeed', new THREE.BufferAttribute(seeds, 4));

      leafMaterial = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        uniforms: {
          uMap: { value: leafTexture },
          uTime: { value: 0 },
          uProgress: { value: 0 },
          uMaxHeight: { value: 10.8 },
          uOpacity: { value: 1.0 },
          uPixelRatio: { value: renderer.getPixelRatio() }
        },
        vertexShader: `
          attribute vec3 aColor;
          attribute vec4 aSeed;
          varying vec3 vColor;
          varying float vAngle;
          varying float vAlpha;
          varying float vSparkle;
          varying float vWaveGlow;

          uniform float uTime;
          uniform float uProgress;
          uniform float uMaxHeight;
          uniform float uPixelRatio;

          void main() {
            vColor = aColor;
            float phase = aSeed.x;
            float leafScale = aSeed.y;
            float rotSpeed = aSeed.z;
            vSparkle = aSeed.w;

            vec3 pos = position;
            float bandY = uProgress * uMaxHeight;

            // Vórtice ascendente mágico de hojas
            float vortexAngle = uTime * 2.2 + phase + pos.y * 0.65;
            float swirlRadius = 0.28 + 0.18 * sin(uTime * 1.7 + phase);
            pos.x += cos(vortexAngle) * swirlRadius;
            pos.z += sin(vortexAngle) * swirlRadius;

            float activeCeiling = max(0.8, bandY + 1.1);
            pos.y = mod(pos.y + uTime * (1.15 + leafScale * 0.5), activeCeiling);

            // Concentración resplandeciente en el frente de materialización
            float distToWave = abs(pos.y - bandY);
            float waveBoost = smoothstep(2.2, 0.0, distToWave);
            vWaveGlow = waveBoost;

            float twinkle = 0.65 + 0.35 * sin(uTime * 6.5 + phase * 3.0);
            vAngle = phase + uTime * rotSpeed;
            vAlpha = clamp((0.40 + waveBoost * 0.60) * twinkle, 0.0, 1.0);

            vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
            gl_Position = projectionMatrix * mvPosition;

            float baseSize = (vSparkle > 0.5 ? 64.0 : 88.0) * leafScale * (1.0 + waveBoost * 0.65);
            gl_PointSize = clamp((baseSize * uPixelRatio) / max(-mvPosition.z, 0.35), 7.0, 120.0);
          }
        `,
        fragmentShader: `
          uniform sampler2D uMap;
          uniform float uOpacity;
          varying vec3 vColor;
          varying float vAngle;
          varying float vAlpha;
          varying float vSparkle;
          varying float vWaveGlow;

          void main() {
            vec2 centered = gl_PointCoord - vec2(0.5);
            float dist = length(centered);

            if (vSparkle > 0.5) {
              // Destello estelar de 4 puntas + halo dorado
              float crossStar = max(0.0, 1.0 - abs(centered.x * centered.y) * 90.0);
              float radial = smoothstep(0.5, 0.0, dist);
              float intensity = radial * (0.6 + 0.8 * crossStar);
              if (intensity < 0.05) discard;
              vec3 sparkCol = mix(vColor, vec3(1.0, 0.99, 0.85), 0.55);
              gl_FragColor = vec4(sparkCol * 1.45, intensity * vAlpha * uOpacity);
              return;
            }

            float c = cos(vAngle);
            float s = sin(vAngle);
            vec2 rotatedUV = vec2(
              centered.x * c - centered.y * s,
              centered.x * s + centered.y * c
            ) + vec2(0.5);

            if (rotatedUV.x < 0.0 || rotatedUV.x > 1.0 || rotatedUV.y < 0.0 || rotatedUV.y > 1.0) discard;

            vec4 texColor = texture2D(uMap, rotatedUV);
            if (texColor.a < 0.08) discard;

            // Brillo esmeralda-dorado extra al cruzar la onda de materialización
            vec3 radiantColor = mix(vColor * texColor.rgb, vec3(1.0, 0.98, 0.78), vWaveGlow * 0.48);
            gl_FragColor = vec4(radiantColor * 1.35, texColor.a * vAlpha * uOpacity);
          }
        `
      });

      leafParticles = new THREE.Points(geo, leafMaterial);
      leafParticles.frustumCulled = false;
      leafParticles.visible = false;
      walkStageGroup.add(leafParticles);

      // Anillo de energía dorado-esmeralda que sube por la estructura durante la materialización
      const ringGeo = new THREE.RingGeometry(1.6, 2.35, 48).rotateX(-Math.PI / 2);
      const ringMat = new THREE.MeshBasicMaterial({
        color: 0xfde047,
        transparent: true,
        opacity: 0.0,
        side: THREE.DoubleSide,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      magicWaveRing = new THREE.Mesh(ringGeo, ringMat);
      magicWaveRing.visible = false;
      magicWaveRing.frustumCulled = false;
      walkStageGroup.add(magicWaveRing);

      // Luz cálida viajera de materialización
      magicWaveLight = new THREE.PointLight(0xfde047, 0, 14);
      walkStageGroup.add(magicWaveLight);
    }

    function fixCorridorMaterial(mat, maxAnisotropy) {
      if (!mat) return;
      const name = (mat.name || '').toLowerCase();
      const cutoutNames = ['alexandrapalm', 'wild bush', 'plantas', 'plant.leaf', 'rejapared', 'leaves', 'orchid', 'sepal'];
      const isCutout = cutoutNames.some(k => name.includes(k));

      if (isCutout) {
        mat.transparent = false;
        mat.alphaTest = 0.42;
        mat.depthWrite = true;
        mat.side = THREE.DoubleSide;
      } else {
        mat.transparent = false;
        mat.alphaTest = 0;
        mat.depthWrite = true;
        mat.side = THREE.FrontSide;
      }

      ['map', 'normalMap', 'roughnessMap', 'metalnessMap'].forEach((mapKey) => {
        if (mat[mapKey]) mat[mapKey].anisotropy = maxAnisotropy;
      });
    }

    // -- CARGA DE MODELOS, NIVELACIÓN A RAS DE PISO (pisoceart1) Y ESCULTURA MÁS GRANDE Y MÁS ENFRENTE --
    async function loadModelsParallel() {
      await MeshoptDecoder.ready;

      const dracoLoader = new DRACOLoader();
      dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
      gltfLoader = new GLTFLoader();
      gltfLoader.setDRACOLoader(dracoLoader);
      gltfLoader.setMeshoptDecoder(MeshoptDecoder);

      const progressMap = { corridor: 0, rock: 0, sculpture: 0 };
      const updateUIProgress = () => {
        const total = Math.min(99, Math.round((progressMap.corridor * 0.65) + (progressMap.rock * 0.15) + (progressMap.sculpture * 0.20)));
        document.getElementById('progress-bar').style.width = total + '%';
        document.getElementById('progress-text').textContent = total + '%';
      };

      const loadWithProgress = (url, key) =>
        new Promise((resolve, reject) => {
          gltfLoader.load(
            url,
            (gltf) => { progressMap[key] = 100; updateUIProgress(); resolve(gltf); },
            (xhr) => {
              if (xhr.total > 0) {
                progressMap[key] = (xhr.loaded / xhr.total) * 100;
                updateUIProgress();
              }
            },
            reject
          );
        });

      try {
        const [gltfCorridor, gltfRock, gltfSculpture] = await Promise.all([
          loadWithProgress(MODELS.corridor, 'corridor'),
          loadWithProgress(MODELS.rock, 'rock'),
          loadWithProgress(MODELS.sculpture, 'sculpture')
        ]);

        const corridor = gltfCorridor.scene;
        corridor.scale.setScalar(5.2);
        corridor.updateMatrixWorld(true);

        // Aislar exclusivamente las losas pisoceart1 para nivelarlas a Y = 0.000m (sin flotar)
        const pisoSlabBox = new THREE.Box3();
        const wallBox = new THREE.Box3();
        let hasPisoSlab = false;
        let hasWallMesh = false;

        corridor.traverse((node) => {
          if (node.isMesh) {
            const mName = (node.name || '').toLowerCase();
            const matName = (node.material?.name || '').toLowerCase();
            if (mName.includes('pisoceart') || matName.includes('pisoceart')) {
              pisoSlabBox.expandByObject(node);
              hasPisoSlab = true;
            }
            if (mName.includes('muro') || matName.includes('murocear')) {
              wallBox.expandByObject(node);
              hasWallMesh = true;
            }
          }
        });

        const fullCorrBox = new THREE.Box3().setFromObject(corridor);
        const refCenter = hasWallMesh ? wallBox.getCenter(new THREE.Vector3()) : fullCorrBox.getCenter(new THREE.Vector3());
        const exactFloorY = hasPisoSlab ? pisoSlabBox.min.y : fullCorrBox.min.y;
        const entranceZ = hasWallMesh ? wallBox.max.z : fullCorrBox.max.z;
        const backZ = hasWallMesh ? wallBox.min.z : fullCorrBox.min.z;

        corridor.position.set(
          -refCenter.x,
          -exactFloorY,
          -entranceZ
        );
        corridor.updateMatrixWorld(true);

        totalCorridorLength = Math.abs(entranceZ - backZ);

        // Colocar el conjunto de roca y escultura MÁS ENFRENTE (46% de la profundidad del pasillo)
        // dejando más de la mitad posterior del pasillo libre para caminar y rodear la obra hasta el fondo
        const sculptureZ = -(totalCorridorLength * 0.46);

        // Pedestal de roca más grande (escala 3.60) apoyado exactamente sobre Y = 0
        const rock = gltfRock.scene;
        rock.scale.setScalar(3.60);
        rock.updateMatrixWorld(true);
        const rockBox = new THREE.Box3().setFromObject(rock);
        const rockCenter = rockBox.getCenter(new THREE.Vector3());
        rock.position.set(-rockCenter.x, -rockBox.min.y, sculptureZ - rockCenter.z);
        rock.updateMatrixWorld(true);
        const rockHeight = rockBox.max.y - rockBox.min.y;

        // Escultura más grande (escala 5.50) posada sobre la cumbre de la roca
        const sculpture = gltfSculpture.scene;
        sculpture.scale.setScalar(5.50);
        sculpture.updateMatrixWorld(true);
        const sculpBox = new THREE.Box3().setFromObject(sculpture);
        const sculpCenter = sculpBox.getCenter(new THREE.Vector3());
        sculpture.position.set(
          -sculpCenter.x,
          rockHeight - sculpBox.min.y - 0.10,
          sculptureZ - sculpCenter.z
        );
        sculpture.updateMatrixWorld(true);

        // Luz puntual curatorial dedicada sobre la escultura monumental
        const sculptureLight = new THREE.PointLight(0xfef08a, 2.2, 12);
        sculptureLight.position.set(0, rockHeight + 2.5, sculptureZ + 1.5);
        interiorGroup.add(corridor, rock, sculpture, sculptureLight);

        const combinedBox = new THREE.Box3().setFromObject(interiorGroup);
        maxRevealHeight = Math.max(10.5, combinedBox.max.y + 0.6);
        leafMaterial.uniforms.uMaxHeight.value = maxRevealHeight;
        magicWaveRing.position.set(0, 0.1, sculptureZ * 0.65);

        const maxAniso = Math.min(2, renderer.capabilities.getMaxAnisotropy());
        const processedMaterials = new Set();

        interiorGroup.traverse((node) => {
          node.frustumCulled = false;
          node.matrixAutoUpdate = false;
          node.updateMatrix();
          if (node.isMesh && node.material) {
            const mats = Array.isArray(node.material) ? node.material : [node.material];
            mats.forEach((mat) => {
              if (!processedMaterials.has(mat)) {
                fixCorridorMaterial(mat, maxAniso);
                mat.clippingPlanes = [clippingPlane];
                mat.needsUpdate = true;
                processedMaterials.add(mat);
              }
            });
          }
        });

        dracoLoader.dispose();

        document.getElementById('progress-bar').style.width = '100%';
        document.getElementById('progress-text').textContent = '100%';
        document.getElementById('progress-container').classList.add('hidden');
        document.getElementById('loading-message').textContent = 'Modelos listos · Detecta el suelo e inicia la materialización.';
        btnEnterAR.classList.remove('hidden');
        btnEnterAR.classList.add('flex');
      } catch (e) {
        console.error('Error cargando modelos:', e);
        document.getElementById('loading-message').textContent = 'Error al cargar modelos. Verifica tu conexión.';
      }
    }

    // -- EVENTOS DE INTERFAZ Y CONTROLES DE CAMINATA SIN LÍMITE --
    function setupUIEvents() {
      btnEnterAR.addEventListener('click', startARExperience);
      btnStartMaterialization.addEventListener('click', lockFloorAndMaterialize);
      btnReanchor.addEventListener('click', returnToFloorDetection);

      // Caminata por pasos largos o manteniendo presionado (sin tope corto de metros)
      const bindWalkButton = (btn, dir) => {
        btn.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          btn.classList.add('pressing');
          moveButtonDir = dir;
          advanceAlongViewDirection(dir * 1.85);
        });
        const stopPress = () => {
          btn.classList.remove('pressing');
          if (moveButtonDir === dir) moveButtonDir = 0;
        };
        btn.addEventListener('pointerup', stopPress);
        btn.addEventListener('pointerleave', stopPress);
        btn.addEventListener('pointercancel', stopPress);
      };

      bindWalkButton(btnStepForward, 1);
      bindWalkButton(btnStepBack, -1);

      btnResetWalk.addEventListener('click', () => {
        targetWalkOffset.set(0, 0, 0);
        showToast('Regresando al inicio del pasillo');
      });
    }

    // Avanza en la dirección horizontal hacia donde mira el usuario (permite recorrer todo el pasillo y más allá)
    function advanceAlongViewDirection(stepMeters) {
      if (!hallPlaced) return;

      camera.getWorldDirection(_rayDir);
      _horizDir.set(_rayDir.x, 0, _rayDir.z);
      if (_horizDir.lengthSq() < 0.001) {
        _horizDir.set(0, 0, -1);
      } else {
        _horizDir.normalize();
      }

      // Convertir dirección mundial de mirada al espacio local del pasillo anclado
      _invAnchorQuat.copy(hallAnchorGroup.quaternion).invert();
      _localForward.copy(_horizDir).applyQuaternion(_invAnchorQuat);
      _localForward.y = 0;
      _localForward.normalize();

      // Desplazar walkStageGroup en sentido inverso para que el usuario avance dentro del pasillo
      targetWalkOffset.x -= _localForward.x * stepMeters;
      targetWalkOffset.z -= _localForward.z * stepMeters;

      // Mantener al visitante dentro del ancho de los muros pero permitir recorrer todo el largo completo (-10m a +45m)
      targetWalkOffset.x = THREE.MathUtils.clamp(targetWalkOffset.x, -1.45, 1.45);
      targetWalkOffset.z = THREE.MathUtils.clamp(targetWalkOffset.z, -10.0, totalCorridorLength + 25.0);
    }

    // -- INICIO DE EXPERIENCIA AR --
    async function startARExperience() {
      loadingModal.classList.add('hidden');

      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try { await DeviceOrientationEvent.requestPermission(); } catch (_) {}
      }

      if (navigator.xr) {
        try {
          const supported = await navigator.xr.isSessionSupported('immersive-ar');
          if (supported) {
            const session = await navigator.xr.requestSession('immersive-ar', {
              optionalFeatures: ['hit-test', 'local-floor', 'dom-overlay'],
              domOverlay: { root: domOverlay }
            });

            try {
              renderer.xr.setReferenceSpaceType('local-floor');
              lastValidFloorY = 0;
            } catch (_) {
              renderer.xr.setReferenceSpaceType('local');
              lastValidFloorY = -1.45;
            }

            await renderer.xr.setSession(session);
            domOverlay.classList.add('active');
            setupPedometerAndTouchLook();

            session.addEventListener('end', () => {
              domOverlay.classList.remove('active');
              window.location.reload();
            });

            lastFrameTime = performance.now();
            renderer.setAnimationLoop(renderLoop);
            return;
          }
        } catch (err) {
          console.warn('Usando cámara AR directa:', err);
        }
      }

      await startFallbackCameraAR();
    }

    async function startFallbackCameraAR() {
      fallbackMode = true;
      domOverlay.classList.add('active');

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });
        fallbackVideo = document.createElement('video');
        fallbackVideo.srcObject = stream;
        fallbackVideo.setAttribute('playsinline', '');
        fallbackVideo.muted = true;
        await fallbackVideo.play();
        Object.assign(fallbackVideo.style, {
          position: 'fixed',
          inset: '0',
          width: '100%',
          height: '100%',
          objectFit: 'cover',
          zIndex: '0'
        });
        document.body.prepend(fallbackVideo);
      } catch (_) {
        showToast('Vista 3D activa');
      }

      lastValidFloorY = -1.45;
      camera.position.set(0, 0, 0);
      camera.rotation.set(-0.32, 0, 0, 'YXZ');

      setupPedometerAndTouchLook();
      lastFrameTime = performance.now();
      renderer.setAnimationLoop(renderLoop);
    }

    function setupPedometerAndTouchLook() {
      window.addEventListener('deviceorientation', (e) => {
        if (e.alpha === null || e.beta === null || e.gamma === null) return;
        if (renderer.xr.isPresenting) return;
        hasGyro = true;
        const alpha = THREE.MathUtils.degToRad(e.alpha);
        const beta = THREE.MathUtils.degToRad(e.beta);
        const gamma = THREE.MathUtils.degToRad(e.gamma);
        const orient = THREE.MathUtils.degToRad(window.screen?.orientation?.angle || window.orientation || 0);

        deviceEuler.set(beta, alpha, -gamma, 'YXZ');
        deviceQuat.setFromEuler(deviceEuler);
        deviceQuat.multiply(worldTransform);
        deviceQuat.multiply(screenTransform.setFromAxisAngle(_zAxis, -orient));
        camera.quaternion.copy(deviceQuat);
      });

      // Podómetro biomecánico con filtro de gravedad para caminar físicamente con pasos largos (1.55m)
      let gravityMag = 9.81;
      let lastStepTime = 0;
      window.addEventListener('devicemotion', (e) => {
        if (!hallPlaced) return;
        const acc = e.accelerationIncludingGravity;
        if (!acc) return;
        const rawMag = Math.sqrt((acc.x || 0) ** 2 + (acc.y || 0) ** 2 + (acc.z || 0) ** 2);
        gravityMag = gravityMag * 0.88 + rawMag * 0.12;
        const deltaAcc = Math.abs(rawMag - gravityMag);

        const now = performance.now();
        if (deltaAcc > 1.18 && now - lastStepTime > 290) {
          lastStepTime = now;
          advanceAlongViewDirection(1.55);
        }
      });

      // Giro táctil suave cuando se explora en pantallas sin giroscopio
      let lastX = null;
      let lastY = null;
      window.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          lastX = e.touches[0].clientX;
          lastY = e.touches[0].clientY;
        }
      }, { passive: true });

      window.addEventListener('touchmove', (e) => {
        if (e.touches.length !== 1 || lastY === null || renderer.xr.isPresenting) return;
        const dx = e.touches[0].clientX - lastX;
        const dy = e.touches[0].clientY - lastY;
        lastX = e.touches[0].clientX;
        lastY = e.touches[0].clientY;

        if (!hasGyro) {
          camera.rotation.y -= dx * 0.005;
          camera.rotation.x = THREE.MathUtils.clamp(camera.rotation.x - dy * 0.005, -1.25, 0.85);
        }
      }, { passive: true });
    }

    // -- DETECTOR DE PLANO DEL PISO --
    function updateFloorDetector(frame) {
      let validFloorHit = false;
      camera.getWorldPosition(_camWorldPos);
      camera.getWorldDirection(_rayDir);

      if (frame && !fallbackMode) {
        const referenceSpace = renderer.xr.getReferenceSpace();
        const session = renderer.xr.getSession();

        if (!hitTestSourceRequested && session) {
          session.requestReferenceSpace('viewer').then((viewerSpace) => {
            if (session.requestHitTestSource) {
              session.requestHitTestSource({ space: viewerSpace }).then((source) => {
                hitTestSource = source;
              }).catch(() => {});
            }
          }).catch(() => {});
          hitTestSourceRequested = true;
        }

        if (hitTestSource && referenceSpace) {
          const results = frame.getHitTestResults(hitTestSource);
          for (let i = 0; i < results.length; i++) {
            const pose = results[i].getPose(referenceSpace);
            if (!pose) continue;
            const m = pose.transform.matrix;
            const normalY = m[5];
            const hitY = pose.transform.position.y;

            // Validar que sea un plano horizontal en el suelo por debajo de la cámara
            if (normalY > 0.72 && hitY < (_camWorldPos.y - 0.45)) {
              lastValidFloorY = hitY;
              reticle.position.set(pose.transform.position.x, hitY, pose.transform.position.z);
              validFloorHit = true;
              break;
            }
          }
        }
      }

      if (!validFloorHit) {
        // Intersección geométrica directa con la cota del suelo cuando miras hacia abajo
        const targetY = lastValidFloorY;
        if (_rayDir.y < -0.06) {
          const dist = (targetY - _camWorldPos.y) / _rayDir.y;
          const clampedDist = THREE.MathUtils.clamp(dist, 1.4, 4.0);
          reticle.position.set(
            _camWorldPos.x + _rayDir.x * clampedDist,
            targetY,
            _camWorldPos.z + _rayDir.z * clampedDist
          );
          validFloorHit = true;
        } else {
          _horizDir.set(_rayDir.x, 0, _rayDir.z).normalize();
          if (_horizDir.lengthSq() < 0.001) _horizDir.set(0, 0, -1);
          reticle.position.set(
            _camWorldPos.x + _horizDir.x * 2.1,
            targetY,
            _camWorldPos.z + _horizDir.z * 2.1
          );
          validFloorHit = true;
        }
      }

      // Orientar la retícula hacia el usuario
      _lookTarget.set(_camWorldPos.x, reticle.position.y, _camWorldPos.z);
      reticle.lookAt(_lookTarget);
      reticle.visible = true;

      if (!floorDetected && validFloorHit) {
        floorDetected = true;
        statusDot.className = 'w-2.5 h-2.5 rounded-full bg-lime-400 animate-ping';
        statusText.textContent = 'Plano del piso detectado';
        materializeCtaWrap.classList.remove('hidden');
        materializeCtaWrap.classList.add('flex');
      }
    }

    // -- BOTÓN «INICIAR MATERIALIZACIÓN»: FIJAR SALA EN EL MERO PISO E INVOCAR HOJAS --
    function lockFloorAndMaterialize() {
      if (!reticle.visible) return;

      hallAnchorGroup.matrixAutoUpdate = true;
      hallAnchorGroup.position.copy(reticle.position);

      camera.getWorldPosition(_camWorldPos);
      _lookTarget.set(_camWorldPos.x, hallAnchorGroup.position.y, _camWorldPos.z);
      hallAnchorGroup.lookAt(_lookTarget);

      // Congelar matriz del ancla en el piso físico
      hallAnchorGroup.updateMatrix();
      hallAnchorGroup.updateMatrixWorld(true);
      hallAnchorGroup.matrixAutoUpdate = false;
      hallAnchorGroup.visible = true;

      targetWalkOffset.set(0, 0, 0);
      currentWalkOffset.set(0, 0, 0);
      walkStageGroup.position.set(0, 0, 0);

      hallPlaced = true;
      reticle.visible = false;

      materializeCtaWrap.classList.add('hidden');
      materializeCtaWrap.classList.remove('flex');
      btnReanchor.classList.remove('hidden');
      explorationHud.classList.remove('hidden');

      statusDot.className = 'w-2.5 h-2.5 rounded-full bg-lime-400';
      statusText.textContent = 'Materializando sala con hojas resplandecientes...';

      // Activar barrido mágico de materialización
      renderer.localClippingEnabled = true;
      isMaterializing = true;
      materializationT = 0;
      clippingPlane.constant = hallAnchorGroup.position.y + 0.02;

      leafParticles.visible = true;
      leafMaterial.uniforms.uProgress.value = 0;
      leafMaterial.uniforms.uOpacity.value = 1.0;

      magicWaveRing.visible = true;
      magicWaveRing.material.opacity = 0.85;
      magicWaveLight.intensity = 4.5;

      showToast('¡Materializando Pasillo y Escultura en el piso!');
    }

    function returnToFloorDetection() {
      hallPlaced = false;
      floorDetected = false;
      isMaterializing = false;
      renderer.localClippingEnabled = false;

      hallAnchorGroup.visible = false;
      leafParticles.visible = false;
      magicWaveRing.visible = false;
      magicWaveLight.intensity = 0;

      targetWalkOffset.set(0, 0, 0);
      currentWalkOffset.set(0, 0, 0);
      walkStageGroup.position.set(0, 0, 0);

      btnReanchor.classList.add('hidden');
      explorationHud.classList.add('hidden');
      statusDot.className = 'w-2.5 h-2.5 rounded-full bg-yellow-300 animate-pulse';
      statusText.textContent = 'Apunta hacia el piso para detectar superficie';
      showToast('Apunta al piso para ubicar la sala');
    }

    // -- BUCLE PRINCIPAL --
    function renderLoop(timestamp, frame) {
      const dt = Math.min(0.05, (timestamp - lastFrameTime) / 1000 || 0.016);
      lastFrameTime = timestamp;
      const timeSec = timestamp * 0.001;

      if (!hallPlaced) {
        updateFloorDetector(frame);
      } else {
        // Avance continuo fluido si se mantiene presionado el botón Avanzar o Atrás
        if (moveButtonDir !== 0) {
          advanceAlongViewDirection(moveButtonDir * 4.4 * dt);
        }

        // Interpolación sedosa de caminata sobre walkStageGroup (000m nivel de piso)
        currentWalkOffset.lerp(targetWalkOffset, Math.min(1, dt * 8.5));
        walkStageGroup.position.set(currentWalkOffset.x, 0, currentWalkOffset.z);

        // Actualizar indicador de metros recorridos hacia el interior
        const walkedMeters = currentWalkOffset.z;
        distanceReadout.textContent = `${walkedMeters.toFixed(1)} m`;

        // Animación de materialización resplandeciente
        if (isMaterializing) {
          materializationT = Math.min(1, materializationT + dt * 0.28);
          // Curva easeOutCubic para una revelación majestuosa
          const eased = 1 - Math.pow(1 - materializationT, 3);
          const revealH = eased * maxRevealHeight;

          clippingPlane.constant = hallAnchorGroup.position.y + revealH;

          leafMaterial.uniforms.uTime.value = timeSec;
          leafMaterial.uniforms.uProgress.value = eased;
          leafMaterial.uniforms.uOpacity.value = 1.0;

          magicWaveRing.position.y = Math.min(revealH, 6.0);
          magicWaveRing.rotation.z = timeSec * 1.8;
          magicWaveRing.scale.setScalar(1.0 + Math.sin(timeSec * 5.0) * 0.12);
          magicWaveRing.material.opacity = (1.0 - materializationT) * 0.85;

          magicWaveLight.position.set(0, Math.min(revealH + 0.5, 6.5), -(totalCorridorLength * 0.42));
          magicWaveLight.intensity = (1.0 - materializationT * 0.7) * 5.0;

          if (materializationT >= 1) {
            isMaterializing = false;
            renderer.localClippingEnabled = false;
            magicWaveRing.visible = false;
            magicWaveLight.intensity = 0;
            statusText.textContent = 'Sala fija en el piso · Camina hasta el fondo';
            showToast('¡Sala materializada! Explora todo el pasillo');
          }
        } else if (leafParticles.visible) {
          // Mantener una brisa mágica sutil de hojas y destellos flotando en el pasillo
          leafMaterial.uniforms.uTime.value = timeSec * 0.65;
          leafMaterial.uniforms.uOpacity.value = Math.max(0.42, leafMaterial.uniforms.uOpacity.value - dt * 0.25);
        }
      }

      renderer.render(scene, camera);

      if (isRecording && compositeCtx) {
        drawCompositeFrame(false);
      }
    }

    // -- CAPTURA DE FOTO Y VIDEO LIGERO COMPATIBLE CON ANDROID E IOS --
    function ensureCompositeCanvas(forVideo = false) {
      const srcW = renderer.domElement.width;
      const srcH = renderer.domElement.height;
      const maxDim = forVideo ? 960 : 1600;
      const scale = Math.min(1, maxDim / Math.max(srcW, srcH));
      const w = Math.max(2, Math.floor((srcW * scale) / 2) * 2);
      const h = Math.max(2, Math.floor((srcH * scale) / 2) * 2);

      if (!compositeCanvas) {
        compositeCanvas = document.createElement('canvas');
        compositeCtx = compositeCanvas.getContext('2d', { alpha: false });
      }
      if (compositeCanvas.width !== w || compositeCanvas.height !== h) {
        compositeCanvas.width = w;
        compositeCanvas.height = h;
      }
    }

    function drawCompositeFrame(forceRender = true, forVideo = true) {
      if (forceRender) renderer.render(scene, camera);
      ensureCompositeCanvas(forVideo);

      const w = compositeCanvas.width;
      const h = compositeCanvas.height;

      if (fallbackVideo && fallbackVideo.readyState >= 2) {
        const vw = fallbackVideo.videoWidth || w;
        const vh = fallbackVideo.videoHeight || h;
        const s = Math.max(w / vw, h / vh);
        const sw = vw * s;
        const sh = vh * s;
        compositeCtx.drawImage(fallbackVideo, (w - sw) / 2, (h - sh) / 2, sw, sh);
      } else {
        compositeCtx.fillStyle = '#050a08';
        compositeCtx.fillRect(0, 0, w, h);
      }

      compositeCtx.drawImage(renderer.domElement, 0, 0, w, h);
    }

    async function saveOrShareFile(blob, filename, mimeType) {
      const file = new File([blob], filename, { type: mimeType });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({ files: [file], title: 'Sala Leonora Carrington AR' });
          return;
        } catch (_) {}
      }
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.download = filename;
      link.href = url;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    }

    function setupMediaCapture() {
      const btnPhoto = document.getElementById('btn-capture-photo');
      const btnVideo = document.getElementById('btn-capture-video');
      const videoLabel = document.getElementById('video-label');
      const videoDot = document.getElementById('video-dot');

      btnPhoto.addEventListener('click', () => {
        drawCompositeFrame(true, false);
        compositeCanvas.toBlob(async (blob) => {
          if (!blob) return;
          showToast('Guardando foto...');
          await saveOrShareFile(blob, `Sala_Leonora_${Date.now()}.png`, 'image/png');
        }, 'image/png', 0.92);
      });

      btnVideo.addEventListener('click', () => {
        if (!isRecording) {
          drawCompositeFrame(true, true);
          const stream = compositeCanvas.captureStream(24);
          const mimeCandidates = [
            'video/mp4;codecs=avc1.42E01E',
            'video/mp4',
            'video/webm;codecs=vp8',
            'video/webm'
          ];
          const mimeType = mimeCandidates.find(t => MediaRecorder.isTypeSupported(t)) || 'video/webm';

          mediaRecorder = new MediaRecorder(stream, {
            mimeType,
            videoBitsPerSecond: 1800000
          });
          recordedChunks = [];

          mediaRecorder.ondataavailable = (e) => {
            if (e.data && e.data.size > 0) recordedChunks.push(e.data);
          };

          mediaRecorder.onstop = async () => {
            const ext = mimeType.includes('mp4') ? 'mp4' : 'webm';
            const blob = new Blob(recordedChunks, { type: mimeType });
            showToast('Guardando video...');
            await saveOrShareFile(blob, `Recorrido_Leonora_${Date.now()}.${ext}`, mimeType);
          };

          mediaRecorder.start(300);
          isRecording = true;
          videoLabel.textContent = 'Detener';
          videoDot.classList.add('animate-ping');
          showToast('Grabando video AR...');
        } else {
          mediaRecorder.stop();
          isRecording = false;
          videoLabel.textContent = 'Video';
          videoDot.classList.remove('animate-ping');
        }
      });
    }
  </script>
</body>
</html>

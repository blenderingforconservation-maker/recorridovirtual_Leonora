<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Sala WebAR · Museo Leonora Carrington</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Tipografías Curatoriales -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- Importmap Oficial Three.js r160 -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #070d0b;
      font-family: 'Inter', sans-serif;
      overscroll-behavior: none;
    }

    .font-museum {
      font-family: 'Cormorant Garamond', Georgia, serif;
    }

    #webgl-viewport {
      position: fixed;
      inset: 0;
      z-index: 2;
    }

    /* Superposición AR limpia (sin invocar jamás requestFullscreen) */
    #ar-overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      display: none;
      flex-direction: column;
      justify-content: space-between;
      padding: env(safe-area-inset-top, 14px) env(safe-area-inset-right, 16px) env(safe-area-inset-bottom, 20px) env(safe-area-inset-left, 16px);
    }

    #ar-overlay.active {
      display: flex;
    }

    .interactive {
      pointer-events: auto;
      touch-action: manipulation;
    }

    /* Estética Futurista Mágica (Alquimia Esmeralda & Oro Solar) */
    .magic-deck {
      background: linear-gradient(135deg, rgba(6, 20, 15, 0.88) 0%, rgba(12, 32, 24, 0.84) 100%);
      border: 1px solid rgba(163, 230, 53, 0.36);
      box-shadow: 0 10px 32px rgba(0, 0, 0, 0.65), 0 0 22px rgba(34, 197, 94, 0.18), inset 0 1px 0 rgba(254, 240, 138, 0.22);
    }

    .magic-btn {
      position: relative;
      overflow: hidden;
      background: radial-gradient(circle at 50% 0%, rgba(163, 230, 53, 0.30), rgba(16, 46, 33, 0.92) 75%);
      border: 1px solid rgba(250, 204, 21, 0.48);
      box-shadow: 0 0 18px rgba(132, 204, 22, 0.24), inset 0 0 12px rgba(250, 204, 21, 0.15);
      transition: transform 0.12s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    }

    .magic-btn:active,
    .magic-btn.is-pressing {
      transform: scale(0.93);
      border-color: rgba(254, 240, 138, 0.95);
      box-shadow: 0 0 28px rgba(163, 230, 53, 0.65), inset 0 0 16px rgba(250, 204, 21, 0.38);
    }

    .magic-btn-primary {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.38) 0%, rgba(132, 204, 22, 0.44) 50%, rgba(234, 179, 8, 0.40) 100%);
      border: 1px solid rgba(253, 224, 71, 0.68);
    }

    #toast-banner {
      position: fixed;
      top: 68px;
      left: 50%;
      transform: translateX(-50%);
      padding: 7px 20px;
      background: rgba(6, 18, 14, 0.90);
      border: 1px solid rgba(163, 230, 53, 0.40);
      border-radius: 999px;
      color: #ecfccb;
      font-size: 11px;
      letter-spacing: 0.04em;
      opacity: 0;
      transition: opacity 0.25s ease;
      pointer-events: none;
      text-align: center;
      width: max-content;
      max-width: 90vw;
      z-index: 30;
    }
  </style>
</head>
<body>

  <!-- Lienzo WebGL Three.js -->
  <div id="webgl-viewport"></div>

  <!-- PANTALLA DE CARGA Y ENTRADA -->
  <div id="loading-modal" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-stone-950 px-6 text-center transition-opacity duration-500">
    <div class="w-12 h-12 mb-4 rounded-full bg-emerald-500/10 border border-lime-300/30 flex items-center justify-center">
      <div class="w-3 h-3 rounded-full bg-lime-300 animate-ping"></div>
    </div>

    <span class="text-[10px] uppercase tracking-[0.28em] text-lime-300/80 font-medium mb-1">
      Sala de Exhibición Virtual WebAR
    </span>
    <h1 class="font-museum text-3xl sm:text-4xl text-stone-100 tracking-wide mb-2">
      Pasillo Surreal
    </h1>
    <p id="loading-message" class="text-xs text-stone-400 max-w-xs mb-6 leading-relaxed">
      Optimizando y cargando sala museográfica...
    </p>

    <!-- Progreso -->
    <div id="progress-container" class="w-56 flex flex-col items-center mb-4">
      <div class="w-full h-1 bg-stone-800 rounded-full overflow-hidden">
        <div id="progress-bar" class="h-full bg-gradient-to-r from-emerald-500 via-lime-400 to-yellow-300 w-0 transition-all duration-300"></div>
      </div>
      <span id="progress-text" class="text-[10px] font-mono text-stone-500 mt-2">0%</span>
    </div>

    <!-- Botón de Entrada (oculto hasta cargar) -->
    <button id="btn-enter-ar" class="hidden w-full max-w-xs py-3.5 px-6 rounded-full bg-gradient-to-r from-emerald-400 via-lime-300 to-yellow-300 hover:opacity-95 text-stone-950 font-semibold text-xs uppercase tracking-widest shadow-xl items-center justify-center gap-2 transition-all">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
      <span>Iniciar Cámara AR</span>
    </button>
  </div>

  <!-- INTERFAZ AR CON DETECTOR DE SUELO Y NAVEGACIÓN MÁGICA -->
  <div id="ar-overlay">
    <div id="toast-banner">Apunta hacia el piso para detectar el suelo...</div>

    <!-- Barra Superior: Estado del Detector de Piso y Botón de Reubicación -->
    <header class="w-full flex items-center justify-between gap-2">
      <div id="scanner-pill" class="magic-deck rounded-full px-3.5 py-1.5 flex items-center gap-2">
        <span id="scanner-dot" class="w-2 h-2 rounded-full bg-yellow-300"></span>
        <span id="scanner-text" class="text-[11px] font-medium text-lime-100">Apunta al piso para detectar el suelo</span>
      </div>

      <button id="btn-relocate-hall" type="button" class="interactive hidden magic-deck px-3.5 py-1.5 rounded-full text-lime-200 text-[11px] font-medium active:scale-95 transition-transform">
        Reubicar en Piso
      </button>
    </header>

    <!-- Consola Inferior: Anclaje en Piso + Locomoción Mágica + Foto/Video -->
    <footer class="w-full flex flex-col items-center gap-3 mb-1">
      <!-- Botón de Anclaje Manual Instantáneo (Fase 1: Detección de Suelo) -->
      <button id="btn-place-hall" type="button" class="interactive magic-btn magic-btn-primary px-7 py-3.5 rounded-full text-yellow-100 font-semibold text-xs uppercase tracking-widest shadow-2xl flex items-center gap-2.5">
        <span class="w-2 h-2 rounded-full bg-lime-300"></span>
        <span id="btn-place-label">Fijar Sala en el Piso Aquí</span>
      </button>

      <!-- Consola Mágica de Locomoción (Fase 2: Exploración Caminando + Botones Futuristas) -->
      <div id="walk-controls" class="hidden interactive magic-deck w-full max-w-sm rounded-full p-2 flex items-center justify-between gap-2">
        <!-- Botón Retroceder Paso -->
        <button id="btn-step-back" type="button" class="magic-btn rounded-full px-4 py-3 flex items-center gap-1.5 text-lime-100 text-xs font-medium tracking-wider uppercase" aria-label="Retroceder">
          <svg class="w-4 h-4 text-yellow-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7" />
          </svg>
          <span>Atrás</span>
        </button>

        <!-- Orbe Central Indicador de Recorrido (Tocar para volver a la entrada) -->
        <button id="btn-step-home" type="button" class="flex flex-col items-center justify-center px-3 py-1 rounded-full hover:bg-white/5 transition-colors" title="Toca para regresar a la entrada">
          <div class="flex items-center gap-1.5">
            <span id="step-pulse-left" class="w-1.5 h-1.5 rounded-full bg-yellow-300 transition-transform"></span>
            <span id="walk-distance-label" class="font-museum text-sm text-lime-200 tracking-widest font-semibold">0.0 m</span>
            <span id="step-pulse-right" class="w-1.5 h-1.5 rounded-full bg-emerald-400 transition-transform"></span>
          </div>
          <span class="text-[9px] uppercase tracking-[0.18em] text-stone-300/85">Camina o Impulsa</span>
        </button>

        <!-- Botón Avanzar Paso Mágico -->
        <button id="btn-step-forward" type="button" class="magic-btn magic-btn-primary rounded-full px-5 py-3 flex items-center gap-1.5 text-yellow-100 text-xs font-semibold tracking-wider uppercase" aria-label="Avanzar">
          <span>Avanzar</span>
          <svg class="w-4 h-4 text-yellow-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M13 5l7 7-7 7M5 5l7 7-7 7" />
          </svg>
        </button>
      </div>

      <!-- Controles de Captura Multimedia Directa -->
      <div id="media-controls" class="hidden interactive flex items-center gap-4">
        <button id="btn-capture-photo" type="button" class="magic-deck flex items-center gap-2.5 px-5 py-2.5 rounded-full text-white text-xs font-medium active:scale-95 transition-transform">
          <span class="w-5 h-5 rounded-full bg-gradient-to-tr from-lime-300 to-yellow-200 flex items-center justify-center">
            <svg class="w-3 h-3 text-stone-950" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" /></svg>
          </span>
          <span>Foto</span>
        </button>
        <button id="btn-capture-video" type="button" class="magic-deck flex items-center gap-2.5 px-5 py-2.5 rounded-full text-white text-xs font-medium active:scale-95 transition-transform">
          <span id="video-dot" class="w-2.5 h-2.5 rounded-full bg-red-500"></span>
          <span id="video-label">Video</span>
        </button>
      </div>
    </footer>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
    import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

    // Rutas Oficiales del Repositorio
    const REPO_RAW_BASE = 'https://raw.githubusercontent.com/blenderingforconservation-maker/recorridovirtual_Leonora/main/';
    const MODELS = {
      corridor: `${REPO_RAW_BASE}models/pasillo_optimizado.glb`,
      rock: `${REPO_RAW_BASE}models/rock.glb`,
      sculpture: `${REPO_RAW_BASE}models/3DModel.glb`
    };

    // Variables de Escena y Jerarquía de 3 Niveles (Anclaje Piso -> Locomoción -> Modelos)
    let scene, camera, renderer, gltfLoader;
    let reticle, reticleProgressRing;
    let hallAnchorGroup, walkStageGroup, interiorGroup;
    let clippingPlane, leafParticles, leafMaterial;

    // Variables de Detección de Suelo Real (WebXR Hit-Test + Local-Floor + Fallback Geométrico)
    let isWebXRSession = false;
    let hitTestSource = null;
    let hitTestSourceRequested = false;
    let detectedFloorY = 0;
    let floorSurfaceLocked = false;
    let floorLockTimer = 0;
    const FLOOR_AUTO_LOCK_SECONDS = 0.90; // Auto-anclaje al sostener la mirada en el suelo 0.9s

    // Estados de Materialización y Tiempo
    let hallPlaced = false;
    let materializationT = 0;
    let isMaterializing = false;
    let lastFrameTime = performance.now();

    // Locomoción Híbrida (SLAM 6DoF + Podómetro de Paso Largo + Botones Mágicos)
    const MAX_WALK_DISTANCE = 14.5;
    const MIN_WALK_DISTANCE = -1.5;
    const PHYSICAL_STEP_STRIDE = 1.50; // 1.50m de avance virtual por cada paso físico
    const BUTTON_TAP_STRIDE = 1.80;    // 1.80m de avance virtual por toque en botón mágico
    const HOLD_WALK_SPEED = 4.20;      // 4.20 m/s de caminata fluida al mantener presionado

    let cameraVideo = null;
    let targetWalkZ = 0;
    let currentWalkZ = 0;
    let targetWalkX = 0;
    let currentWalkX = 0;
    let moveHoldDir = 0; // +1 avanzando, -1 retrocediendo, 0 libre
    let stepBobPhase = 0;

    // Sensores de Orientación y Vectores Pre-Alocados (Cero Garbage Collection)
    let hasGyro = false;
    let initialAlpha = null;
    const deviceEuler = new THREE.Euler();
    const deviceQuat = new THREE.Quaternion();
    const screenTransform = new THREE.Quaternion();
    const worldTransform = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5));
    const _zAxis = new THREE.Vector3(0, 0, 1);
    const _camWorldPos = new THREE.Vector3();
    const _camWorldDir = new THREE.Vector3();
    const _horizDir = new THREE.Vector3();
    const _localCamPos = new THREE.Vector3();
    const _localLookDir = new THREE.Vector3();
    const _anchorLookTarget = new THREE.Vector3();

    // Grabación Multimedia Ligera (Compositor Cámara + 3D)
    let isRecording = false;
    let mediaRecorder = null;
    let recordedChunks = [];
    let compositeCanvas = null;
    let compositeCtx = null;

    // Elementos UI
    const domOverlay = document.getElementById('ar-overlay');
    const btnEnterAR = document.getElementById('btn-enter-ar');
    const loadingModal = document.getElementById('loading-modal');
    const scannerDot = document.getElementById('scanner-dot');
    const scannerText = document.getElementById('scanner-text');
    const btnPlaceHall = document.getElementById('btn-place-hall');
    const btnPlaceLabel = document.getElementById('btn-place-label');
    const btnRelocateHall = document.getElementById('btn-relocate-hall');
    const walkControls = document.getElementById('walk-controls');
    const mediaControls = document.getElementById('media-controls');
    const btnStepForward = document.getElementById('btn-step-forward');
    const btnStepBack = document.getElementById('btn-step-back');
    const btnStepHome = document.getElementById('btn-step-home');
    const walkDistanceLabel = document.getElementById('walk-distance-label');
    const stepPulseLeft = document.getElementById('step-pulse-left');
    const stepPulseRight = document.getElementById('step-pulse-right');
    const toastBanner = document.getElementById('toast-banner');

    function showToast(msg) {
      toastBanner.textContent = msg;
      toastBanner.style.opacity = '1';
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => { toastBanner.style.opacity = '0'; }, 2600);
    }

    init();

    async function init() {
      const container = document.getElementById('webgl-viewport');
      scene = new THREE.Scene();

      // Cámara a altura humana (1.60m sobre el plano del suelo Y = 0)
      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.08, 85);
      camera.position.set(0, 1.60, 0);
      scene.add(camera);

      renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: true,
        stencil: false,
        powerPreference: 'high-performance',
        preserveDrawingBuffer: false
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      renderer.localClippingEnabled = false;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.12;
      container.appendChild(renderer.domElement);

      renderer.domElement.addEventListener('webglcontextlost', (e) => {
        e.preventDefault();
        showToast('Restaurando memoria gráfica...');
      }, false);

      setupLighting();
      setupFloorReticle();

      // JERARQUÍA DE 3 NIVELES PARA SOPORTAR TANTO ANCLAJE FIJO EN PISO COMO CAMINATA FLUIDA
      // 1. hallAnchorGroup: Fijo en la coordenada exacta del piso físico detectado
      hallAnchorGroup = new THREE.Group();
      hallAnchorGroup.visible = false;
      hallAnchorGroup.frustumCulled = false;
      scene.add(hallAnchorGroup);

      // 2. walkStageGroup: Nodo dinámico que acerca el pasillo cuando el usuario camina o pulsa botones
      walkStageGroup = new THREE.Group();
      walkStageGroup.matrixAutoUpdate = true;
      walkStageGroup.frustumCulled = false;
      hallAnchorGroup.add(walkStageGroup);

      // 3. interiorGroup: Contiene el pasillo nivelado a Y = 0, el pedestal de roca y la escultura
      interiorGroup = new THREE.Group();
      interiorGroup.frustumCulled = false;
      walkStageGroup.add(interiorGroup);

      setupLeafMaterialization();
      await loadModelsParallel();

      btnEnterAR.addEventListener('click', startARExperience);
      btnPlaceHall.addEventListener('click', anchorHallOnDetectedFloor);
      btnRelocateHall.addEventListener('click', resetFloorScanner);

      // Permitir tocar directamente el suelo en pantalla para anclar la sala al instante
      renderer.domElement.addEventListener('click', () => {
        if (!hallPlaced && reticle.visible) {
          anchorHallOnDetectedFloor();
        }
      });

      setupMagicalWalkControls();
      setupMediaCapture();

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }

    function setupLighting() {
      const hemiLight = new THREE.HemisphereLight(0xfef9c3, 0x14532d, 1.45);
      hemiLight.position.set(0, 8, 0);
      scene.add(hemiLight);

      const dirLight = new THREE.DirectionalLight(0xfffbeb, 1.75);
      dirLight.position.set(3, 9, 4);
      scene.add(dirLight);
    }

    // -- RETÍCULA DETECTOR DE SUELO REAL CON ANILLO DE AUTO-LOCK --
    function setupFloorReticle() {
      reticle = new THREE.Group();

      const outerRing = new THREE.Mesh(
        new THREE.RingGeometry(0.24, 0.28, 36).rotateX(-Math.PI / 2),
        new THREE.MeshBasicMaterial({ color: 0x84cc16, side: THREE.DoubleSide })
      );
      const innerRing = new THREE.Mesh(
        new THREE.RingGeometry(0.06, 0.09, 24).rotateX(-Math.PI / 2),
        new THREE.MeshBasicMaterial({ color: 0xfacc15, side: THREE.DoubleSide })
      );
      const centerDisc = new THREE.Mesh(
        new THREE.CircleGeometry(0.24, 32).rotateX(-Math.PI / 2),
        new THREE.MeshBasicMaterial({ color: 0x22c55e, transparent: true, opacity: 0.22, side: THREE.DoubleSide })
      );

      // Anillo que crece al confirmar que el plano es el piso horizontal
      reticleProgressRing = new THREE.Mesh(
        new THREE.RingGeometry(0.10, 0.22, 32).rotateX(-Math.PI / 2),
        new THREE.MeshBasicMaterial({ color: 0xfde047, transparent: true, opacity: 0.65, side: THREE.DoubleSide })
      );
      reticleProgressRing.scale.setScalar(0.01);

      reticle.add(centerDisc, outerRing, innerRing, reticleProgressRing);
      reticle.visible = false;
      scene.add(reticle);
    }

    // -- TEXTURA PROCEDURAL DE HOJA BOTÁNICA --
    function createLeafTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');

      ctx.save();
      ctx.translate(64, 64);

      // Silueta orgánica de hoja de árbol
      ctx.beginPath();
      ctx.moveTo(0, -52);
      ctx.bezierCurveTo(36, -34, 44, 14, 0, 48);
      ctx.bezierCurveTo(-44, 14, -36, -34, 0, -52);
      ctx.closePath();

      const grad = ctx.createLinearGradient(0, -52, 0, 52);
      grad.addColorStop(0, 'rgba(255, 255, 255, 1.0)');
      grad.addColorStop(0.6, 'rgba(240, 255, 240, 0.96)');
      grad.addColorStop(1, 'rgba(215, 245, 215, 0.88)');
      ctx.fillStyle = grad;
      ctx.fill();

      // Nervadura central y pecíolo
      ctx.strokeStyle = 'rgba(170, 210, 160, 0.85)';
      ctx.lineWidth = 2.6;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(0, -46);
      ctx.lineTo(0, 56);
      ctx.stroke();

      // Nervaduras secundarias
      ctx.lineWidth = 1.5;
      const veins = [
        [-18, -16, -2, -26],
        [18, -16, 2, -26],
        [-22, 2, -2, -10],
        [22, 2, 2, -10],
        [-16, 20, -2, 8],
        [16, 20, 2, 8]
      ];
      veins.forEach(([x1, y1, x2, y2]) => {
        ctx.beginPath();
        ctx.moveTo(0, y1 + 8);
        ctx.quadraticCurveTo((x1 + x2) * 0.5, (y1 + y2) * 0.5, x1, y2);
        ctx.stroke();
      });

      ctx.restore();
      const tex = new THREE.CanvasTexture(canvas);
      tex.needsUpdate = true;
      return tex;
    }

    // -- SISTEMA GPU DE MATERIALIZACIÓN CON HOJAS DE ÁRBOLES (VERDE A AMARILLO) --
    function setupLeafMaterialization() {
      // Plano de corte horizontal (se activa únicamente durante los ~2.6s de materialización)
      clippingPlane = new THREE.Plane(new THREE.Vector3(0, -1, 0), 100);

      const leafTexture = createLeafTexture();

      // Paleta botánica del verde selva al amarillo solar
      const palette = [
        new THREE.Color('#15803d'), // Verde bosque profundo
        new THREE.Color('#16a34a'), // Verde hoja esmeralda
        new THREE.Color('#22c55e'), // Verde selva vivo
        new THREE.Color('#65a30d'), // Verde musgo cálido
        new THREE.Color('#84cc16'), // Verde lima fresco
        new THREE.Color('#a3e635'), // Lima amarillento
        new THREE.Color('#eab308'), // Amarillo ocre dorado
        new THREE.Color('#facc15'), // Amarillo brillante
        new THREE.Color('#fde047')  // Amarillo luz cálido
      ];

      // 420 hojas animadas 100% en GPU (1 solo draw call, 0 actualizaciones de CPU por frame)
      const leafCount = 420;
      const geo = new THREE.BufferGeometry();
      const positions = new Float32Array(leafCount * 3);
      const colors = new Float32Array(leafCount * 3);
      const seeds = new Float32Array(leafCount * 3); // [phase, scale, rotSpeed]

      for (let i = 0; i < leafCount; i++) {
        // Distribuir a lo largo de las paredes, piso y bóveda del pasillo (hasta 8.2m para cubrir la escultura 2.5x)
        const side = Math.random() < 0.75 ? (Math.random() < 0.5 ? -1 : 1) * (0.9 + Math.random() * 1.1) : (Math.random() - 0.5) * 2.2;
        const x = side;
        const y = Math.random() * 8.2;
        const z = -Math.random() * 13.4;

        positions[i * 3] = x;
        positions[i * 3 + 1] = y;
        positions[i * 3 + 2] = z;

        const c = palette[Math.floor(Math.random() * palette.length)];
        colors[i * 3] = c.r;
        colors[i * 3 + 1] = c.g;
        colors[i * 3 + 2] = c.b;

        seeds[i * 3] = Math.random() * Math.PI * 2;       // Fase aleatoria
        seeds[i * 3 + 1] = 0.65 + Math.random() * 0.75;   // Tamaño relativo de hoja
        seeds[i * 3 + 2] = (Math.random() - 0.5) * 3.8;   // Velocidad de giro
      }

      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('aColor', new THREE.BufferAttribute(colors, 3));
      geo.setAttribute('aSeed', new THREE.BufferAttribute(seeds, 3));

      leafMaterial = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        uniforms: {
          uMap: { value: leafTexture },
          uTime: { value: 0 },
          uProgress: { value: 0 },
          uOpacity: { value: 1.0 },
          uPixelRatio: { value: renderer.getPixelRatio() }
        },
        vertexShader: `
          attribute vec3 aColor;
          attribute vec3 aSeed;
          varying vec3 vColor;
          varying float vAngle;
          varying float vAlpha;

          uniform float uTime;
          uniform float uProgress;
          uniform float uPixelRatio;

          void main() {
            vColor = aColor;
            float phase = aSeed.x;
            float leafScale = aSeed.y;
            float rotSpeed = aSeed.z;

            vec3 pos = position;

            // Durante la materialización las hojas emergen en remolino acompañando el frente de aparición (8.5m)
            float bandY = uProgress * 8.5;
            float swirl = sin(uTime * 2.4 + phase) * 0.22;
            float flutterZ = cos(uTime * 1.9 + phase) * 0.16;

            pos.x += swirl;
            pos.z += flutterZ;
            pos.y = mod(pos.y + uTime * 0.45, 8.2) * clamp(uProgress * 1.25, 0.15, 1.0);

            // Mayor concentración y brillo justo en la franja donde se materializa el pasillo y la escultura
            float distToWave = abs(pos.y - bandY);
            float waveBoost = smoothstep(1.6, 0.0, distToWave);

            vAngle = phase + uTime * rotSpeed;
            vAlpha = clamp(0.45 + waveBoost * 0.55, 0.0, 1.0);

            vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
            gl_Position = projectionMatrix * mvPosition;

            float baseSize = 72.0 * leafScale * (1.0 + waveBoost * 0.35);
            gl_PointSize = clamp((baseSize * uPixelRatio) / max(-mvPosition.z, 0.4), 6.0, 96.0);
          }
        `,
        fragmentShader: `
          uniform sampler2D uMap;
          uniform float uOpacity;
          varying vec3 vColor;
          varying float vAngle;
          varying float vAlpha;

          void main() {
            vec2 centered = gl_PointCoord - vec2(0.5);
            float c = cos(vAngle);
            float s = sin(vAngle);
            vec2 rotatedUV = vec2(
              centered.x * c - centered.y * s,
              centered.x * s + centered.y * c
            ) + vec2(0.5);

            if (rotatedUV.x < 0.0 || rotatedUV.x > 1.0 || rotatedUV.y < 0.0 || rotatedUV.y > 1.0) discard;

            vec4 texColor = texture2D(uMap, rotatedUV);
            if (texColor.a < 0.15) discard;

            gl_FragColor = vec4(vColor * texColor.rgb, texColor.a * vAlpha * uOpacity);
          }
        `
      });

      leafParticles = new THREE.Points(geo, leafMaterial);
      leafParticles.frustumCulled = false;
      leafParticles.visible = false;
      walkStageGroup.add(leafParticles);
    }

    // -- OPTIMIZACIÓN Y CORRECCIÓN DE MATERIALES PBR DEL PASILLO --
    function fixCorridorMaterial(mat, maxAnisotropy) {
      if (!mat) return;
      const name = (mat.name || '').toLowerCase();
      const cutoutNames = ['alexandrapalm', 'wild bush', 'plantas', 'plant.leaf', 'rejapared', 'leaves', 'orchid', 'sepal'];
      const isCutout = cutoutNames.some(k => name.includes(k));

      if (isCutout) {
        mat.transparent = false;
        mat.alphaTest = 0.42;
        mat.depthWrite = true;
        mat.side = THREE.DoubleSide;
      } else {
        mat.transparent = false;
        mat.alphaTest = 0;
        mat.depthWrite = true;
        mat.side = THREE.FrontSide;
      }

      // Limitar anisotropía a 2 para ahorrar ancho de banda de GPU móvil sin perder nitidez
      ['map', 'normalMap', 'roughnessMap', 'metalnessMap'].forEach((mapKey) => {
        if (mat[mapKey]) {
          mat[mapKey].anisotropy = maxAnisotropy;
        }
      });
    }

    // -- CARGA PARALELA Y NIVELACIÓN MILIMÉTRICA EXCLUSIVA DE LOSAS 'pisoceart' A Y = 0.000 --
    async function loadModelsParallel() {
      await MeshoptDecoder.ready;

      const dracoLoader = new DRACOLoader();
      dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
      gltfLoader = new GLTFLoader();
      gltfLoader.setDRACOLoader(dracoLoader);
      gltfLoader.setMeshoptDecoder(MeshoptDecoder);

      const progressMap = { corridor: 0, rock: 0, sculpture: 0 };
      const updateUIProgress = () => {
        const total = Math.min(99, Math.round((progressMap.corridor * 0.65) + (progressMap.rock * 0.15) + (progressMap.sculpture * 0.20)));
        document.getElementById('progress-bar').style.width = total + '%';
        document.getElementById('progress-text').textContent = total + '%';
      };

      const loadWithProgress = (url, key) =>
        new Promise((resolve, reject) => {
          gltfLoader.load(
            url,
            (gltf) => {
              progressMap[key] = 100;
              updateUIProgress();
              resolve(gltf);
            },
            (xhr) => {
              if (xhr.total > 0) {
                progressMap[key] = (xhr.loaded / xhr.total) * 100;
                updateUIProgress();
              }
            },
            reject
          );
        });

      try {
        const [gltfCorridor, gltfRock, gltfSculpture] = await Promise.all([
          loadWithProgress(MODELS.corridor, 'corridor'),
          loadWithProgress(MODELS.rock, 'rock'),
          loadWithProgress(MODELS.sculpture, 'sculpture')
        ]);

        const corridor = gltfCorridor.scene;
        corridor.scale.setScalar(5.2);
        corridor.updateMatrixWorld(true);

        // Aislar EXCLUSIVAMENTE las losas caminables ('pisoceart1', 'pisoceart1.001', 'pisoceart1.002')
        // ignorando 'stones' o raíces para que el pasillo jamás quede flotando
        const pisoSlabBox = new THREE.Box3();
        const wallBox = new THREE.Box3();
        let hasPisoSlab = false;
        let hasWallMesh = false;

        corridor.traverse((node) => {
          if (node.isMesh) {
            const mName = (node.name || '').toLowerCase();
            const matName = (node.material?.name || '').toLowerCase();
            if (mName.includes('pisoceart') || matName.includes('pisoceart')) {
              pisoSlabBox.expandByObject(node);
              hasPisoSlab = true;
            }
            if (mName.includes('murocear') || matName.includes('murocear')) {
              wallBox.expandByObject(node);
              hasWallMesh = true;
            }
          }
        });

        const fullCorrBox = new THREE.Box3().setFromObject(corridor);
        const refCenter = hasWallMesh ? wallBox.getCenter(new THREE.Vector3()) : fullCorrBox.getCenter(new THREE.Vector3());
        // Nivel exacto de las losas caminables pisoceart1 en Y = 0.000
        const exactFloorSlabY = hasPisoSlab ? pisoSlabBox.min.y : fullCorrBox.min.y;
        const entranceZ = hasWallMesh ? wallBox.max.z : fullCorrBox.max.z;
        const backZ = hasWallMesh ? wallBox.min.z : fullCorrBox.min.z;

        corridor.position.set(
          -refCenter.x,
          -exactFloorSlabY,
          -entranceZ
        );
        corridor.updateMatrixWorld(true);

        const corridorLength = Math.abs(entranceZ - backZ);
        // Ubicación monumental al 68% del fondo del pasillo
        const targetCorridorZ = -(corridorLength * 0.68);

        // Pedestal de roca a escala 2.875 (1.15 * 2.5) apoyado al ras del piso Y = 0
        const rock = gltfRock.scene;
        rock.scale.setScalar(1.15 * 2.5);
        rock.updateMatrixWorld(true);
        const rockBox = new THREE.Box3().setFromObject(rock);
        const rockCenter = rockBox.getCenter(new THREE.Vector3());
        rock.position.set(-rockCenter.x, -rockBox.min.y, targetCorridorZ - rockCenter.z);
        rock.updateMatrixWorld(true);
        const rockHeight = rockBox.max.y - rockBox.min.y;

        // Escultura a escala 4.375 (1.75 * 2.5) sobre la cumbre de la roca
        const sculpture = gltfSculpture.scene;
        sculpture.scale.setScalar(1.75 * 2.5);
        sculpture.updateMatrixWorld(true);
        const sculpBox = new THREE.Box3().setFromObject(sculpture);
        const sculpCenter = sculpBox.getCenter(new THREE.Vector3());
        sculpture.position.set(
          -sculpCenter.x,
          rockHeight - sculpBox.min.y - 0.08,
          targetCorridorZ - sculpCenter.z
        );
        sculpture.updateMatrixWorld(true);

        interiorGroup.add(corridor, rock, sculpture);

        const maxAniso = Math.min(2, renderer.capabilities.getMaxAnisotropy());
        const processedMaterials = new Set();

        interiorGroup.traverse((node) => {
          node.frustumCulled = false;
          node.matrixAutoUpdate = false;
          node.updateMatrix();
          if (node.isMesh && node.material) {
            const mats = Array.isArray(node.material) ? node.material : [node.material];
            mats.forEach((mat) => {
              if (!processedMaterials.has(mat)) {
                fixCorridorMaterial(mat, maxAniso);
                mat.clippingPlanes = [clippingPlane];
                mat.needsUpdate = true;
                processedMaterials.add(mat);
              }
            });
          }
        });

        dracoLoader.dispose();

        document.getElementById('progress-bar').style.width = '100%';
        document.getElementById('progress-text').textContent = '100%';
        document.getElementById('progress-container').classList.add('hidden');
        document.getElementById('loading-message').textContent = 'Sala de exhibición lista para detectar el suelo y explorar.';
        btnEnterAR.classList.remove('hidden');
        btnEnterAR.classList.add('flex');
      } catch (e) {
        console.error('Error cargando modelos:', e);
        document.getElementById('loading-message').textContent = 'Error al cargar modelos: ' + (e.message || 'Recarga la página.');
      }
    }

    // -- CONTROLES FUTURISTAS MÁGICOS DE CAMINATA (PASO LARGO + MANTENER PRESIONADO) --
    function pulseStepIndicators() {
      stepPulseLeft.style.transform = 'scale(1.7)';
      stepPulseRight.style.transform = 'scale(1.7)';
      clearTimeout(pulseStepIndicators._t);
      pulseStepIndicators._t = setTimeout(() => {
        stepPulseLeft.style.transform = 'scale(1)';
        stepPulseRight.style.transform = 'scale(1)';
      }, 180);
    }

    function getLocalCorridorLookDirection() {
      camera.getWorldDirection(_camWorldDir);
      // Transformar dirección de mirada al espacio local del pasillo anclado
      _localLookDir.copy(_camWorldDir). applyQuaternion(hallAnchorGroup.quaternion.clone().invert());
      return _localLookDir;
    }

    function triggerVirtualStride(direction) {
      if (!hallPlaced) return;
      const localDir = getLocalCorridorLookDirection();
      const stepDistance = BUTTON_TAP_STRIDE * direction;
      targetWalkZ = THREE.MathUtils.clamp(targetWalkZ + stepDistance, MIN_WALK_DISTANCE, MAX_WALK_DISTANCE);
      targetWalkX = THREE.MathUtils.clamp(targetWalkX + (localDir.x * 0.40 * direction), -0.80, 0.80);
      stepBobPhase += Math.PI;
      pulseStepIndicators();
    }

    function setupMagicalWalkControls() {
      let holdStartTime = 0;

      const bindWalkButton = (btn, dir) => {
        btn.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          e.stopPropagation();
          holdStartTime = performance.now();
          moveHoldDir = dir;
          btn.classList.add('is-pressing');
        });

        const stopHold = (e) => {
          if (moveHoldDir !== dir) return;
          e.preventDefault();
          e.stopPropagation();
          const elapsed = performance.now() - holdStartTime;
          moveHoldDir = 0;
          btn.classList.remove('is-pressing');
          if (elapsed < 230) {
            triggerVirtualStride(dir);
          }
        };

        btn.addEventListener('pointerup', stopHold);
        btn.addEventListener('pointercancel', stopHold);
        btn.addEventListener('pointerleave', stopHold);
      };

      bindWalkButton(btnStepForward, 1);
      bindWalkButton(btnStepBack, -1);

      btnStepHome.addEventListener('click', (e) => {
        e.stopPropagation();
        targetWalkZ = 0;
        targetWalkX = 0;
        pulseStepIndicators();
        showToast('Regresando a la entrada del pasillo');
      });
    }

    // -- INICIO DE EXPERIENCIA AR (WEBXR HIT-TEST REAL CON FALLBACK CÁMARA + GIROSCOPIO) --
    async function startARExperience() {
      loadingModal.classList.add('hidden');
      domOverlay.classList.add('active');

      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          await DeviceOrientationEvent.requestPermission();
        } catch (_) {}
      }

      setupSensorsAndPedometer();

      // 1. Intentar WebXR 'immersive-ar' con 'local-floor' y 'hit-test' para detección física del suelo
      if (navigator.xr) {
        try {
          const supported = await navigator.xr.isSessionSupported('immersive-ar');
          if (supported) {
            const session = await navigator.xr.requestSession('immersive-ar', {
              optionalFeatures: ['hit-test', 'local-floor', 'dom-overlay'],
              domOverlay: { root: domOverlay }
            });

            isWebXRSession = true;
            try {
              renderer.xr.setReferenceSpaceType('local-floor');
              detectedFloorY = 0;
            } catch (_) {
              renderer.xr.setReferenceSpaceType('local');
              detectedFloorY = -1.55;
            }

            await renderer.xr.setSession(session);

            session.addEventListener('end', () => {
              domOverlay.classList.remove('active');
              window.location.reload();
            });

            lastFrameTime = performance.now();
            renderer.setAnimationLoop(renderLoop);
            return;
          }
        } catch (err) {
          console.warn('WebXR no disponible; activando cámara AR directa con plano de suelo:', err);
          isWebXRSession = false;
        }
      }

      // 2. Fallback universal con cámara trasera 720p (sin requestFullscreen)
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });
        cameraVideo = document.createElement('video');
        cameraVideo.srcObject = stream;
        cameraVideo.setAttribute('playsinline', '');
        cameraVideo.muted = true;
        await cameraVideo.play();
        Object.assign(cameraVideo.style, {
          position: 'fixed',
          inset: '0',
          width: '100%',
          height: '100%',
          objectFit: 'cover',
          zIndex: '0'
        });
        document.body.prepend(cameraVideo);
      } catch (err) {
        console.warn('Vista 3D directa activada:', err);
      }

      detectedFloorY = 0;
      lastFrameTime = performance.now();
      renderer.setAnimationLoop(renderLoop);
    }

    // -- DETECTOR ESTRICTO DEL MERO PISO (DESCARTA PAREDES Y MESAS ALTAS) --
    function updateFloorDetector(frame, dt) {
      let validFloorHit = false;
      camera.getWorldPosition(_camWorldPos);
      camera.getWorldDirection(_camWorldDir);

      if (frame && isWebXRSession) {
        const referenceSpace = renderer.xr.getReferenceSpace();
        const session = renderer.xr.getSession();

        if (!hitTestSourceRequested && session) {
          session.requestReferenceSpace('viewer').then((viewerSpace) => {
            if (session.requestHitTestSource) {
              session.requestHitTestSource({ space: viewerSpace }).then((source) => {
                hitTestSource = source;
              }).catch(() => {});
            }
          }).catch(() => {});
          hitTestSourceRequested = true;
        }

        if (hitTestSource && referenceSpace) {
          const results = frame.getHitTestResults(hitTestSource);
          for (let i = 0; i < results.length; i++) {
            const pose = results[i].getPose(referenceSpace);
            if (!pose) continue;

            const m = pose.transform.matrix;
            const normalY = m[5]; // Componente Y de la normal de la superficie
            const hitY = pose.transform.position.y;

            // Validar que sea un plano horizontal (normalY > 0.72) y esté en el suelo (>0.55m debajo del teléfono)
            if (normalY > 0.72 && hitY < (_camWorldPos.y - 0.55)) {
              reticle.position.set(pose.transform.position.x, hitY, pose.transform.position.z);
              detectedFloorY = hitY;
              validFloorHit = true;
              break;
            }
          }
        }
      }

      // Proyección geométrica al suelo real (Y = detectedFloorY) cuando se apunta hacia abajo
      if (!validFloorHit) {
        const floorY = isWebXRSession ? detectedFloorY : 0;
        const heightAboveFloor = Math.max(0.85, _camWorldPos.y - floorY);

        if (_camWorldDir.y < -0.10) {
          const distToFloor = THREE.MathUtils.clamp(heightAboveFloor / -_camWorldDir.y, 1.35, 3.60);
          reticle.position.set(
            _camWorldPos.x + _camWorldDir.x * distToFloor,
            floorY,
            _camWorldPos.z + _camWorldDir.z * distToFloor
          );
          validFloorHit = _camWorldDir.y < -0.18;
        } else {
          _horizDir.set(_camWorldDir.x, 0, _camWorldDir.z).normalize();
          if (_horizDir.lengthSq() < 0.001) _horizDir.set(0, 0, -1);
          reticle.position.set(
            _camWorldPos.x + _horizDir.x * 1.85,
            floorY,
            _camWorldPos.z + _horizDir.z * 1.85
          );
        }
      }

      reticle.visible = true;

      // Actualizar progreso de bloqueo automático en el suelo (Auto-Lock en 0.9s)
      if (validFloorHit) {
        floorLockTimer = Math.min(FLOOR_AUTO_LOCK_SECONDS, floorLockTimer + dt);
        const lockProgress = floorLockTimer / FLOOR_AUTO_LOCK_SECONDS;
        reticleProgressRing.scale.setScalar(Math.max(0.05, lockProgress));
        scannerDot.className = 'w-2 h-2 rounded-full bg-lime-400';
        scannerText.textContent = `Suelo detectado (${Math.round(lockProgress * 100)}%) · Fijando en el piso...`;
        btnPlaceLabel.textContent = 'Fijar Sala en el Piso Ahora';

        if (floorLockTimer >= FLOOR_AUTO_LOCK_SECONDS && !hallPlaced) {
          anchorHallOnDetectedFloor();
        }
      } else {
        floorLockTimer = Math.max(0, floorLockTimer - dt * 0.5);
        reticleProgressRing.scale.setScalar(Math.max(0.05, floorLockTimer / FLOOR_AUTO_LOCK_SECONDS));
        scannerDot.className = 'w-2 h-2 rounded-full bg-yellow-300';
        scannerText.textContent = 'Inclina un poco hacia el suelo o toca Fijar Sala';
      }
    }

    // -- ANCLAR EL PASILLO EN EL MERO PISO Y ACTIVAR EXPLORACIÓN --
    function anchorHallOnDetectedFloor() {
      if (hallPlaced) return;

      camera.getWorldPosition(_camWorldPos);
      camera.getWorldDirection(_camWorldDir);

      // Posicionar el ancla exactamente sobre la coordenada del suelo detectado
      hallAnchorGroup.matrixAutoUpdate = true;
      hallAnchorGroup.position.copy(reticle.position);

      // Orientar la entrada del pasillo alineada con la dirección horizontal hacia donde mira el usuario
      _horizDir.set(_camWorldDir.x, 0, _camWorldDir.z).normalize();
      if (_horizDir.lengthSq() < 0.001) _horizDir.set(0, 0, -1);

      _anchorLookTarget.set(
        hallAnchorGroup.position.x - _horizDir.x,
        hallAnchorGroup.position.y,
        hallAnchorGroup.position.z - _horizDir.z
      );
      hallAnchorGroup.lookAt(_anchorLookTarget);

      // Bloquear matriz del ancla de suelo para que jamás flote ni derive
      hallAnchorGroup.updateMatrix();
      hallAnchorGroup.updateMatrixWorld(true);
      hallAnchorGroup.matrixAutoUpdate = false;
      hallAnchorGroup.visible = true;

      // Reiniciar etapa de caminata en la entrada del pasillo (0.0m)
      targetWalkZ = 0;
      currentWalkZ = 0;
      targetWalkX = 0;
      currentWalkX = 0;
      walkStageGroup.position.set(0, 0, 0);

      hallPlaced = true;
      reticle.visible = false;

      // Actualizar interfaz a Modo Exploración de Sala
      btnPlaceHall.classList.add('hidden');
      btnRelocateHall.classList.remove('hidden');
      walkControls.classList.remove('hidden');
      mediaControls.classList.remove('hidden');
      scannerDot.className = 'w-2 h-2 rounded-full bg-emerald-400';
      scannerText.textContent = 'Sala fija en el piso · Camina para explorar';

      // Iniciar materialización con hojas de árboles desde la cota exacta del suelo
      renderer.localClippingEnabled = true;
      isMaterializing = true;
      materializationT = 0;
      clippingPlane.constant = hallAnchorGroup.position.y + 0.05;
      leafParticles.visible = true;
      leafMaterial.uniforms.uProgress.value = 0;
      leafMaterial.uniforms.uOpacity.value = 1.0;

      showToast('Sala anclada al ras del suelo · Camina hacia el interior');
    }

    function resetFloorScanner() {
      hallPlaced = false;
      isMaterializing = false;
      floorLockTimer = 0;
      renderer.localClippingEnabled = false;
      hallAnchorGroup.visible = false;
      leafParticles.visible = false;
      targetWalkZ = 0;
      currentWalkZ = 0;
      targetWalkX = 0;
      currentWalkX = 0;
      walkStageGroup.position.set(0, 0, 0);

      btnPlaceHall.classList.remove('hidden');
      btnRelocateHall.classList.add('hidden');
      walkControls.classList.add('hidden');
      mediaControls.classList.add('hidden');
      scannerDot.className = 'w-2 h-2 rounded-full bg-yellow-300';
      scannerText.textContent = 'Apunta al piso para detectar el suelo';
      showToast('Apunta al piso para reubicar la sala');
    }

    // -- GIROSCOPIO + PODÓMETRO BIOMECÁNICO DE ZANCADA LARGA (1.50M POR PASO) --
    function setupSensorsAndPedometer() {
      camera.rotation.set(-0.22, 0, 0, 'YXZ');

      window.addEventListener('deviceorientation', (e) => {
        if (isWebXRSession) return; // En WebXR nativo el tracking 6DoF controla la cámara
        if (e.alpha === null || e.beta === null || e.gamma === null) return;
        hasGyro = true;
        if (initialAlpha === null) initialAlpha = e.alpha;

        const alignedAlpha = THREE.MathUtils.degToRad(e.alpha - initialAlpha);
        const beta = THREE.MathUtils.degToRad(e.beta);
        const gamma = THREE.MathUtils.degToRad(e.gamma);
        const orient = THREE.MathUtils.degToRad(window.screen?.orientation?.angle || window.orientation || 0);

        deviceEuler.set(beta, alignedAlpha, -gamma, 'YXZ');
        deviceQuat.setFromEuler(deviceEuler);
        deviceQuat.multiply(worldTransform);
        deviceQuat.multiply(screenTransform.setFromAxisAngle(_zAxis, -orient));
        camera.quaternion.copy(deviceQuat);
      }, { passive: true });

      // Detector de pasos físicos con filtro paso-bajo (funciona tanto en WebXR como en modo Cámara)
      let filteredMag = 9.81;
      let lastStepTime = 0;

      window.addEventListener('devicemotion', (e) => {
        if (!hallPlaced) return;
        const acc = e.accelerationIncludingGravity || e.acceleration;
        if (!acc) return;

        const ax = acc.x || 0;
        const ay = acc.y || 0;
        const az = acc.z || 0;
        const rawMag = Math.sqrt(ax * ax + ay * ay + az * az);

        filteredMag = filteredMag * 0.80 + rawMag * 0.20;
        const deltaAcc = Math.abs(rawMag - filteredMag);
        const now = performance.now();

        if (deltaAcc > 1.05 && now - lastStepTime > 270) {
          lastStepTime = now;
          const localDir = getLocalCorridorLookDirection();
          // Si el usuario mira hacia el interior del pasillo (localDir.z <= 0.35), avanza; si mira a la salida, retrocede
          const dirSign = localDir.z <= 0.35 ? 1 : -1;
          targetWalkZ = THREE.MathUtils.clamp(
            targetWalkZ + PHYSICAL_STEP_STRIDE * dirSign,
            MIN_WALK_DISTANCE,
            MAX_WALK_DISTANCE
          );
          targetWalkX = THREE.MathUtils.clamp(targetWalkX + localDir.x * 0.35 * dirSign, -0.80, 0.80);
          stepBobPhase += Math.PI;
          pulseStepIndicators();
        }
      }, { passive: true });

      // Respaldo táctil para rotar vista en dispositivos sin giroscopio
      let lastTouchX = null;
      let lastTouchY = null;
      renderer.domElement.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          lastTouchX = e.touches[0].clientX;
          lastTouchY = e.touches[0].clientY;
        }
      }, { passive: true });

      renderer.domElement.addEventListener('touchmove', (e) => {
        if (isWebXRSession || hasGyro || e.touches.length !== 1 || lastTouchX === null) return;
        const dx = e.touches[0].clientX - lastTouchX;
        const dy = e.touches[0].clientY - lastTouchY;
        lastTouchX = e.touches[0].clientX;
        lastTouchY = e.touches[0].clientY;

        camera.rotation.y -= dx * 0.005;
        camera.rotation.x = THREE.MathUtils.clamp(camera.rotation.x - dy * 0.005, -1.2, 0.8);
      }, { passive: true });
    }

    // -- BUCLE PRINCIPAL OPTIMIZADO (DETECCIÓN DE PISO + LOCOMOCIÓN EN 'walkStageGroup') --
    function renderLoop(timestamp, frame) {
      const dt = Math.min(0.05, (timestamp - lastFrameTime) / 1000 || 0.016);
      lastFrameTime = timestamp;
      const timeSec = timestamp * 0.001;

      // FASE 1: Escaneo de Suelo Real antes de anclar la sala
      if (!hallPlaced) {
        updateFloorDetector(frame, dt);
        reticle.rotation.y = timeSec * 1.5;
      }

      // FASE 2: Locomoción Híbrida sobre el eje del pasillo (sin despegar las losas del piso)
      if (hallPlaced) {
        if (moveHoldDir !== 0) {
          const localDir = getLocalCorridorLookDirection();
          targetWalkZ = THREE.MathUtils.clamp(
            targetWalkZ + moveHoldDir * HOLD_WALK_SPEED * dt,
            MIN_WALK_DISTANCE,
            MAX_WALK_DISTANCE
          );
          targetWalkX = THREE.MathUtils.clamp(
            targetWalkX + localDir.x * moveHoldDir * 1.15 * dt,
            -0.80,
            0.80
          );
          stepBobPhase += dt * 10.0;
        }

        // Interpolar suavemente walkStageGroup sobre el plano del suelo (Y se mantiene en 0.000)
        currentWalkZ = THREE.MathUtils.lerp(currentWalkZ, targetWalkZ, 0.12);
        currentWalkX = THREE.MathUtils.lerp(currentWalkX, targetWalkX, 0.12);

        // Desplazar walkStageGroup en +Z acerca el fondo del pasillo (-Z) hacia el visitante
        walkStageGroup.position.set(-currentWalkX, 0, currentWalkZ);

        // Calcular distancia total recorrida (avance físico 6DoF + avance virtual por pasos/botones)
        camera.getWorldPosition(_camWorldPos);
        _localCamPos.copy(_camWorldPos);
        hallAnchorGroup.worldToLocal(_localCamPos);
        const physicalWalkedZ = Math.max(0, -_localCamPos.z);
        const totalDepth = Math.max(0, currentWalkZ + physicalWalkedZ);
        walkDistanceLabel.textContent = `${totalDepth.toFixed(1)} m`;
      }

      // FASE 3: Materialización con Hojas de Árboles (Verdes a Amarillos)
      if (isMaterializing) {
        materializationT = Math.min(1, materializationT + dt * 0.42);
        const revealHeight = materializationT * 8.5;
        clippingPlane.constant = hallAnchorGroup.position.y + revealHeight;

        leafMaterial.uniforms.uTime.value = timeSec;
        leafMaterial.uniforms.uProgress.value = materializationT;
        leafMaterial.uniforms.uOpacity.value = 1.0 - (materializationT * 0.25);

        if (materializationT >= 1) {
          isMaterializing = false;
          renderer.localClippingEnabled = false;
        }
      } else if (hallPlaced && leafParticles.visible) {
        leafMaterial.uniforms.uTime.value = timeSec * 0.55;
        leafMaterial.uniforms.uOpacity.value = Math.max(0, leafMaterial.uniforms.uOpacity.value - dt * 0.35);
        if (leafMaterial.uniforms.uOpacity.value <= 0.02) {
          leafParticles.visible = false;
        }
      }

      renderer.render(scene, camera);

      if (isRecording && compositeCtx) {
        drawCompositeFrame(false);
      }
    }

    // -- COMPOSITOR DE FOTO Y VIDEO LIGERO (960p MÁX, 24 FPS, 1.8 MBPS) --
    function ensureCompositeCanvas() {
      const rawW = renderer.domElement.width;
      const rawH = renderer.domElement.height;
      const maxDim = 960;
      const scale = Math.min(1, maxDim / Math.max(rawW, rawH));
      const w = Math.max(2, Math.floor((rawW * scale) / 2) * 2);
      const h = Math.max(2, Math.floor((rawH * scale) / 2) * 2);

      if (!compositeCanvas) {
        compositeCanvas = document.createElement('canvas');
        compositeCtx = compositeCanvas.getContext('2d', { alpha: false });
      }
      if (compositeCanvas.width !== w || compositeCanvas.height !== h) {
        compositeCanvas.width = w;
        compositeCanvas.height = h;
      }
    }

    function drawCompositeFrame(forceRender = true) {
      if (forceRender) {
        renderer.render(scene, camera);
      }
      ensureCompositeCanvas();
      const w = compositeCanvas.width;
      const h = compositeCanvas.height;

      if (cameraVideo && cameraVideo.readyState >= 2) {
        const vw = cameraVideo.videoWidth || w;
        const vh = cameraVideo.videoHeight || h;
        const scale = Math.max(w / vw, h / vh);
        const sw = vw * scale;
        const sh = vh * scale;
        compositeCtx.drawImage(cameraVideo, (w - sw) / 2, (h - sh) / 2, sw, sh);
      } else {
        compositeCtx.fillStyle = '#070d0b';
        compositeCtx.fillRect(0, 0, w, h);
      }

      compositeCtx.drawImage(renderer.domElement, 0, 0, w, h);
    }

    async function saveOrShareFile(blob, filename, mimeType) {
      const file = new File([blob], filename, { type: mimeType });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({
            files: [file],
            title: 'Sala Leonora Carrington AR'
          });
          return;
        } catch (_) {}
      }
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.download = filename;
      link.href = url;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    }

    function setupMediaCapture() {
      const btnPhoto = document.getElementById('btn-capture-photo');
      const btnVideo = document.getElementById('btn-capture-video');
      const videoLabel = document.getElementById('video-label');
      const videoDot = document.getElementById('video-dot');

      btnPhoto.addEventListener('click', () => {
        drawCompositeFrame(true);
        compositeCanvas.toBlob(async (blob) => {
          if (!blob) return;
          showToast('Guardando fotografía...');
          await saveOrShareFile(blob, `Sala_Leonora_${Date.now()}.jpg`, 'image/jpeg');
        }, 'image/jpeg', 0.92);
      });

      btnVideo.addEventListener('click', () => {
        if (!isRecording) {
          drawCompositeFrame(true);
          const stream = compositeCanvas.captureStream(24);
          const mimeTypes = [
            'video/mp4;codecs=avc1.42E01E',
            'video/mp4',
            'video/webm;codecs=vp8',
            'video/webm'
          ];
          const mimeType = mimeTypes.find((type) => MediaRecorder.isTypeSupported(type)) || '';

          mediaRecorder = new MediaRecorder(
            stream,
            mimeType ? { mimeType, videoBitsPerSecond: 1800000 } : { videoBitsPerSecond: 1800000 }
          );
          recordedChunks = [];

          mediaRecorder.ondataavailable = (e) => {
            if (e.data && e.data.size > 0) recordedChunks.push(e.data);
          };

          mediaRecorder.onstop = async () => {
            const actualMime = mediaRecorder.mimeType || mimeType || 'video/webm';
            const ext = actualMime.includes('mp4') ? 'mp4' : 'webm';
            const blob = new Blob(recordedChunks, { type: actualMime });
            showToast('Guardando video ligero...');
            await saveOrShareFile(blob, `Recorrido_Sala_Leonora_${Date.now()}.${ext}`, actualMime);
          };

          mediaRecorder.start(400);
          isRecording = true;
          videoLabel.textContent = 'Detener';
          videoDot.classList.add('animate-pulse');
          showToast('Grabando recorrido AR...');
        } else {
          mediaRecorder.stop();
          isRecording = false;
          videoLabel.textContent = 'Video';
          videoDot.classList.remove('animate-pulse');
        }
      });
    }

  </script>

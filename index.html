<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Pasillo Xilitla WebAR · Museo Leonora Carrington</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Tipografías Curatoriales -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- Importmap Oficial Three.js r160 -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #070d0b;
      font-family: 'Inter', sans-serif;
      touch-action: none;
    }

    .font-museum {
      font-family: 'Cormorant Garamond', Georgia, serif;
    }

    /* Fondo atmosférico de reserva cuando la cámara no está disponible */
    #outdoor-sky-backdrop {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(circle at 50% 18%, rgba(254, 249, 195, 0.28) 0%, rgba(16, 185, 129, 0.16) 38%, rgba(9, 22, 18, 0.95) 78%, #050b09 100%),
        linear-gradient(180deg, #16332b 0%, #0d1f1a 60%, #050b09 100%);
      pointer-events: none;
      transition: opacity 0.5s ease;
    }

    /* Stream de cámara trasera */
    #ar-camera-video {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.45s ease;
    }

    #ar-camera-video.active {
      opacity: 1;
    }

    /* Lienzo WebGL Three.js */
    #webgl-viewport {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      touch-action: none;
    }

    /* Destello de obturador fotográfico */
    #shutter-flash {
      position: fixed;
      inset: 0;
      z-index: 40;
      background: #ffffff;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease-out;
    }

    /* Interfaz minimalista */
    #ar-dom-overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: env(safe-area-inset-top, 16px) env(safe-area-inset-right, 16px) env(safe-area-inset-bottom, 20px) env(safe-area-inset-left, 16px);
    }

    .interactive {
      pointer-events: auto;
    }

    /* Deslizador elegante y minimalista */
    input[type="range"].minimal-slider {
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      background: rgba(255, 255, 255, 0.22);
      border-radius: 999px;
      outline: none;
    }

    input[type="range"].minimal-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #fde68a;
      border: 2px solid #064e3b;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(251, 191, 36, 0.75);
      transition: transform 0.15s ease;
    }

    input[type="range"].minimal-slider::-webkit-slider-thumb:active {
      transform: scale(1.2);
    }
  </style>
</head>
<body>

  <!-- 1. FONDO ATMOSFÉRICO -->
  <div id="outdoor-sky-backdrop"></div>

  <!-- 2. VIDEO EN VIVO DE CÁMARA TRASERA -->
  <video id="ar-camera-video" autoplay playsinline muted></video>

  <!-- 3. ESCENA 3D WEBGL -->
  <div id="webgl-viewport"></div>

  <!-- 4. FLASH DE CAPTURA DE FOTO -->
  <div id="shutter-flash"></div>

  <!-- 5. PANTALLA DE BIENVENIDA Y CARGA MINIMALISTA -->
  <div id="loading-modal" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-stone-950/95 backdrop-blur-2xl px-6 text-center transition-opacity duration-500">
    <div class="w-12 h-12 mb-4 rounded-full bg-emerald-500/10 border border-amber-300/30 flex items-center justify-center">
      <div class="w-3 h-3 rounded-full bg-amber-300 animate-ping"></div>
    </div>

    <span class="text-[10px] uppercase tracking-[0.28em] text-amber-300/80 font-medium mb-1">
      Experiencia Inmersiva WebAR
    </span>
    <h1 class="font-museum text-3xl sm:text-4xl text-stone-100 tracking-wide mb-2">
      Pasillo Xilitla
    </h1>
    <p id="loading-message" class="text-xs text-stone-400 max-w-xs mb-6 leading-relaxed">
      Preparando arquitectura, roca de altar y escultura...
    </p>

    <!-- Barra de progreso sutil -->
    <div id="progress-container" class="w-56 flex flex-col items-center mb-4">
      <div class="w-full h-1 bg-stone-800 rounded-full overflow-hidden">
        <div id="progress-bar" class="h-full bg-gradient-to-r from-emerald-400 to-amber-300 w-0 transition-all duration-300"></div>
      </div>
      <span id="progress-text" class="text-[10px] font-mono text-stone-500 mt-2">0%</span>
    </div>

    <!-- Reintento en caso de fallo de red -->
    <div id="error-retry-box" class="hidden flex-col items-center gap-3 max-w-xs bg-red-950/50 border border-red-400/30 rounded-2xl p-4 mt-2">
      <p id="error-retry-text" class="text-xs text-red-200"></p>
      <button id="btn-retry-load" class="px-4 py-2 rounded-full bg-amber-300 text-stone-950 font-semibold text-xs">
        Reintentar
      </button>
    </div>

    <!-- Botón único de entrada a la cámara -->
    <div id="start-actions" class="hidden flex-col items-center gap-3 w-full max-w-xs mt-2">
      <button id="btn-start-ar" class="w-full py-3.5 px-6 rounded-full bg-gradient-to-r from-amber-200 via-amber-300 to-emerald-300 hover:opacity-95 active:scale-95 text-stone-950 font-semibold text-xs uppercase tracking-widest shadow-xl flex items-center justify-center gap-2 transition-all">
        <span>Abrir Cámara y Materializar</span>
      </button>
    </div>
  </div>

  <!-- 6. INTERFAZ MINIMALISTA, ELEGANTE Y FUNCIONAL -->
  <div id="ar-dom-overlay">
    <!-- Barra Superior Minimalista -->
    <header class="w-full flex items-center justify-between gap-2">
      <!-- Píldora de estado -->
      <div class="flex items-center gap-2.5 bg-black/45 backdrop-blur-xl border border-white/10 rounded-full px-3.5 py-1.5 shadow-lg">
        <span id="anchor-status-dot" class="w-2 h-2 rounded-full bg-amber-300 animate-pulse"></span>
        <span id="anchor-status-title" class="text-[11px] font-medium text-stone-100 tracking-wide">
          Apunta al piso para desplegar
        </span>
      </div>

      <!-- Indicador de Grabación de Video en Vivo (oculto cuando no graba) -->
      <div id="rec-timer-badge" class="hidden items-center gap-2 bg-red-950/80 backdrop-blur-xl border border-red-400/40 rounded-full px-3.5 py-1.5 shadow-lg">
        <span class="w-2 h-2 rounded-full bg-red-500 animate-ping"></span>
        <span id="rec-timer-text" class="text-[11px] font-mono font-semibold text-red-100">00:00</span>
      </div>

      <!-- Botón discreto para Reubicar y repetir la materialización -->
      <button id="btn-reposition-floor" class="hidden interactive items-center gap-1.5 px-3.5 py-1.5 rounded-full bg-black/45 hover:bg-black/65 active:scale-95 backdrop-blur-xl border border-white/15 text-[11px] font-medium text-stone-200 shadow-lg transition-all">
        <svg class="w-3.5 h-3.5 text-amber-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
        <span>Reubicar</span>
      </button>
    </header>

    <!-- Tarjeta flotante de guardado directo cuando se toma Foto o Video -->
    <div id="media-preview-toast" class="hidden self-center interactive bg-stone-950/90 backdrop-blur-2xl border border-amber-300/35 rounded-2xl p-3 shadow-2xl flex items-center gap-3 max-w-xs w-full transition-all">
      <div id="media-thumb-box" class="w-12 h-12 rounded-xl overflow-hidden bg-stone-900 border border-white/10 shrink-0 flex items-center justify-center">
        <img id="media-thumb-img" class="w-full h-full object-cover hidden" alt="Captura" />
        <video id="media-thumb-vid" class="w-full h-full object-cover hidden" muted loop playsinline></video>
      </div>
      <div class="flex-1 min-w-0">
        <p id="media-toast-title" class="text-xs font-medium text-stone-100 truncate">Guardado en el teléfono</p>
        <p id="media-toast-sub" class="text-[10px] text-stone-400">Alta definición</p>
      </div>
      <button id="btn-share-media" class="px-3 py-1.5 rounded-full bg-amber-300 hover:bg-amber-200 active:scale-95 text-stone-950 font-semibold text-[11px] shrink-0 transition-all">
        Guardar
      </button>
      <button id="btn-close-media-toast" class="p-1 text-stone-400 hover:text-stone-200">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Controles Inferiores Minimalistas: Desplegar / Caminar + Obturador de Foto y Video -->
    <footer class="w-full flex flex-col items-center gap-3">
      <!-- Mensaje sutil de estado -->
      <div id="toast-banner" class="px-4 py-1 rounded-full bg-black/55 backdrop-blur-md border border-white/10 text-stone-200 text-[11px] opacity-0 transition-opacity duration-300 pointer-events-none text-center">
        Listo
      </div>

      <!-- Botón de Despliegue Inicial con Partículas (visible al escanear el piso) -->
      <button id="btn-anchor-floor" class="interactive px-6 py-3 rounded-full bg-gradient-to-r from-amber-200 via-amber-300 to-emerald-300 hover:opacity-95 active:scale-95 text-stone-950 font-semibold text-xs uppercase tracking-widest shadow-2xl flex items-center gap-2 transition-all">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" />
        </svg>
        <span>Materializar Pasillo Aquí</span>
      </button>

      <!-- Barra Principal de Interacción: Recorrido + Captura de Foto y Video -->
      <div class="w-full max-w-md bg-black/50 backdrop-blur-2xl border border-white/15 rounded-3xl px-4 py-3 shadow-2xl flex flex-col gap-3 interactive">
        <!-- Deslizador para caminar dentro del pasillo a escala doble (5.2x) -->
        <div class="flex items-center gap-3 px-1">
          <span class="text-[10px] uppercase tracking-widest text-stone-300/80 font-medium whitespace-nowrap">
            Recorrer
          </span>
          <input
            id="corridor-walk-slider"
            type="range"
            min="-4.2"
            max="6.2"
            step="0.05"
            value="5.6"
            class="minimal-slider w-full"
          />
        </div>

        <!-- Botones Funcionales de Foto y Video -->
        <div class="flex items-center justify-center gap-6 pt-0.5">
          <!-- Botón de Foto (Alta Resolución) -->
          <button id="btn-capture-photo" title="Tomar Foto" class="group flex items-center gap-2 px-4 py-2 rounded-full bg-white/10 hover:bg-white/20 active:scale-95 border border-white/20 text-stone-100 text-xs font-medium transition-all">
            <span class="w-7 h-7 rounded-full bg-white flex items-center justify-center shadow-md group-hover:scale-105 transition-transform">
              <svg class="w-3.5 h-3.5 text-stone-900" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
            </span>
            <span>Foto</span>
          </button>

          <!-- Botón de Video (Grabación directa con audio/ambiente en MP4/WebM) -->
          <button id="btn-capture-video" title="Grabar Video" class="group flex items-center gap-2 px-4 py-2 rounded-full bg-white/10 hover:bg-white/20 active:scale-95 border border-white/20 text-stone-100 text-xs font-medium transition-all">
            <span id="video-btn-indicator" class="w-7 h-7 rounded-full bg-red-500/90 flex items-center justify-center shadow-md group-hover:scale-105 transition-all">
              <span id="video-btn-inner-icon" class="w-2.5 h-2.5 rounded-full bg-white transition-all"></span>
            </span>
            <span id="video-btn-label">Video</span>
          </button>
        </div>
      </div>
    </footer>
  </div>

  <!-- =========================================================================
       MOTOR THREE.JS r160 · ESCALA DOBLE (5.2x) · PARTÍCULAS Y CAPTURA HD
       ========================================================================= -->
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
    import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const REPO_RAW_BASE = 'https://raw.githubusercontent.com/blenderingforconservation-maker/recorridovirtual_Leonora/main/';

    // Escala duplicada del pasillo (5.2x en lugar de 2.6x) y proporciones armónicas
    const SPATIAL_CONFIG = {
      corridorScaleFactor: 5.2,      // Doble del tamaño anterior (ahora ~3.7m ancho libre, ~6.2m alto, ~13.4m largo)
      rockTargetWidth: 1.15,         // Roca proporcional en medio pasillo (x=0, z=0)
      sculptureTargetHeight: 1.75,   // Escultura monumental sobre la cumbre de la roca
      sculptureSeatingEmbed: 0.025,  // Asentamiento orgánico en la cumbre de rock.glb
      visitorEyeHeight: 1.70,        // Altura de vista del espectador
      materializeDuration: 3.6,      // Segundos que dura la materialización con partículas
      urls: {
        corridor: [
          `${REPO_RAW_BASE}models/pasillo_optimizado.glb`,
          'models/pasillo_optimizado.glb'
        ],
        rock: [
          `${REPO_RAW_BASE}models/rock.glb`,
          'models/rock.glb'
        ],
        sculpture: [
          `${REPO_RAW_BASE}models/3DModel.glb`,
          'models/3DModel.glb'
        ]
      }
    };

    const OPAQUE_ARCHITECTURAL_MATERIALS = new Set([
      'murocear',
      'pisoceart1',
      'stones',
      'Rusty Iron (Old Iron)',
      'metal.chrome',
      'plant.wood',
      'Metal',
      'Green Plastic',
      'Green Plastic.001',
      'Pollinium',
      'Blossom Stem',
      'STEM'
    ]);

    const CUTOUT_BOTANICAL_AND_GRILLE_MATERIALS = new Set([
      'AlexandraPalm',
      'Wild Bush_Leaf.038',
      'plantas',
      'plant.leaf',
      'rejapared',
      'Leaves',
      'Orchid Main Petals',
      'Lateral Sepal'
    ]);

    const state = {
      isAnchored: false,
      cameraStreamActive: false,
      xrSession: null,
      xrHitTestSource: null,
      xrRefSpace: null,
      corridorFloorY: 0.0,
      rockTopY: 0.78,
      sculptureTopY: 2.50,
      corridorDimensions: new THREE.Vector3(),
      cameraTransitionActive: false,
      cameraGoalPos: new THREE.Vector3(),
      cameraGoalTarget: new THREE.Vector3(),
      // Estado de materialización progresiva con partículas
      isMaterializing: false,
      materializeProgress: 1.0,
      materializeStartTime: 0,
      maxSceneHeight: 7.8,
      // Estado de grabación de foto y video
      isRecordingVideo: false,
      mediaRecorder: null,
      recordedChunks: [],
      recordingStartTime: 0,
      recordingTimerInterval: null,
      lastCapturedFile: null,
      lastCapturedUrl: null
    };

    // Referencias DOM
    const viewport = document.getElementById('webgl-viewport');
    const videoEl = document.getElementById('ar-camera-video');
    const skyBackdrop = document.getElementById('outdoor-sky-backdrop');
    const shutterFlash = document.getElementById('shutter-flash');
    const loadingModal = document.getElementById('loading-modal');
    const loadingMessage = document.getElementById('loading-message');
    const progressBar = document.getElementById('progress-bar');
    const progressText = document.getElementById('progress-text');
    const progressContainer = document.getElementById('progress-container');
    const errorRetryBox = document.getElementById('error-retry-box');
    const errorRetryText = document.getElementById('error-retry-text');
    const startActions = document.getElementById('start-actions');

    const anchorStatusDot = document.getElementById('anchor-status-dot');
    const anchorStatusTitle = document.getElementById('anchor-status-title');
    const btnAnchorFloor = document.getElementById('btn-anchor-floor');
    const btnRepositionFloor = document.getElementById('btn-reposition-floor');
    const walkSlider = document.getElementById('corridor-walk-slider');
    const toastBanner = document.getElementById('toast-banner');

    const btnCapturePhoto = document.getElementById('btn-capture-photo');
    const btnCaptureVideo = document.getElementById('btn-capture-video');
    const videoBtnIndicator = document.getElementById('video-btn-indicator');
    const videoBtnInnerIcon = document.getElementById('video-btn-inner-icon');
    const videoBtnLabel = document.getElementById('video-btn-label');
    const recTimerBadge = document.getElementById('rec-timer-badge');
    const recTimerText = document.getElementById('rec-timer-text');

    const mediaPreviewToast = document.getElementById('media-preview-toast');
    const mediaThumbImg = document.getElementById('media-thumb-img');
    const mediaThumbVid = document.getElementById('media-thumb-vid');
    const mediaToastTitle = document.getElementById('media-toast-title');
    const mediaToastSub = document.getElementById('media-toast-sub');
    const btnShareMedia = document.getElementById('btn-share-media');
    const btnCloseMediaToast = document.getElementById('btn-close-media-toast');

    // Variables Three.js
    let scene, camera, renderer, controls, gltfLoader;
    let museumPavilionGroup, corridorHolder, rockHolder, sculptureHolder, shadowFloorMesh;
    let floorReticleGroup, mathematicalFloorPlane;
    let revealClippingPlane, sparkleSystem, sparkleMaterial, revealWaveRing;
    const allSceneMaterials = [];
    const floorRaycaster = new THREE.Raycaster();
    const screenFloorNDC = new THREE.Vector2(0, -0.18);
    const clock = new THREE.Clock();

    // Lienzo compositor de alta resolución para guardar Foto y Video (Cámara + 3D)
    const compositeCanvas = document.createElement('canvas');
    const compositeCtx = compositeCanvas.getContext('2d');

    function updateProgress(percent, message) {
      progressBar.style.width = `${percent}%`;
      progressText.textContent = `${percent}%`;
      if (message) loadingMessage.textContent = message;
    }

    function showToast(msg) {
      toastBanner.textContent = msg;
      toastBanner.classList.remove('opacity-0');
      toastBanner.classList.add('opacity-100');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => {
        toastBanner.classList.remove('opacity-100');
        toastBanner.classList.add('opacity-0');
      }, 3000);
    }

    /* =========================================================================
       1. INICIALIZACIÓN DE THREE.JS (CON PRESERVEDRAWINGBUFFER Y CLIPPING)
       ========================================================================= */
    async function initApp() {
      updateProgress(10, 'Inicializando motor 3D y decodificador Meshopt...');

      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(56, window.innerWidth / window.innerHeight, 0.05, 140);
      camera.position.set(0, SPATIAL_CONFIG.visitorEyeHeight, 5.8);

      // preserveDrawingBuffer: true es indispensable para capturar fotos y videos de alta calidad
      renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: true,
        preserveDrawingBuffer: true,
        powerPreference: 'high-performance'
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.25;
      renderer.localClippingEnabled = true; // Habilita el plano de materialización progresiva
      renderer.xr.enabled = true;
      viewport.appendChild(renderer.domElement);

      // Plano de corte que asciende y avanza para materializar todo el escenario poco a poco
      revealClippingPlane = new THREE.Plane(new THREE.Vector3(0, -1, 0), 8.5);

      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.06;
      controls.maxPolarAngle = Math.PI * 0.495;
      controls.minDistance = 0.3;
      controls.maxDistance = 26.0;
      controls.target.set(0, 1.5, 0);

      await MeshoptDecoder.ready;

      const dracoLoader = new DRACOLoader();
      dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');

      gltfLoader = new GLTFLoader();
      gltfLoader.setMeshoptDecoder(MeshoptDecoder);
      gltfLoader.setDRACOLoader(dracoLoader);
      gltfLoader.setCrossOrigin('anonymous');

      setupMuseumLighting();
      setupFloorDetectionReticle();

      museumPavilionGroup = new THREE.Group();
      museumPavilionGroup.name = 'MuseumPavilionStaticRoot';
      scene.add(museumPavilionGroup);

      corridorHolder = new THREE.Group();
      museumPavilionGroup.add(corridorHolder);

      rockHolder = new THREE.Group();
      museumPavilionGroup.add(rockHolder);

      sculptureHolder = new THREE.Group();
      museumPavilionGroup.add(sculptureHolder);

      // Sombra receptora en el piso a escala doble
      const shadowPlaneGeo = new THREE.PlaneGeometry(28, 28);
      const shadowPlaneMat = new THREE.ShadowMaterial({ opacity: 0.4 });
      shadowFloorMesh = new THREE.Mesh(shadowPlaneGeo, shadowPlaneMat);
      shadowFloorMesh.rotation.x = -Math.PI / 2;
      shadowFloorMesh.position.y = 0.001;
      shadowFloorMesh.receiveShadow = true;
      museumPavilionGroup.add(shadowFloorMesh);

      // Sistema de 700 partículas de destellos para la materialización del pasillo
      setupMaterializationParticles();

      setupUIEventListeners();
      window.addEventListener('resize', onWindowResize);

      await loadAllRealModels();

      renderer.setAnimationLoop(renderLoop);
    }

    function setupMuseumLighting() {

    /* =========================================================================
       2. SISTEMA DE PARTÍCULAS DE DESTELLOS Y ONDA DE MATERIALIZACIÓN
       ========================================================================= */
    function setupMaterializationParticles() {
      const particleCount = 700;
      const positions = new Float32Array(particleCount * 3);
      const scales = new Float32Array(particleCount);
      const phases = new Float32Array(particleCount);
      const colors = new Float32Array(particleCount * 3);

      const goldColor = new THREE.Color(0xfef08a);
      const warmAmber = new THREE.Color(0xfbbf24);
      const emeraldGlow = new THREE.Color(0x6ee7b7);

      for (let i = 0; i < particleCount; i++) {
        // Distribuir en el volumen del pasillo duplicado (ancho 4.2m, alto 6.8m, largo 14m)
        positions[i * 3] = (Math.random() - 0.5) * 4.4;
        positions[i * 3 + 1] = Math.random() * 6.8;
        positions[i * 3 + 2] = (Math.random() - 0.5) * 14.0;

        scales[i] = 0.6 + Math.random() * 1.8;
        phases[i] = Math.random() * Math.PI * 2;

        const pick = Math.random();
        const c = pick < 0.55 ? goldColor : (pick < 0.82 ? warmAmber : emeraldGlow);
        colors[i * 3] = c.r;
        colors[i * 3 + 1] = c.g;
        colors[i * 3 + 2] = c.b;
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('aScale', new THREE.BufferAttribute(scales, 1));
      geo.setAttribute('aPhase', new THREE.BufferAttribute(phases, 1));
      geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      // Shader GLSL de estrella brillante de 4 puntas que se concentra en el frente de materialización
      sparkleMaterial = new THREE.ShaderMaterial({
        uniforms: {
          uTime: { value: 0 },
          uRevealY: { value: 8.5 },
          uRevealIntensity: { value: 0.0 },
          uPixelRatio: { value: Math.min(window.devicePixelRatio, 2) }
        },
        vertexShader: `
          attribute float aScale;
          attribute float aPhase;
          attribute vec3 color;
          varying vec3 vColor;
          varying float vAlpha;
          uniform float uTime;
          uniform float uRevealY;
          uniform float uRevealIntensity;
          uniform float uPixelRatio;

          void main() {
            vColor = color;
            vec3 pos = position;

            // Movimiento ascendente suave de los destellos
            float drift = mod(pos.y + uTime * (0.45 + uRevealIntensity * 1.1), 6.8);
            pos.y = drift;
            pos.x += sin(uTime * 1.8 + aPhase) * 0.08;
            pos.z += cos(uTime * 1.5 + aPhase) * 0.08;

            // Concentrar fulgor intenso cerca del borde de materialización
            float distToWave = abs(pos.y - uRevealY);
            float waveBoost = smoothstep(1.8, 0.0, distToWave) * uRevealIntensity;

            // Ocultar partículas por encima del borde aún no materializado durante la aparición
            float aboveCutoff = pos.y > (uRevealY + 0.45) ? 0.0 : 1.0;
            float twinkle = 0.5 + 0.5 * sin(uTime * 5.5 + aPhase * 3.0);

            // Al terminar la materialización queda una bruma sutil de destellos mágicos
            float basePresence = mix(0.24, 1.0, uRevealIntensity);
            vAlpha = aboveCutoff * (twinkle * basePresence + waveBoost * 1.35);

            vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
            gl_Position = projectionMatrix * mvPosition;
            gl_PointSize = (aScale * (22.0 + waveBoost * 34.0) * uPixelRatio) / max(0.4, -mvPosition.z);
          }
        `,
        fragmentShader: `
          varying vec3 vColor;
          varying float vAlpha;

          void main() {
            vec2 uv = gl_PointCoord - vec2(0.5);
            float d = length(uv);
            if (d > 0.5) discard;

            // Núcleo radial + destello de 4 puntas
            float core = smoothstep(0.5, 0.0, d);
            float rays = max(0.0, 1.0 - abs(uv.x * uv.y) * 28.0) * smoothstep(0.5, 0.05, d);
            float strength = pow(core, 1.6) + rays * 0.85;

            gl_FragColor = vec4(vColor + vec3(0.25 * rays), clamp(strength * vAlpha, 0.0, 1.0));
          }
        `,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      });

      sparkleSystem = new THREE.Points(geo, sparkleMaterial);
      museumPavilionGroup.add(sparkleSystem);

      // Onda luminosa horizontal que recorre el pasillo de abajo hacia arriba al materializarse
      const waveEdges = new THREE.RingGeometry(1.8, 2.35, 64);
      const waveMat = new THREE.MeshBasicMaterial({
        color: 0xfde68a,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.0,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      revealWaveRing = new THREE.Mesh(waveEdges, waveMat);
      revealWaveRing.rotation.x = -Math.PI / 2;
      revealWaveRing.scale.set(1.0, 3.0, 1.0);
      museumPavilionGroup.add(revealWaveRing);
    }

    // Inicia la animación de materialización de 3.6 segundos con destellos de partículas
    function triggerMaterializationEffect() {
      state.isMaterializing = true;
      state.materializeProgress = 0.0;
      state.materializeStartTime = performance.now();

      // Reiniciar el plano de corte al nivel del suelo (y = -0.15m)
      const worldFloorY = museumPavilionGroup.position.y;
      revealClippingPlane.constant = worldFloorY - 0.15;
      sparkleMaterial.uniforms.uRevealY.value = -0.15;
      sparkleMaterial.uniforms.uRevealIntensity.value = 1.0;

      if (revealWaveRing) {
        revealWaveRing.visible = true;
        revealWaveRing.position.y = 0.02;
        revealWaveRing.material.opacity = 0.75;
      }
    }

    /* =========================================================================
       3. CARGA REAL DE `pasillo_optimizado.glb`, `rock.glb` Y `3DModel.glb`
       ========================================================================= */
    async function loadGLBWithFallbackUrls(urlCandidates, onProgressCallback) {
      let lastError = null;
      for (const url of urlCandidates) {
        try {
          const gltf = await new Promise((resolve, reject) => {
            gltfLoader.load(url, resolve, onProgressCallback, reject);
          });
          if (gltf && gltf.scene) return gltf;
        } catch (err) {
          lastError = err;
        }
      }
      throw lastError || new Error('No se pudo descargar el modelo 3D.');
    }

    async function loadAllRealModels() {
      errorRetryBox.classList.add('hidden');
      progressContainer.classList.remove('hidden');

      try {
        updateProgress(22, 'Cargando arquitectura del pasillo (escala doble)...');
        const corridorGLTF = await loadGLBWithFallbackUrls(SPATIAL_CONFIG.urls.corridor, (evt) => {
          if (evt.lengthComputable) {
            const pct = Math.min(60, 22 + Math.round((evt.loaded / evt.total) * 38));
            updateProgress(pct);
          }
        });
        assembleRealCorridor(corridorGLTF.scene);

        updateProgress(72, 'Colocando roca de altar a medio pasillo...');
        const rockGLTF = await loadGLBWithFallbackUrls(SPATIAL_CONFIG.urls.rock);
        assembleMidCorridorRock(rockGLTF.scene);

        updateProgress(88, 'Posando escultura sobre la cumbre de la roca...');
        const sculptureGLTF = await loadGLBWithFallbackUrls(SPATIAL_CONFIG.urls.sculpture);
        assembleSculptureOnRock(sculptureGLTF.scene);

        // Registrar todos los materiales del escenario con el plano de corte para la materialización gradual
        registerMaterialsForClipping(museumPavilionGroup);

        updateProgress(100, 'Escenario listo para materializarse en cámara');
        progressContainer.classList.add('hidden');
        startActions.classList.remove('hidden');
        startActions.classList.add('flex');
      } catch (err) {
        console.error('Error cargando modelos reales:', err);
        errorRetryText.textContent = 'No se pudo conectar con el repositorio de modelos. Verifica tu conexión.';
        errorRetryBox.classList.remove('hidden');
        errorRetryBox.classList.add('flex');
      }
    }

    function registerMaterialsForClipping(rootGroup) {
      allSceneMaterials.length = 0;
      rootGroup.traverse((node) => {
        if (node.isMesh && node !== revealWaveRing && node !== shadowFloorMesh) {
          const mats = Array.isArray(node.material) ? node.material : [node.material];
          mats.forEach((m) => {
            if (m && !allSceneMaterials.includes(m)) {
              m.clippingPlanes = [revealClippingPlane];
              m.clipShadows = true;
              m.needsUpdate = true;
              allSceneMaterials.push(m);
            }
          });
        }
      });
    }

    function assembleRealCorridor(corridorRoot) {
      while (corridorHolder.children.length > 0) {
        corridorHolder.remove(corridorHolder.children[0]);
      }

      corridorRoot.position.set(0, 0, 0);
      corridorRoot.rotation.set(0, 0, 0);
      // APLICACIÓN DE DOBLE TAMAÑO (5.2x)
      corridorRoot.scale.setScalar(SPATIAL_CONFIG.corridorScaleFactor);
      corridorRoot.updateMatrixWorld(true);

      const floorMeshes = [];
      let leftWallBox = null;
      let rightWallBox = null;

      corridorRoot.traverse((node) => {
        if (node.isMesh) {
          node.castShadow = true;
          node.receiveShadow = true;

          const nLower = (node.name || '').toLowerCase();
          if (nLower.startsWith('pisoceart1')) {
            floorMeshes.push(node);
          }
          if (node.name === 'murocear') {
            leftWallBox = new THREE.Box3().setFromObject(node);
          } else if (node.name === 'murocear.001') {
            rightWallBox = new THREE.Box3().setFromObject(node);
          }

          const materials = Array.isArray(node.material) ? node.material : [node.material];
          materials.forEach((mat) => {
            if (!mat) return;
            const matName = mat.name || '';

            if (OPAQUE_ARCHITECTURAL_MATERIALS.has(matName)) {
              mat.transparent = false;
              mat.depthWrite = true;
              mat.alphaTest = 0;
              mat.side = THREE.DoubleSide;
              mat.needsUpdate = true;
            } else if (
              CUTOUT_BOTANICAL_AND_GRILLE_MATERIALS.has(matName) ||
              matName.toLowerCase().includes('leaf') ||
              matName.toLowerCase().includes('palm') ||
              matName.toLowerCase().includes('planta') ||
              matName.toLowerCase().includes('reja') ||
              matName.toLowerCase().includes('sepal') ||
              matName.toLowerCase().includes('petal')
            ) {
              mat.transparent = true;
              mat.alphaTest = 0.4;
              mat.depthWrite = true;
              mat.side = THREE.DoubleSide;
              mat.needsUpdate = true;
            } else {
              mat.depthWrite = true;
              mat.side = THREE.DoubleSide;
              mat.needsUpdate = true;
            }
          });
        }
      });

      const fullCorridorBox = new THREE.Box3().setFromObject(corridorRoot);
      const fullCenter = fullCorridorBox.getCenter(new THREE.Vector3());

      let aisleCenterX = fullCenter.x;
      if (leftWallBox && rightWallBox) {
        aisleCenterX = (leftWallBox.max.x + rightWallBox.min.x) * 0.5;
      }

      let floorSurfaceY = fullCorridorBox.min.y;
      if (floorMeshes.length > 0) {
        const combinedFloorBox = new THREE.Box3();
        floorMeshes.forEach((m) => combinedFloorBox.expandByObject(m));
        floorSurfaceY = combinedFloorBox.max.y;
      }

      corridorRoot.position.set(
        -aisleCenterX,
        -floorSurfaceY,
        -fullCenter.z
      );
      corridorRoot.updateMatrixWorld(true);

      corridorHolder.add(corridorRoot);
      corridorHolder.updateMatrixWorld(true);

      const centeredBox = new THREE.Box3().setFromObject(corridorHolder);
      centeredBox.getSize(state.corridorDimensions);
      state.corridorFloorY = 0.0;
      state.maxSceneHeight = Math.max(7.6, centeredBox.max.y + 0.8);
    }

    function assembleMidCorridorRock(rockRoot) {
      while (rockHolder.children.length > 0) {
        rockHolder.remove(rockHolder.children[0]);
      }

      rockRoot.position.set(0, 0, 0);
      rockRoot.rotation.set(0, 0, 0);
      rockRoot.scale.set(1, 1, 1);
      rockRoot.updateMatrixWorld(true);

      const rawBox = new THREE.Box3().setFromObject(rockRoot);
      const rawSize = rawBox.getSize(new THREE.Vector3());
      const rawCenter = rawBox.getCenter(new THREE.Vector3());

      const horizSpan = Math.max(rawSize.x, rawSize.z) || 1;
      const scale = SPATIAL_CONFIG.rockTargetWidth / horizSpan;
      rockRoot.scale.setScalar(scale);

      rockRoot.position.set(
        -rawCenter.x * scale,
        state.corridorFloorY - (rawBox.min.y * scale),
        -rawCenter.z * scale
      );

      rockRoot.traverse((child) => {
        if (child.isMesh) {
          child.castShadow = true;
          child.receiveShadow = true;
          if (child.material) {
            child.material.depthWrite = true;
            child.material.transparent = false;
            child.material.needsUpdate = true;
          }
        }
      });

      rockHolder.add(rockRoot);
      rockHolder.updateMatrixWorld(true);

      const mountedRockBox = new THREE.Box3().setFromObject(rockHolder);
      state.rockTopY = mountedRockBox.max.y;
    }

    function assembleSculptureOnRock(sculptureRoot) {
      while (sculptureHolder.children.length > 0) {
        sculptureHolder.remove(sculptureHolder.children[0]);
      }

      sculptureRoot.position.set(0, 0, 0);
      sculptureRoot.rotation.set(0, 0, 0);
      sculptureRoot.scale.set(1, 1, 1);
      sculptureRoot.updateMatrixWorld(true);

      const rawBox = new THREE.Box3().setFromObject(sculptureRoot);
      const rawSize = rawBox.getSize(new THREE.Vector3());
      const rawCenter = rawBox.getCenter(new THREE.Vector3());

      const heightSpan = rawSize.y || Math.max(rawSize.x, rawSize.z) || 1;
      const scale = SPATIAL_CONFIG.sculptureTargetHeight / heightSpan;
      sculptureRoot.scale.setScalar(scale);

      const targetBaseY = state.rockTopY - SPATIAL_CONFIG.sculptureSeatingEmbed;
      sculptureRoot.position.set(
        -rawCenter.x * scale,
        targetBaseY - (rawBox.min.y * scale),
        -rawCenter.z * scale
      );

      sculptureRoot.traverse((child) => {
        if (child.isMesh) {
          child.castShadow = true;
          child.receiveShadow = true;
          if (child.material) {
            child.material.depthWrite = true;
            child.material.side = THREE.DoubleSide;
            child.material.needsUpdate = true;
          }
        }
      });

      sculptureHolder.add(sculptureRoot);
      sculptureHolder.updateMatrixWorld(true);

      const mountedSculptureBox = new THREE.Box3().setFromObject(sculptureHolder);
      state.sculptureTopY = mountedSculptureBox.max.y;
    }

    /* =========================================================================
       4. DESPLIEGUE FIJO EN EL PISO CON MATERIALIZACIÓN DE PARTÍCULAS
       ========================================================================= */
    function enableFloorScanningMode() {
      state.isAnchored = false;
      museumPavilionGroup.matrixAutoUpdate = true;
      museumPavilionGroup.visible = false; // Oculto mientras se elige el punto del piso para que se materialice al desplegar
      floorReticleGroup.visible = true;

    function deployAndMaterializePavilion() {
      museumPavilionGroup.visible = true;
      museumPavilionGroup.matrixAutoUpdate = true;

      museumPavilionGroup.position.copy(floorReticleGroup.position);
      museumPavilionGroup.rotation.set(0, floorReticleGroup.rotation.y, 0);
      museumPavilionGroup.scale.set(1, 1, 1);

      // Congelar matriz para inmovilidad total en el piso
      museumPavilionGroup.updateMatrix();
      museumPavilionGroup.updateMatrixWorld(true);
      museumPavilionGroup.matrixAutoUpdate = false;

      state.isAnchored = true;
      floorReticleGroup.visible = false;

      anchorStatusDot.className = 'w-2 h-2 rounded-full bg-emerald-400';

      btnAnchorFloor.classList.add('hidden');
      btnRepositionFloor.classList.remove('hidden');
      btnRepositionFloor.classList.add('flex');

      // Disparar la materialización gradual de abajo hacia arriba con partículas
      triggerMaterializationEffect();
    }

    /* =========================================================================
       5. COMPOSITOR EN ALTA DEFINICIÓN PARA FOTO Y VIDEO (CÁMARA + 3D)
       ========================================================================= */
    function renderCompositeFrameToCanvas() {
      const glCanvas = renderer.domElement;
      const width = glCanvas.width;
      const height = glCanvas.height;

      if (compositeCanvas.width !== width || compositeCanvas.height !== height) {
        compositeCanvas.width = width;
        compositeCanvas.height = height;
      }

      // 1. Dibujar el fondo: stream en vivo de la cámara trasera (con recorte object-fit: cover exacto)
      if (state.cameraStreamActive && videoEl.readyState >= 2 && videoEl.videoWidth > 0) {
        const vw = videoEl.videoWidth;
        const vh = videoEl.videoHeight;
        const canvasAspect = width / height;
        const videoAspect = vw / vh;

        let sx = 0, sy = 0, sw = vw, sh = vh;
        if (videoAspect > canvasAspect) {
          sw = vh * canvasAspect;
          sx = (vw - sw) * 0.5;
        } else {
          sh = vw / canvasAspect;
          sy = (vh - sh) * 0.5;
        }
        compositeCtx.drawImage(videoEl, sx, sy, sw, sh, 0, 0, width, height);
      } else {
        // Si la cámara está apagada, dibujar el gradiente atmosférico
        const grad = compositeCtx.createLinearGradient(0, 0, 0, height);
        grad.addColorStop(0, '#16332b');
        grad.addColorStop(0.6, '#0d1f1a');
        grad.addColorStop(1, '#050b09');
        compositeCtx.fillStyle = grad;
        compositeCtx.fillRect(0, 0, width, height);
      }

      // 2. Superponer el render 3D WebGL (pasillo 5.2x, roca, escultura y destellos de partículas)
      compositeCtx.drawImage(glCanvas, 0, 0, width, height);
    }

    // Descarga directa y tarjeta de guardado nativo en el teléfono (iOS / Android)
    function triggerDeviceSaveAndPreview(blob, filename, isVideo = false) {
      if (state.lastCapturedUrl) {
        URL.revokeObjectURL(state.lastCapturedUrl);
      }

      const url = URL.createObjectURL(blob);
      const file = new File([blob], filename, { type: blob.type });
      state.lastCapturedFile = file;
      state.lastCapturedUrl = url;

      // 1. Descarga directa inmediata al almacenamiento del dispositivo
      const link = document.createElement('a');
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);

      // 2. Mostrar vista previa flotante con botón "Guardar" para abrir la hoja nativa de Fotos en iOS/Android
      if (isVideo) {
        mediaThumbImg.classList.add('hidden');
        mediaThumbVid.classList.remove('hidden');
        mediaThumbVid.src = url;
        mediaThumbVid.play().catch(() => {});
        mediaToastTitle.textContent = 'Video guardado';
        mediaToastSub.textContent = 'Toca Guardar para enviar a Galería';
      } else {
        mediaThumbVid.classList.add('hidden');
        mediaThumbImg.classList.remove('hidden');
        mediaThumbImg.src = url;
        mediaToastTitle.textContent = 'Foto guardada';
        mediaToastSub.textContent = 'Toca Guardar para enviar a Fotos';
      }

      mediaPreviewToast.classList.remove('hidden');
    }

    async function captureHighQualityPhoto() {
      // Efecto visual de obturador
      shutterFlash.style.opacity = '0.85';
      setTimeout(() => { shutterFlash.style.opacity = '0'; }, 180);

      // Asegurar render fresco y componer cámara + 3D en máxima resolución
      renderer.render(scene, camera);
      renderCompositeFrameToCanvas();

      compositeCanvas.toBlob((blob) => {
        if (!blob) return;
        const timestamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
        const filename = `Pasillo_Xilitla_${timestamp}.png`;
        triggerDeviceSaveAndPreview(blob, filename, false);
        showToast('Foto guardada en alta resolución');
      }, 'image/png', 1.0);
    }

    function getSupportedVideoMimeType() {
      const candidates = [
        'video/mp4;codecs=avc1.42E01E,mp4a.40.2',
        'video/mp4',
        'video/webm;codecs=vp9',
        'video/webm;codecs=vp8',
        'video/webm'
      ];
      for (const mime of candidates) {
        if (window.MediaRecorder && MediaRecorder.isTypeSupported(mime)) {
          return mime;
        }
      }
      return '';
    }

    function toggleHighQualityVideoRecording() {
      if (state.isRecordingVideo) {
        stopVideoRecording();
      } else {
        startVideoRecording();
      }
    }

    function startVideoRecording() {
      try {
        renderer.render(scene, camera);
        renderCompositeFrameToCanvas();

        const stream = compositeCanvas.captureStream(60);
        const mimeType = getSupportedVideoMimeType();
        const options = { videoBitsPerSecond: 12000000 }; // 12 Mbps para alta nitidez
        if (mimeType) options.mimeType = mimeType;

        state.recordedChunks = [];
        state.mediaRecorder = new MediaRecorder(stream, options);

        state.mediaRecorder.ondataavailable = (e) => {
          if (e.data && e.data.size > 0) {
            state.recordedChunks.push(e.data);
          }
        };

        state.mediaRecorder.onstop = () => {
          const finalMime = state.mediaRecorder.mimeType || mimeType || 'video/webm';
          const ext = finalMime.includes('mp4') ? 'mp4' : 'webm';
          const blob = new Blob(state.recordedChunks, { type: finalMime });
          const timestamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
          const filename = `Recorrido_Xilitla_${timestamp}.${ext}`;
          triggerDeviceSaveAndPreview(blob, filename, true);
          showToast('Video guardado en el teléfono');
        };

        state.mediaRecorder.start(100);
        state.isRecordingVideo = true;
        state.recordingStartTime = performance.now();

        // Actualizar UI de grabación
        videoBtnIndicator.classList.add('animate-pulse');
        videoBtnInnerIcon.className = 'w-2.5 h-2.5 rounded-sm bg-white transition-all';
        videoBtnLabel.textContent = 'Detener';
        recTimerBadge.classList.remove('hidden');
        recTimerBadge.classList.add('flex');
        recTimerText.textContent = '00:00';

        state.recordingTimerInterval = setInterval(() => {
          const elapsedSec = Math.floor((performance.now() - state.recordingStartTime) / 1000);
          const mins = String(Math.floor(elapsedSec / 60)).padStart(2, '0');
          const secs = String(elapsedSec % 60).padStart(2, '0');
          recTimerText.textContent = `${mins}:${secs}`;
        }, 500);

        showToast('Grabando video en alta definición...');
      } catch (err) {
        console.error('Error al iniciar grabación de video:', err);
        showToast('Tu navegador no permite grabar video directo.');
      }
    }

    function stopVideoRecording() {
      if (state.mediaRecorder && state.mediaRecorder.state !== 'inactive') {
        state.mediaRecorder.stop();
      }
      state.isRecordingVideo = false;
      clearInterval(state.recordingTimerInterval);

      videoBtnIndicator.classList.remove('animate-pulse');
      videoBtnInnerIcon.className = 'w-2.5 h-2.5 rounded-full bg-white transition-all';
      videoBtnLabel.textContent = 'Video';
      recTimerBadge.classList.add('hidden');
      recTimerBadge.classList.remove('flex');
    }

    /* =========================================================================
       6. CÁMARA AR Y EVENTOS DE INTERFAZ
       ========================================================================= */
    async function startCameraExperience() {
      loadingModal.classList.add('opacity-0', 'pointer-events-none');

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          },
          audio: false
        });
        videoEl.srcObject = stream;
        await videoEl.play();
        videoEl.classList.add('active');
        skyBackdrop.style.opacity = '0';
        state.cameraStreamActive = true;
      } catch (err) {
        skyBackdrop.style.opacity = '1';
        state.cameraStreamActive = false;
      }

      // Al aparecer en la vista de cámara, desplegar y materializar gradualmente con partículas
      deployAndMaterializePavilion();
    }

    function setupUIEventListeners() {
      document.getElementById('btn-retry-load').addEventListener('click', loadAllRealModels);
      document.getElementById('btn-start-ar').addEventListener('click', startCameraExperience);

      btnAnchorFloor.addEventListener('click', () => {
        deployAndMaterializePavilion();
      });

      btnRepositionFloor.addEventListener('click', () => {
        enableFloorScanningMode();
      });

      // Deslizador para caminar dentro del pasillo a doble escala (+6.2m entrada a -4.2m fondo)
      walkSlider.addEventListener('input', (e) => {
        const zVal = parseFloat(e.target.value);

        if (!state.isAnchored) {
          deployAndMaterializePavilion();
        }

        // Rodeamos suavemente la roca central en medio pasillo (z entre -1.2 y +1.3)
        let lateralAvoidanceX = 0;
        if (zVal > -1.25 && zVal < 1.35) {
          const t = 1 - Math.abs(zVal - 0.05) / 1.3;
          lateralAvoidanceX = 0.88 * Math.max(0, t);
        }

        const lookZ = zVal > 0.6 ? 0.0 : -5.6;
        const lookY = zVal > 0.6 ? (state.rockTopY + 0.75) : 2.1;

        const worldCam = new THREE.Vector3(lateralAvoidanceX, SPATIAL_CONFIG.visitorEyeHeight, zVal);
        const worldTarget = new THREE.Vector3(0, lookY, lookZ);
        museumPavilionGroup.localToWorld(worldCam);
        museumPavilionGroup.localToWorld(worldTarget);

        state.cameraGoalPos.copy(worldCam);
        state.cameraGoalTarget.copy(worldTarget);
        state.cameraTransitionActive = true;
      });

      renderer.domElement.addEventListener('pointerdown', () => {
        state.cameraTransitionActive = false;
      });

      // Controles de Foto y Video
      btnCapturePhoto.addEventListener('click', captureHighQualityPhoto);
      btnCaptureVideo.addEventListener('click', toggleHighQualityVideoRecording);

      // Botón para abrir el menú nativo del teléfono (Guardar en Galería / Compartir)
      btnShareMedia.addEventListener('click', async () => {
        if (state.lastCapturedFile && navigator.canShare && navigator.canShare({ files: [state.lastCapturedFile] })) {
          try {
            await navigator.share({
              files: [state.lastCapturedFile],
              title: 'Pasillo Xilitla WebAR'
            });
            return;
          } catch (err) {
            // Si el usuario cancela el cuadro nativo, mantenemos el enlace directo
          }
        }
        if (state.lastCapturedUrl && state.lastCapturedFile) {
          const a = document.createElement('a');
          a.href = state.lastCapturedUrl;
          a.download = state.lastCapturedFile.name;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
        }
      });

      btnCloseMediaToast.addEventListener('click', () => {
        mediaPreviewToast.classList.add('hidden');
      });
    }

    /* =========================================================================
       7. BUCLE PRINCIPAL DE RENDERIZADO Y ANIMACIÓN DE MATERIALIZACIÓN
       ========================================================================= */
    function renderLoop() {
      const elapsed = clock.getElapsedTime();

      if (sparkleMaterial) {
        sparkleMaterial.uniforms.uTime.value = elapsed;
      }

      // Actualizar animación de materialización progresiva con destellos de partículas
      if (state.isMaterializing) {
        const now = performance.now();
        const t = Math.min(1.0, (now - state.materializeStartTime) / (SPATIAL_CONFIG.materializeDuration * 1000));
        // Curva suave easeInOutCubic
        const eased = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        state.materializeProgress = eased;

        const currentLocalHeight = -0.15 + eased * (state.maxSceneHeight + 0.4);
        const worldFloorY = museumPavilionGroup.position.y;
        revealClippingPlane.constant = worldFloorY + currentLocalHeight;

        if (sparkleMaterial) {
          sparkleMaterial.uniforms.uRevealY.value = currentLocalHeight;
          sparkleMaterial.uniforms.uRevealIntensity.value = 1.0 - Math.pow(t, 2.2) * 0.82;
        }

        if (revealWaveRing) {
          revealWaveRing.position.y = Math.min(currentLocalHeight, state.maxSceneHeight - 0.5);
          revealWaveRing.material.opacity = Math.sin(t * Math.PI) * 0.65;
        }

        if (t >= 1.0) {
          state.isMaterializing = false;
          revealClippingPlane.constant = worldFloorY + 50.0; // Totalmente visible
          if (revealWaveRing) revealWaveRing.visible = false;
          anchorStatusTitle.textContent = 'Escenario fijo en el piso';
          showToast('Pasillo materializado · Usa el control para recorrer');
        }
      }

      // Seguimiento del piso mientras se está en modo Reubicar
      if (!state.isAnchored) {
        floorRaycaster.setFromCamera(screenFloorNDC, camera);
        const hitPoint = new THREE.Vector3();
        const hit = floorRaycaster.ray.intersectPlane(mathematicalFloorPlane, hitPoint);
        if (hit && hitPoint.distanceTo(camera.position) < 20.0) {
          floorReticleGroup.position.set(hitPoint.x, 0, hitPoint.z);
        }
      }

      // Desplazamiento suave del visitante dentro del pasillo fijo
      if (state.cameraTransitionActive) {
        camera.position.lerp(state.cameraGoalPos, 0.08);
        controls.target.lerp(state.cameraGoalTarget, 0.08);
        if (
          camera.position.distanceTo(state.cameraGoalPos) < 0.02 &&
          controls.target.distanceTo(state.cameraGoalTarget) < 0.02
        ) {
          state.cameraTransitionActive = false;
        }
      }

      controls.update();
      renderer.render(scene, camera);

      // Si se está grabando video, componer en tiempo real el video de la cámara + el lienzo 3D
      if (state.isRecordingVideo) {
        renderCompositeFrameToCanvas();
      }
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      if (sparkleMaterial) {
        sparkleMaterial.uniforms.uPixelRatio.value = Math.min(window.devicePixelRatio, 2);
      }
    }

    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Portal WebAR Stencil · Museo Leonora Carrington</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Tipografías Curatoriales -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- Importmap Oficial Three.js r160 -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #070d0b;
      font-family: 'Inter', sans-serif;
    }

    .font-museum {
      font-family: 'Cormorant Garamond', Georgia, serif;
    }

    #webgl-viewport {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    /* WebXR DOM Overlay root - debe ser pointer-events: none, con hijos auto */
    #ar-overlay {
      position: absolute;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      display: none; /* Se muestra al entrar en AR */
      flex-direction: column;
      justify-content: space-between;
      padding: env(safe-area-inset-top, 16px) env(safe-area-inset-right, 16px) env(safe-area-inset-bottom, 20px) env(safe-area-inset-left, 16px);
    }
    
    #ar-overlay.active {
      display: flex;
    }

    .interactive {
      pointer-events: auto;
    }

    /* Píldora Toast de Notificación */
    #toast-banner {
      position: absolute;
      top: 20%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 8px 24px;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 999px;
      color: #fff;
      font-size: 12px;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      text-align: center;
      width: max-content;
    }
  </style>
</head>
<body>

  <!-- Lienzo WebGL Three.js -->
  <div id="webgl-viewport"></div>

  <!-- PANTALLA DE CARGA Y ENTRADA -->
  <div id="loading-modal" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-stone-950 px-6 text-center transition-opacity duration-500">
    <div class="w-12 h-12 mb-4 rounded-full bg-emerald-500/10 border border-amber-300/30 flex items-center justify-center">
      <div class="w-3 h-3 rounded-full bg-amber-300 animate-ping"></div>
    </div>

    <span class="text-[10px] uppercase tracking-[0.28em] text-amber-300/80 font-medium mb-1">
      Portal Interdimensional WebXR
    </span>
    <h1 class="font-museum text-3xl sm:text-4xl text-stone-100 tracking-wide mb-2">
      Pasillo Xilitla
    </h1>
    <p id="loading-message" class="text-xs text-stone-400 max-w-xs mb-6 leading-relaxed">
      Cargando portal y arquitectura mágica...
    </p>

    <!-- Progreso -->
    <div id="progress-container" class="w-56 flex flex-col items-center mb-4">
      <div class="w-full h-1 bg-stone-800 rounded-full overflow-hidden">
        <div id="progress-bar" class="h-full bg-gradient-to-r from-emerald-400 to-amber-300 w-0 transition-all duration-300"></div>
      </div>
      <span id="progress-text" class="text-[10px] font-mono text-stone-500 mt-2">0%</span>
    </div>

    <!-- Botón de Entrada (oculto hasta cargar) -->
    <button id="btn-enter-ar" class="hidden w-full max-w-xs py-3.5 px-6 rounded-full bg-gradient-to-r from-amber-200 via-amber-300 to-emerald-300 hover:opacity-95 text-stone-950 font-semibold text-xs uppercase tracking-widest shadow-xl items-center justify-center gap-2 transition-all">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
      <span>Entrar al Portal AR</span>
    </button>
  </div>

  <!-- WEBXR DOM OVERLAY (UI AR) -->
  <div id="ar-overlay">
    <div id="toast-banner">Iniciando realidad aumentada...</div>
    
    <header class="w-full flex justify-center mt-4">
      <div id="reticle-status" class="flex items-center gap-2.5 bg-black/60 backdrop-blur-xl border border-white/20 rounded-full px-4 py-2 shadow-lg">
        <span class="w-2 h-2 rounded-full bg-amber-300 animate-pulse"></span>
        <span class="text-xs font-medium text-stone-100">Busca el suelo con tu cámara</span>
      </div>
    </header>

    <footer class="w-full flex flex-col items-center gap-4 mb-8">
      <!-- Botón para fijar el portal (Fase Hit-Test) -->
      <button id="btn-place-portal" class="interactive hidden px-8 py-4 rounded-full bg-gradient-to-r from-amber-300 to-emerald-400 hover:opacity-95 text-stone-950 font-bold text-sm uppercase tracking-widest shadow-2xl transition-all">
        Fijar Portal Aquí
      </button>

      <!-- Controles de medios (Fase Exploración) -->
      <div id="media-controls" class="hidden interactive flex gap-6">
        <button id="btn-capture-photo" class="flex items-center gap-2 px-5 py-2.5 rounded-full bg-black/50 border border-white/20 text-white text-xs font-medium backdrop-blur-md">
          <span class="w-6 h-6 rounded-full bg-white flex items-center justify-center"><svg class="w-3 h-3 text-black" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" /></svg></span>
          Foto
        </button>
        <button id="btn-capture-video" class="flex items-center gap-2 px-5 py-2.5 rounded-full bg-black/50 border border-white/20 text-white text-xs font-medium backdrop-blur-md">
          <span id="video-dot" class="w-3 h-3 rounded-full bg-red-500"></span>
          <span id="video-label">Video</span>
        </button>
      </div>
    </footer>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
    import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

    // Rutas
    const REPO_RAW_BASE = 'https://raw.githubusercontent.com/blenderingforconservation-maker/recorridovirtual_Leonora/main/';
    const MODELS = {
      corridor: `${REPO_RAW_BASE}models/pasillo_optimizado.glb`,
      rock: `${REPO_RAW_BASE}models/rock.glb`,
      sculpture: `${REPO_RAW_BASE}models/3DModel.glb`
    };

    // Variables Globales
    let scene, camera, renderer, gltfLoader;
    let hitTestSource = null;
    let hitTestSourceRequested = false;
    
    // Grupos y Elementos 3D
    let reticle, portalGroup, portalFrame, interiorGroup;
    let clippingPlane, magicParticles, particleMaterial;
    
    // Estados
    let portalPlaced = false;
    let isInsidePortal = false;
    let materializationT = 0;
    let isMaterializing = false;
    let isRecording = false;
    let mediaRecorder = null;
    let recordedChunks = [];
    
    const allInteriorMaterials = [];

    // UI Elements
    const domOverlay = document.getElementById('ar-overlay');
    const btnEnterAR = document.getElementById('btn-enter-ar');
    const loadingModal = document.getElementById('loading-modal');
    const btnPlacePortal = document.getElementById('btn-place-portal');
    const reticleStatus = document.getElementById('reticle-status');
    const mediaControls = document.getElementById('media-controls');
    const toastBanner = document.getElementById('toast-banner');

    function showToast(msg) {
      toastBanner.textContent = msg;
      toastBanner.style.opacity = '1';
      setTimeout(() => { toastBanner.style.opacity = '0'; }, 3000);
    }

    init();

    async function init() {
      // 1. Setup Básico Three.js
      const container = document.getElementById('webgl-viewport');
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 100);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true; // Activar WebXR
      renderer.localClippingEnabled = true;
      container.appendChild(renderer.domElement);

      setupLighting();

      // 2. Setup Retícula (Hit-Test)
      const reticleGeo = new THREE.RingGeometry(0.15, 0.2, 32).rotateX(-Math.PI / 2);
      const reticleMat = new THREE.MeshBasicMaterial({ color: 0x6ee7b7 });
      reticle = new THREE.Mesh(reticleGeo, reticleMat);
      reticle.matrixAutoUpdate = false;
      reticle.visible = false;
      scene.add(reticle);

      // 3. Crear Jerarquía del Portal
      portalGroup = new THREE.Group();
      portalGroup.matrixAutoUpdate = false;
      portalGroup.visible = false;
      scene.add(portalGroup);

      interiorGroup = new THREE.Group();
      portalGroup.add(interiorGroup);

      // 4. Crear Marco y Máscara de Stencil
      createSurrealPortalFrame();
      setupStencilMask();
      setupMaterializationMagic();

      // 5. Cargar Modelos
      await loadModels();

      // 6. Configurar Interacciones y WebXR
      btnEnterAR.addEventListener('click', startWebXRSession);
      btnPlacePortal.addEventListener('click', placePortalAtReticle);
      setupMediaCapture();

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }

    function setupLighting() {
      const hemiLight = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
      hemiLight.position.set(0.5, 1, 0.25);
      scene.add(hemiLight);
      const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
      dirLight.position.set(2, 5, 2);
      scene.add(dirLight);
    }

    // -- ESTÉTICA LEONORA CARRINGTON: MARCO DEL PORTAL --
    function createSurrealPortalFrame() {
      portalFrame = new THREE.Group();
      
      const frameMat = new THREE.MeshStandardMaterial({ 
        color: 0xd4af37, // Oro místico
        metalness: 0.9, 
        roughness: 0.2,
        side: THREE.DoubleSide
      });

      // Columnas torcidas surrealistas
      const columnGeo = new THREE.TorusKnotGeometry(0.15, 0.04, 100, 16, 1, 4);
      
      const leftCol = new THREE.Mesh(columnGeo, frameMat);
      leftCol.position.set(-0.8, 1.2, 0);
      leftCol.scale.set(1, 4, 1);
      portalFrame.add(leftCol);

      const rightCol = new THREE.Mesh(columnGeo, frameMat);
      rightCol.position.set(0.8, 1.2, 0);
      rightCol.scale.set(1, 4, 1);
      portalFrame.add(rightCol);

      // Arco superior con orbe esmeralda
      const archGeo = new THREE.TorusGeometry(0.8, 0.06, 16, 50, Math.PI);
      const arch = new THREE.Mesh(archGeo, frameMat);
      arch.position.set(0, 2.3, 0);
      portalFrame.add(arch);

      const orbGeo = new THREE.SphereGeometry(0.15, 32, 32);
      const orbMat = new THREE.MeshStandardMaterial({ color: 0x10b981, emissive: 0x059669, emissiveIntensity: 2 });
      const orb = new THREE.Mesh(orbGeo, orbMat);
      orb.position.set(0, 3.1, 0);
      portalFrame.add(orb);

      // Los elementos del marco externo NUNCA se ocultan por stencil
      portalGroup.add(portalFrame);
    }

    // -- MAGIA DEL STENCIL BUFFER --
    function setupStencilMask() {
      // Un plano invisible exactamente en la entrada del marco
      const maskGeo = new THREE.PlaneGeometry(1.6, 2.5);
      const maskMat = new THREE.MeshBasicMaterial({
        colorWrite: false,   // No dibuja color
        depthWrite: false,   // No escribe profundidad (los objetos detrás se renderizan)
        stencilWrite: true,
        stencilRef: 1,
        stencilFunc: THREE.AlwaysStencilFunc,
        stencilZPass: THREE.ReplaceStencilOp // Marca los pixeles que vemos a través del portal con '1'
      });
      
      const maskMesh = new THREE.Mesh(maskGeo, maskMat);
      maskMesh.position.set(0, 1.25, 0); // Centro de la puerta
      maskMesh.renderOrder = -1; // Renderizar antes que el interior!
      portalGroup.add(maskMesh);
    }

    // -- EFECTO DE MATERIALIZACIÓN Y PARTÍCULAS --
    function setupMaterializationMagic() {
      clippingPlane = new THREE.Plane(new THREE.Vector3(0, -1, 0), 10);
      
      const pGeo = new THREE.BufferGeometry();
      const pCount = 450;
      const pos = new Float32Array(pCount * 3);
      for(let i=0; i<pCount; i++) {
        pos[i*3] = (Math.random() - 0.5) * 4.5;
        pos[i*3+1] = (Math.random() - 0.5) * 2.5;
        pos[i*3+2] = -Math.random() * 10;
      }
      pGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));

      particleMaterial = new THREE.PointsMaterial({
        color: 0xfde68a,
        size: 0.065,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      
      magicParticles = new THREE.Points(pGeo, particleMaterial);
      magicParticles.visible = false;
      portalGroup.add(magicParticles);

      // Aplicar también el plano de corte al marco del portal para que se materialice junto con el pasillo
      portalFrame.traverse((node) => {
        if (node.isMesh && node.material) {
          node.material = node.material.clone();
          node.material.clippingPlanes = [clippingPlane];
        }
      });
    }

    // -- CORRECCIÓN DE MATERIALES PBR DEL PASILLO --
    function fixCorridorMaterial(mat) {
      if (!mat) return;
      const name = (mat.name || '').toLowerCase();
      const cutoutNames = ['alexandrapalm', 'wild bush', 'plantas', 'plant.leaf', 'rejapared', 'leaves', 'orchid', 'sepal'];
      const isCutout = cutoutNames.some(k => name.includes(k));

      if (isCutout) {
        mat.transparent = false;
        mat.alphaTest = 0.4;
        mat.depthWrite = true;
        mat.side = THREE.DoubleSide;
      } else {
        mat.transparent = false;
        mat.alphaTest = 0;
        mat.depthWrite = true;
      }
    }

    // -- CARGA DE MODELOS (PASILLO, ROCA, ESCULTURA) --
    async function loadModels() {
      await MeshoptDecoder.ready;

      const dracoLoader = new DRACOLoader();
      dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
      gltfLoader = new GLTFLoader();
      gltfLoader.setDRACOLoader(dracoLoader);
      gltfLoader.setMeshoptDecoder(MeshoptDecoder);

      const updateProgress = (p) => {
        document.getElementById('progress-bar').style.width = p + '%';
        document.getElementById('progress-text').textContent = p + '%';
      };

      try {
        updateProgress(25);
        const gltfCorridor = await gltfLoader.loadAsync(MODELS.corridor);
        const corridor = gltfCorridor.scene;
        corridor.scale.setScalar(5.2);
        corridor.updateMatrixWorld(true);

        // Alinear la entrada del pasillo en Z = 0 y nivelar el piso en Y = 0
        const corrBox = new THREE.Box3().setFromObject(corridor);
        const corrCenter = corrBox.getCenter(new THREE.Vector3());
        corridor.position.set(
          -corrCenter.x,
          -corrBox.min.y,
          -corrBox.max.z
        );

        const midCorridorZ = -((corrBox.max.z - corrBox.min.z) * 0.5);
        
        updateProgress(60);
        const gltfRock = await gltfLoader.loadAsync(MODELS.rock);
        const rock = gltfRock.scene;
        rock.scale.setScalar(1.15);
        rock.updateMatrixWorld(true);
        const rockBox = new THREE.Box3().setFromObject(rock);
        const rockCenter = rockBox.getCenter(new THREE.Vector3());
        rock.position.set(-rockCenter.x, -rockBox.min.y, midCorridorZ - rockCenter.z);
        const rockHeight = rockBox.max.y - rockBox.min.y;

        updateProgress(90);
        const gltfSculpture = await gltfLoader.loadAsync(MODELS.sculpture);
        const sculpture = gltfSculpture.scene;
        sculpture.scale.setScalar(1.75);
        sculpture.updateMatrixWorld(true);
        const sculpBox = new THREE.Box3().setFromObject(sculpture);
        const sculpCenter = sculpBox.getCenter(new THREE.Vector3());
        sculpture.position.set(
          -sculpCenter.x,
          rockHeight - sculpBox.min.y - 0.03,
          midCorridorZ - sculpCenter.z
        );

        interiorGroup.add(corridor);
        interiorGroup.add(rock);
        interiorGroup.add(sculpture);

        // APLICAR CONFIGURACIÓN DE STENCIL Y CLIPPING A TODOS LOS MATERIALES INTERNOS
        interiorGroup.traverse((node) => {
          if (node.isMesh && node.material) {
            const mats = Array.isArray(node.material) ? node.material : [node.material];
            mats.forEach(mat => {
              fixCorridorMaterial(mat);

              // 1. Clipping plane para materialización
              mat.clippingPlanes = [clippingPlane];
              
              // 2. Stencil Buffer (Solo renderizar si Stencil === 1)
              mat.stencilWrite = true;
              mat.stencilRef = 1;
              mat.stencilFunc = THREE.EqualStencilFunc;
              
              mat.needsUpdate = true;
              allInteriorMaterials.push(mat);
            });
          }
        });

        updateProgress(100);
        document.getElementById('progress-container').classList.add('hidden');
        document.getElementById('loading-message').textContent = "Portal y modelos listos para desplegarse en el suelo.";
        btnEnterAR.classList.remove('hidden');
        btnEnterAR.classList.add('flex');

      } catch (e) {
        console.error("Error cargando modelos:", e);
        document.getElementById('loading-message').textContent = "Error al cargar modelos: " + (e.message || "Recarga la página.");
      }
    }

    // -- WEBXR AR SESSION CON RESPALDO DE CÁMARA AR --
    let fallbackMode = false;
    let fallbackVideo = null;

    async function startWebXRSession() {
      loadingModal.classList.add('hidden');
      
      if (navigator.xr) {
        try {
          const supported = await navigator.xr.isSessionSupported('immersive-ar');
          if (supported) {
            const sessionInit = {
              requiredFeatures: ['hit-test'],
              optionalFeatures: ['dom-overlay'],
              domOverlay: { root: domOverlay }
            };
            const session = await navigator.xr.requestSession('immersive-ar', sessionInit);
            renderer.xr.setReferenceSpaceType('local');
            await renderer.xr.setSession(session);
            
            domOverlay.classList.add('active');
            
            session.addEventListener('end', () => {
              domOverlay.classList.remove('active');
              window.location.reload();
            });

            renderer.setAnimationLoop(renderLoop);
            return;
          }
        } catch (e) {
          console.warn("WebXR immersive-ar no disponible, activando modo AR de respaldo:", e);
        }
      }

      // Respaldo AR con cámara trasera + piso fijo si el navegador no soporta WebXR nativo
      await startFallbackARSession();
    }

    async function startFallbackARSession() {
      fallbackMode = true;
      domOverlay.classList.add('active');

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' } },
          audio: false
        });
        fallbackVideo = document.createElement('video');
        fallbackVideo.srcObject = stream;
        fallbackVideo.setAttribute('playsinline', '');
        fallbackVideo.muted = true;
        await fallbackVideo.play();
        Object.assign(fallbackVideo.style, {
          position: 'fixed',
          inset: '0',
          width: '100%',
          height: '100%',
          objectFit: 'cover',
          zIndex: '0'
        });
        document.body.prepend(fallbackVideo);
      } catch (err) {
        console.warn("Cámara no disponible en vista previa, usando entorno 3D directo.");
      }

      camera.position.set(0, 1.6, 2.5);
      camera.lookAt(0, 0.8, -1);

      reticle.position.set(0, 0, -1.2);
      reticle.updateMatrix();
      reticle.visible = true;
      btnPlacePortal.classList.remove('hidden');
      reticleStatus.querySelector('span:nth-child(2)').textContent = "Suelo detectado · Fija el portal";

      // Permitir caminar hacia adelante/atrás deslizando verticalmente en pantalla
      let lastTouchY = null;
      window.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) lastTouchY = e.touches[0].clientY;
      }, { passive: true });
      window.addEventListener('touchmove', (e) => {
        if (!portalPlaced || lastTouchY === null || e.touches.length !== 1) return;
        const dy = e.touches[0].clientY - lastTouchY;
        lastTouchY = e.touches[0].clientY;
        camera.position.z -= dy * 0.015;
      }, { passive: true });
      window.addEventListener('wheel', (e) => {
        if (!portalPlaced) return;
        camera.position.z += e.deltaY * 0.003;
      }, { passive: true });

      renderer.setAnimationLoop(renderLoop);
    }

    // -- COLOCAR EL PORTAL --
    function placePortalAtReticle() {
      if (!reticle.visible) return;

      // Fijar portal en la matriz de la retícula
      portalGroup.position.setFromMatrixPosition(reticle.matrix);
      portalGroup.quaternion.setFromRotationMatrix(reticle.matrix);
      
      // Bloquear en el suelo
      portalGroup.updateMatrixWorld(true);
      portalGroup.matrixAutoUpdate = false;
      portalGroup.visible = true;
      
      portalPlaced = true;
      reticle.visible = false;

      // UI: Ocultar botón de fijar, mostrar controles
      btnPlacePortal.classList.add('hidden');
      reticleStatus.classList.add('hidden');
      mediaControls.classList.remove('hidden');
      
      // Iniciar Animación de Materialización
      isMaterializing = true;
      materializationT = 0;
      magicParticles.visible = true;
      showToast("Portal fijado en el suelo. Camina hacia su interior.");
    }

    // -- BUCLE DE RENDERIZADO Y LÓGICA ESPACIAL --
    function renderLoop(timestamp, frame) {
      // 1. WebXR Hit-Test (Detectar Suelo)
      if (frame && !portalPlaced && !fallbackMode) {
        const referenceSpace = renderer.xr.getReferenceSpace();
        const session = renderer.xr.getSession();

        if (hitTestSourceRequested === false) {
          session.requestReferenceSpace('viewer').then((refSpace) => {
            session.requestHitTestSource({ space: refSpace }).then((source) => {
              hitTestSource = source;
            });
          });
          hitTestSourceRequested = true;
        }

        if (hitTestSource) {
          const hitTestResults = frame.getHitTestResults(hitTestSource);
          if (hitTestResults.length > 0) {
            const hit = hitTestResults[0];
            reticle.visible = true;
            reticle.matrix.fromArray(hit.getPose(referenceSpace).transform.matrix);
            
            // Si la retícula está visible y el portal no se ha colocado, mostramos el botón
            if (!portalPlaced) {
               btnPlacePortal.classList.remove('hidden');
               reticleStatus.querySelector('span:nth-child(2)').textContent = "Suelo detectado";
            }
          } else {
            reticle.visible = false;
            btnPlacePortal.classList.add('hidden');
            reticleStatus.querySelector('span:nth-child(2)').textContent = "Busca el suelo con tu cámara";
          }
        }
      }

      // 2. Animación de Materialización (Clipping de Abajo hacia Arriba + Partículas Pulsantes)
      if (isMaterializing) {
        materializationT += 0.0055; // Revelado progresivo
        const currentY = -0.5 + materializationT * 6.5; // Sube desde el suelo hasta cubrir todo el pasillo y portal
        clippingPlane.constant = portalGroup.position.y + currentY;
        
        // Mover partículas mágicas y hacerlas pulsar con brillo alquímico
        magicParticles.position.y = currentY * 0.65;
        const pulse = 0.65 + 0.35 * Math.sin(timestamp * 0.012);
        particleMaterial.size = 0.055 + 0.035 * pulse;
        particleMaterial.opacity = Math.max(0, (1 - materializationT * 0.85) * pulse);
        
        if (materializationT >= 1) {
          isMaterializing = false;
          magicParticles.visible = false;
          clippingPlane.constant = 100; // Revelar todo
        }
      }

      // 3. Lógica del Portal (Inside / Outside)
      if (portalPlaced) {
        const camWorldPos = new THREE.Vector3();
        camera.getWorldPosition(camWorldPos);
        
        // Convertir posición de la cámara al espacio local del Portal
        const localPos = portalGroup.worldToLocal(camWorldPos.clone());
        
        // Si Z local < 0, la cámara cruzó el plano de la puerta hacia adentro
        const nowInside = (localPos.z < 0);
        
        if (nowInside !== isInsidePortal) {
          isInsidePortal = nowInside;
          
          allInteriorMaterials.forEach(mat => {
            // Si estás adentro, se desactiva la restricción del stencil (ves todo a tu alrededor)
            // Si sales, se vuelve a restringir a EqualStencilFunc (solo por la puerta)
            mat.stencilFunc = isInsidePortal ? THREE.AlwaysStencilFunc : THREE.EqualStencilFunc;
          });
        }
      }

      renderer.render(scene, camera);
    }

    // -- FUNCIONALIDADES DE CÁMARA Y VIDEO (RENDER CANVAS) --
    // Nota: En WebXR AR, el fondo de la cámara real no está en el canvas por privacidad,
    // se captura la capa 3D (con fondo transparente/negro), que es el estándar WebAR.
    function setupMediaCapture() {
      const btnPhoto = document.getElementById('btn-capture-photo');
      const btnVideo = document.getElementById('btn-capture-video');
      const videoLabel = document.getElementById('video-label');
      const videoDot = document.getElementById('video-dot');

      btnPhoto.addEventListener('click', () => {
        renderer.render(scene, camera);
        const dataURL = renderer.domElement.toDataURL('image/png');
        const link = document.createElement('a');
        link.download = `Portal_Leonora_${Date.now()}.png`;
        link.href = dataURL;
        link.click();
        showToast("Foto 3D guardada.");
      });

      btnVideo.addEventListener('click', () => {
        if (!isRecording) {
          const stream = renderer.domElement.captureStream(30);
          mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
          recordedChunks = [];
          
          mediaRecorder.ondataavailable = e => {
            if(e.data.size > 0) recordedChunks.push(e.data);
          };
          
          mediaRecorder.onstop = () => {
            const blob = new Blob(recordedChunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.download = `Exploracion_Portal_${Date.now()}.webm`;
            link.href = url;
            link.click();
            showToast("Video 3D guardado.");
          };

          mediaRecorder.start();
          isRecording = true;
          videoLabel.textContent = "Detener";
          videoDot.classList.add('animate-ping');
          showToast("Grabando...");
        } else {
          mediaRecorder.stop();
          isRecording = false;
          videoLabel.textContent = "Video";
          videoDot.classList.remove('animate-ping');
        }
      });
    }

  </script>
</body>
